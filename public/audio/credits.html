<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>BlastSimulator2026 - Audio credits</title>
<style>
  :root { --bg: #ffffff; --fg: #1d2127; --muted: #5a6370; --rule: #d5d9df; --link: #0b5cad; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14181d; --fg: #e4e8ee; --muted: #9aa4b2; --rule: #2d343d; --link: #7db7f2; }
  }
  html { background: var(--bg); }
  body { margin: 0 auto; max-width: 52rem; padding: 1rem 16px 3rem; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  h1 { font-size: 1.25rem; margin: 0 0 .25rem; }
  p { margin: 0 0 1rem; color: var(--muted); }
  a { color: var(--link); }
  pre { margin: 0; padding-top: 1rem; border-top: 1px solid var(--rule); white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; }
</style>
</head>
<body>
<h1>Audio credits</h1>
<p>Sound banks used in BlastSimulator2026, with their licences and the attribution they require.</p>
<pre id="credits">Loading...</pre>
<noscript><p>Enable JavaScript to read the credits here, or open <a href="CREDITS.md">CREDITS.md</a> directly.</p></noscript>
<script>
  // Relative URL: works under any host path (the page and CREDITS.md sit side by side in public/audio/).
  fetch('CREDITS.md')
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (text) { document.getElementById('credits').textContent = text; })
    .catch(function () {
      document.getElementById('credits').innerHTML = 'Could not load the credits. Open <a href="CREDITS.md">CREDITS.md</a> directly.';
    });
</script>
</body>
</html>
