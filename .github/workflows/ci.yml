name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    # Default types are [opened, synchronize, reopened] -- `labeled` is not
    # among them. `full-ci`/`build-check` are applied via a separate API call
    # after PR creation (agentic-pipeline-finalization's open-pr step), which
    # fires no `pull_request` event of its own. Without `labeled` here, the
    # `if: contains(...labels..., 'full-ci')` guards on shard-config/
    # scenario-interaction below are evaluated once, at `opened`, before the
    # label exists -- both jobs report `skipped`, not `failure`, so the
    # overall run still reports `success` and agentic-auto-merge treats it as
    # green. PR #615 merged exactly that way; #616 only got its interaction
    # shards because of 30 unrelated follow-up pushes (each a `synchronize`)
    # after the label landed. `labeled` fires the same regardless of draft
    # state and its check run attaches to the head SHA, so a label applied
    # while the PR is still draft is already covered by the time it goes
    # ready -- no `ready_for_review` type needed on top.
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Weekly full run (Monday 4am UTC) to catch regressions
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Run TypeScript type check on scripts/
        run: npx tsc --noEmit --project scripts/tsconfig.json

      - name: Run TypeScript type check on tests/
        run: npx tsc --noEmit --project tests/tsconfig.json

      - name: Validate agent context files
        run: npm run validate:context

  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer Chrome
        run: npx puppeteer browsers install chrome

      - name: Run tests with verbose and JUnit reporters
        run: npx vitest run --reporter=verbose --reporter=junit --outputFile=test-results/junit.xml

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/

  qualimetry:
    name: Syntactic duplication check (jscpd)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run jscpd (fails over the threshold in .jscpd.json)
        run: npm run qualimetry

  # Runs the production build check. Runs only on:
  #   - Push to main (catches build breakage after merge)
  #   - Schedule (weekly full scan)
  #   - workflow_dispatch (manual trigger)
  #   - PRs labeled "build-check" (opts in when the build itself is worth proving —
  #     independent of "full-ci", which drives the interaction-mode scenarios and
  #     implies nothing about the bundle)
  build:
    name: Production build
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'build-check')
    needs:
      - typecheck
      - test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/

  # Runs all scenarios in command mode (fast, no browser).
  # Always runs on every push/PR/schedule/manual trigger.
  scenario-command:
    name: "Scenarios (command mode)"
    runs-on: ubuntu-latest
    needs:
      - typecheck
      - test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run all scenarios (command mode — batch, no browser)
        run: |
          if ! npx tsx scripts/run-all-scenarios.ts; then
            echo ""
            echo "========================================"
            echo "Some command-mode scenarios failed. Check logs above."
            echo "========================================"
            exit 1
          fi
          echo "All scenarios passed in command mode."

  # Resolves the interaction job's shard count. The GitHub Actions expression
  # language has no range/loop primitive, so turning a plain integer variable
  # into a [1..N] matrix array needs one real step, not just an expression —
  # this job is that step. Runs only when scenario-interaction itself would
  # (same condition below), and finishes in seconds (no checkout, no install).
  shard-config:
    name: Resolve interaction shard count
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    outputs:
      shards: ${{ steps.compute.outputs.shards }}
    steps:
      - name: Build [1..N] from the SCENARIO_INTERACTION_SHARDS repo variable
        id: compute
        env:
          RAW: ${{ vars.SCENARIO_INTERACTION_SHARDS }}
        run: |
          # Repo variable holds a plain positive integer, e.g. "8". Falls back
          # to 4 shards when unset or not a positive integer.
          if [[ "$RAW" =~ ^[1-9][0-9]*$ ]]; then
            N="$RAW"
          else
            N=4
          fi
          SHARDS=$(seq 1 "$N" | jq -s -c .)
          echo "Resolved SCENARIO_INTERACTION_SHARDS=\"$RAW\" -> $N shards: $SHARDS"
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"

  # Runs all scenarios in interaction mode (Puppeteer, slow).
  # Runs only on:
  #   - Push to main (catches regressions after merge)
  #   - Schedule (weekly full scan)
  #   - workflow_dispatch (manual trigger)
  #   - PRs labeled "full-ci" (opts in for risky changes)
  scenario-interaction:
    name: "Scenarios (interaction mode) — shard ${{ matrix.shard }}/${{ strategy.job-total }}"
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    needs:
      - typecheck
      - test
      - shard-config
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.shard-config.outputs.shards) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer Chrome
        run: npx puppeteer browsers install chrome

      - name: Build project
        run: npm run build

      - name: Start dev server
        run: |
          npx vite --port 5173 &
          sleep 5
          curl -s http://localhost:5173 > /dev/null || (echo "Dev server failed to start" && exit 1)

      - name: Run scenario shard ${{ matrix.shard }}/${{ strategy.job-total }} (interaction mode — batch, shared browser)
        run: |
          if ! npx tsx scripts/run-all-scenarios.ts --mode interaction --shard ${{ matrix.shard }}/${{ strategy.job-total }}; then
            echo ""
            echo "========================================"
            echo "Some interaction-mode scenarios failed in shard ${{ matrix.shard }}/${{ strategy.job-total }}. Check logs above."
            echo "========================================"
            exit 1
          fi
          echo "Shard ${{ matrix.shard }}/${{ strategy.job-total }} passed in interaction mode."

      - name: Stop dev server
        if: always()
        run: kill $(lsof -t -i:5173) 2>/dev/null || true
