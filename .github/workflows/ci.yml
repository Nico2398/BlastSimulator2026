name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly full run (Monday 4am UTC) to catch regressions
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Run TypeScript type check on scripts/
        run: npx tsc --noEmit --project scripts/tsconfig.json

      - name: Validate agent context files
        run: npm run validate:context

  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer Chrome
        run: npx puppeteer browsers install chrome

      - name: Run tests with verbose and JUnit reporters
        run: npx vitest run --reporter=verbose --reporter=junit --outputFile=test-results/junit.xml

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/

  # Runs the production build check. Runs only on:
  #   - Push to main (catches build breakage after merge)
  #   - Schedule (weekly full scan)
  #   - workflow_dispatch (manual trigger)
  #   - PRs labeled "build-check" (opts in when the build itself is worth proving —
  #     independent of "full-ci", which drives the interaction-mode scenarios and
  #     implies nothing about the bundle)
  build:
    name: Production build
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'build-check')
    needs:
      - typecheck
      - test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/

  # Runs all scenarios in command mode (fast, no browser).
  # Always runs on every push/PR/schedule/manual trigger.
  scenario-command:
    name: "Scenarios (command mode)"
    runs-on: ubuntu-latest
    needs:
      - typecheck
      - test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run all scenarios (command mode — batch, no browser)
        run: |
          if ! npx tsx scripts/run-all-scenarios.ts; then
            echo ""
            echo "========================================"
            echo "Some command-mode scenarios failed. Check logs above."
            echo "========================================"
            exit 1
          fi
          echo "All scenarios passed in command mode."

  # Runs all scenarios in interaction mode (Puppeteer, slow).
  # Runs only on:
  #   - Push to main (catches regressions after merge)
  #   - Schedule (weekly full scan)
  #   - workflow_dispatch (manual trigger)
  #   - PRs labeled "full-ci" (opts in for risky changes)
  scenario-interaction:
    name: "Scenarios (interaction mode) — shard ${{ matrix.shard }}/${{ strategy.job-total }}"
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    needs:
      - typecheck
      - test
    strategy:
      fail-fast: false
      # Shard count comes from the repo variable SCENARIO_INTERACTION_SHARDS
      # (Settings → Secrets and variables → Actions → Variables), a JSON array
      # literal like "[1,2,3,4]" — falls back to 4 shards when unset. Changing
      # shard count is then a variable edit, no workflow change.
      matrix:
        shard: ${{ fromJson(vars.SCENARIO_INTERACTION_SHARDS || '[1,2,3,4]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer Chrome
        run: npx puppeteer browsers install chrome

      - name: Build project
        run: npm run build

      - name: Start dev server
        run: |
          npx vite --port 5173 &
          sleep 5
          curl -s http://localhost:5173 > /dev/null || (echo "Dev server failed to start" && exit 1)

      - name: Run scenario shard ${{ matrix.shard }}/${{ strategy.job-total }} (interaction mode — batch, shared browser)
        run: |
          if ! npx tsx scripts/run-all-scenarios.ts --mode interaction --shard ${{ matrix.shard }}/${{ strategy.job-total }}; then
            echo ""
            echo "========================================"
            echo "Some interaction-mode scenarios failed in shard ${{ matrix.shard }}/${{ strategy.job-total }}. Check logs above."
            echo "========================================"
            exit 1
          fi
          echo "Shard ${{ matrix.shard }}/${{ strategy.job-total }} passed in interaction mode."

      - name: Stop dev server
        if: always()
        run: kill $(lsof -t -i:5173) 2>/dev/null || true
