name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly full run (Monday 4am UTC) to catch regressions
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job starts at t=0. The scenario and build jobs used to wait on the
# unit-test job (`needs: [typecheck, test]`), which put the two longest
# jobs of the run back to back: 4–8 minutes of vitest, then 4–9 minutes of
# browser shards, for a 12–19 minute wall clock (runs 1950–1964, Sep 2026).
# Nothing a shard does depends on the unit suite having passed, and the
# runners are free on a public repository, so the gate bought nothing but
# latency. A red typecheck now shows up alongside the shards instead of
# before them, which is the trade.
jobs:
  typecheck:
    name: TypeScript type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Run TypeScript type check on scripts/
        run: npx tsc --noEmit --project scripts/tsconfig.json

      - name: Run TypeScript type check on tests/
        run: npx tsc --noEmit --project tests/tsconfig.json

      - name: Validate agent context files
        run: npm run validate:context

      # Two locales drift silently: a key added to en.json and forgotten in
      # fr.json renders as its own raw key at runtime, and no test notices.
      # Seconds to run, so it rides along here rather than claiming a runner.
      - name: Check i18n parity (en.json / fr.json)
        run: npm run check:i18n

  # The unit + integration suite, split across runners with vitest's own
  # `--shard`: each runner takes every Nth test file, so the three together
  # run exactly `npm run test` once. One runner took 4–8 minutes for the
  # whole suite; the split brings the job to the length of its slowest
  # shard. No browser is installed here: nothing under tests/unit or
  # tests/integration launches one (tests/scenarios/, which does, is
  # `npm run test:playthrough`, outside vitest.config.ts's include).
  test:
    name: Unit & integration tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run tests with verbose and JUnit reporters
        run: npx vitest run --shard=${{ matrix.shard }}/3 --reporter=verbose --reporter=junit --outputFile=test-results/junit-${{ matrix.shard }}.xml

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/

  qualimetry:
    name: Syntactic duplication check (jscpd)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The diff gate below needs the base branch to compare against, and
          # `merge-base` needs real history to find. A shallow clone resolves
          # neither, and the script fails closed rather than passing on a base
          # it could not read.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run jscpd (fails over the threshold in .jscpd.json)
        run: npm run qualimetry

      # The repo-wide gate above cannot see a copy-paste inside one pull
      # request: a whole-tree budget absorbs 40 duplicated lines without
      # moving. This one measures the change itself — what share of the lines
      # this branch added sit inside a clone, anywhere in the tree.
      - name: Run the diff duplication gate
        run: npm run qualimetry:diff

  coverage:
    name: Coverage thresholds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      # Enforces the per-file thresholds in vitest.config.ts, which nothing
      # ran until now — the `test` job runs the suite without --coverage.
      # vitest.coverage.config.ts holds the two directories this measurement
      # excludes and why; they still run, unexcluded, in that `test` job.
      # Not sharded: the thresholds are per file over the whole suite's
      # coverage, and this vitest (1.6) cannot merge partial coverage
      # reports, so one runner has to see every test.
      - name: Run tests with coverage thresholds
        run: npm run test:coverage

  # Runs the production build check on every push and pull request. It costs
  # ~20 s, and a bundle that breaks on `main` after a merge is a red main
  # nobody gated -- so it is not worth an opt-in label.
  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/

  # Runs all scenarios in command mode (fast, no browser). The runner is
  # `tsx` over src/ directly, so no build precedes it — the bundle is the
  # `build` job's to prove.
  scenario-command:
    name: "Scenarios (command mode)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run all scenarios (command mode — batch, no browser)
        run: |
          if ! npx tsx scripts/run-all-scenarios.ts; then
            echo ""
            echo "========================================"
            echo "Some command-mode scenarios failed. Check logs above."
            echo "========================================"
            exit 1
          fi
          echo "All scenarios passed in command mode."

  # Resolves the interaction job's shard count. The GitHub Actions expression
  # language has no range/loop primitive, so turning a plain integer variable
  # into a [1..N] matrix array needs one real step, not just an expression —
  # this job is that step. Finishes in seconds (no checkout, no install).
  shard-config:
    name: Resolve interaction shard count
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.compute.outputs.shards }}
    steps:
      - name: Build [1..N] from the SCENARIO_INTERACTION_SHARDS repo variable
        id: compute
        env:
          RAW: ${{ vars.SCENARIO_INTERACTION_SHARDS }}
        run: |
          # Repo variable holds a plain positive integer, e.g. "8". Falls back
          # to 4 shards when unset or not a positive integer.
          if [[ "$RAW" =~ ^[1-9][0-9]*$ ]]; then
            N="$RAW"
          else
            N=4
          fi
          SHARDS=$(seq 1 "$N" | jq -s -c .)
          echo "Resolved SCENARIO_INTERACTION_SHARDS=\"$RAW\" -> $N shards: $SHARDS"
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"

  # Runs all scenarios in interaction mode (Puppeteer, slow) on every push
  # and pull request, sharded — never behind a label, a path filter or an
  # `if:`. A browser regression is only found where the browser runs, and
  # `main` has no required check, so a job optional on pull requests first
  # ran on a change at the merge commit: ten red `main` pushes in sixty
  # (Sep 2026), every one only these shards. No diff is exempt — the browser
  # path depends on timing, and a one-line `src/core/` threshold change
  # broke three scenarios (#1068). An `if:` is also a race: evaluated at
  # `opened`, before a label applied a call later exists (#615).
  # `scripts/lib/required-jobs.ts` and `agentic-auto-merge` still ask the
  # run's own jobs that these shards ran and passed, so a job that somehow
  # never runs is a red verdict, not a green one.
  #
  # Each shard derives its own scenario list from the definitions on disk
  # (`selectShard`, scripts/run-all-scenarios-cli.ts): cost-balanced, so a
  # 160 s scenario and the next-heaviest no longer land on one shard by
  # alphabetical accident. The dev server serves src/ straight to the
  # browser, so no build precedes it either.
  scenario-interaction:
    name: "Scenarios (interaction mode) — shard ${{ matrix.shard }}/${{ strategy.job-total }}"
    runs-on: ubuntu-latest
    needs:
      - shard-config
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.shard-config.outputs.shards) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer Chrome
        run: npx puppeteer browsers install chrome

      # Waits on the server answering, not on a fixed sleep: Vite is ready in
      # well under a second here, and the old `sleep 5` was the same five
      # seconds on every shard whether it needed them or not. Bounded, and
      # fails by name when the server never comes up.
      - name: Start dev server
        run: |
          npx vite --port 5173 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173 > /dev/null; then
              echo "Dev server ready after ${i} poll(s)."
              exit 0
            fi
            sleep 0.5
          done
          echo "Dev server failed to start within 30s"
          exit 1

      - name: Run scenario shard ${{ matrix.shard }}/${{ strategy.job-total }} (interaction mode — batch, shared browser)
        run: |
          if ! npx tsx scripts/run-all-scenarios.ts --mode interaction --shard ${{ matrix.shard }}/${{ strategy.job-total }}; then
            echo ""
            echo "========================================"
            echo "Some interaction-mode scenarios failed in shard ${{ matrix.shard }}/${{ strategy.job-total }}. Check logs above."
            echo "========================================"
            exit 1
          fi
          echo "Shard ${{ matrix.shard }}/${{ strategy.job-total }} passed in interaction mode."

      - name: Stop dev server
        if: always()
        run: kill $(lsof -t -i:5173) 2>/dev/null || true
