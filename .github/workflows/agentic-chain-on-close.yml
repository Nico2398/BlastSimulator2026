name: "Pipeline: chain past a run whose deliverable was not a pull request"

# The fourth terminal state — and the only one with nothing listening for it.
#
# A run ends in one of four states, and the queue has to keep moving through
# every one of them: a merged pull request, which `auto-assign-next.yml` chains
# from; `paused` or `blocked`, which `handle-failure.yml` chains from; or — when
# the deliverable was an answer, an executed command or a set of filed issues
# rather than a diff — the issue closed and labelled `done`.
#
# That last one raised nothing any workflow was subscribed to. It opens no pull
# request, so no `pull_request` event fires and `auto-assign-next.yml` stays
# dormant. It applies no halt label, so `handle-failure.yml` never runs. And the
# watchdog only sweeps issues still holding `in-progress`, which a run that
# settles its own issue deliberately drops. The queue went idle with every
# `ready` issue still sitting in it, and nothing anywhere reported that.
#
# On 28 Aug 2026 that stopped the pipeline dead with 23 issues queued. #557
# ended `blocked` and chained correctly to #807 (run 33204199229 — the halt
# chain worked). #807's run filed twelve follow-up issues, #838 through #849,
# then closed itself `done` at 19:41:07 because its deliverable was those issues
# and not a diff. Nothing ran after that. The failure was not a broken chain: it
# was a terminal state that never had a chain attached to it.
#
# `agentic-assign`'s `closed_without_pr` guard was written for precisely this
# case and had never had a caller in the repository's history. This workflow is
# that caller.
#
# This does not make a runner chain to the next issue — that stays forbidden,
# because a run starting the next run is the pipeline deciding to run again on
# its own, and a runner has no view of the queue it would be restarting. The
# chain lives here instead, in a workflow reacting to an event, with the whole
# queue and the cascade brake in view. Same shape as `handle-failure.yml`.
on:
  issues:
    types: [closed]

concurrency:
  # Shared with every other path into the queue, so no two can assign at once.
  #
  # But `issues: closed` fires for every issue closed anywhere in the repository,
  # including the merge path's own close, and GitHub keeps only one *pending*
  # run per group — a second arrival silently cancels the first, zero steps, no
  # trace. #572 and #610 were both a real assignment evicted that way by a no-op
  # that would have resolved `if:` false but claimed the slot on its way to
  # finding out. So the group mirrors the job's `if:` exactly: only an event the
  # job will actually act on contends for the shared name, and everything else
  # gets its own group keyed by this run, where it can evict nothing.
  #
  # This is workflow-level, so the *run* claims the group whatever its jobs do —
  # which is why the mirroring has to happen in this expression and not only in
  # the job's `if:`. It reads nothing but `github`, deliberately: the enable flag
  # is a `vars` lookup, and if `vars` were not in scope here the expression would
  # silently collapse to the no-op arm on every run and this entry point would
  # stop serialising against the other three — the one failure this group exists
  # to prevent, arriving as a passing workflow. The flag gates the steps instead,
  # exactly as `handle-failure.yml` gates its own.
  group: >-
    ${{
      (
        contains(github.event.issue.labels.*.name, 'agent-task') ||
        contains(github.event.issue.labels.*.name, 'in-progress')
      )
        && 'agentic-assignment'
        || format('agentic-chain-on-close-noop-{0}', github.run_id)
    }}
  cancel-in-progress: false

permissions:
  issues: write
  contents: read
  pull-requests: read

jobs:
  chain:
    # Deliberately a superset of what the pipeline normally applies, not an
    # exact match for it. `agent-task` is the marker `agentic-issue-creation`
    # puts on every issue filed for the queue and the one every queued issue
    # carries today — but `assignability.cjs` selects candidates by `ready`, not
    # by `agent-task`, so an issue *can* be assigned without it. Keying on
    # `agent-task` alone would then reproduce this workflow's own bug on that
    # issue: run, close, no chain, silent stall. `in-progress` closes that gap
    # from the other side, since assignment always applies it and a run releasing
    # its own issue closes before dropping it.
    #
    # The real gate is in the action, not here: `closed_without_pr` refuses to
    # chain from an issue that never carried `in-progress`, and refuses again if
    # a pull request is carrying the chain already. This clause only keeps
    # unrelated closes out of the shared concurrency group, so erring wide costs
    # a no-op run and erring narrow costs the queue.
    if: >-
      contains(github.event.issue.labels.*.name, 'agent-task') ||
      contains(github.event.issue.labels.*.name, 'in-progress')
    runs-on: ubuntu-latest
    steps:
      # The assignability rules are read from the workspace, not vendored into
      # the action's YAML, so the repository has to be here.
      - name: Checkout repository
        if: vars.AGENTIC_AUTO_ASSIGN_ENABLED == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      # `closed_without_pr` is what makes this safe to fire on any close: it
      # chains only from an issue that actually held a run and produced no
      # deliverable pull request. A merge-closed issue has one, so the merge
      # event keeps carrying that chain and this run returns having done nothing.
      - name: Assign the next ready issue
        id: assign
        if: vars.AGENTIC_AUTO_ASSIGN_ENABLED == 'true'
        uses: ./.github/actions/agentic-assign
        with:
          token: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
          agent: ${{ vars.AGENTIC_AGENT }}
          # Quoted: an unquoted `#` opens a YAML comment, which silently ate the
          # issue number and the outcome out of this line in the two workflows
          # that had it unquoted.
          reason: "auto-assigned after issue #${{ github.event.issue.number }} closed without a pull request"
          guard: closed_without_pr
          completed_issue: ${{ github.event.issue.number }}
          blocked_chain_limit: ${{ vars.AGENTIC_BLOCKED_CHAIN_LIMIT }}

      - name: Report auto-assign state
        run: |
          if [ "${{ vars.AGENTIC_AUTO_ASSIGN_ENABLED }}" != "true" ]; then
            echo 'Auto-assign is disabled (AGENTIC_AUTO_ASSIGN_ENABLED is not "true").'
          elif [ -n "${{ steps.assign.outputs.issue }}" ]; then
            echo "Assigned issue #${{ steps.assign.outputs.issue }} to ${{ steps.assign.outputs.mention }}."
          elif [ "${{ steps.assign.outputs.halted }}" = "true" ]; then
            echo 'Cascade brake is engaged — the queue is parked. See the notice on the issue.'
          else
            echo "Nothing assigned — see the assign step for the reason."
          fi
