name: "Pipeline: ask the agent to fix a red CI on its own PR"

# The fail-safe for the one outcome the loop had no answer for: a pipeline run
# that ends while its own pull request is red.
#
# `agentic-auto-merge.yml` skips a failed CI run deliberately — there is nothing
# to merge, and sweeping it would only restate a red check as a red workflow. But
# skipping is not reporting, and nothing else was watching either: the PR stays
# open and marked, no merge fires, `auto-assign-next.yml` never chains, and the
# watchdog leaves the issue alone precisely because a pull request is linked to
# it. PR #581 sat exactly there — green on every channel its session ran itself,
# two interaction-mode shards red in CI, session already exited — holding issue
# #552 `in-progress` with the whole queue behind it.
#
# So this workflow closes that gap from the outside, while
# `agentic-pipeline-finalization`'s `[await-ci]` step closes it from the inside.
# Both are needed and neither is redundant: the step is how a live run reads its
# own verdict, and this workflow is what happens when there is no live run left
# to read it — a crashed session, the job timeout, a fix pushed by a run that
# then ran out of budget, a CI run that only reported an hour later.
#
# It is not a new entry point into the assignment queue. It assigns nothing and
# picks nothing: it reacts to one event, on one pull request, and asks the agent
# to finish the pull request it already owns.
on:
  workflow_run:
    # `CI`'s own `completed` event is the direct signal. `Claude Pipeline` /
    # `OpenCode Pipeline` (the runner workflows' declared `name:`) completing
    # is the event-driven replacement for `agentic-watchdog.yml`'s hourly
    # cron sweep: a live session's own `[await-ci]` step is what normally
    # reads a red verdict, and this is what happens when the session ends —
    # for any reason, not just a failed one — before that step ever ran.
    # `scan-after-runner` below is the job that reacts to the runner half;
    # `nudge`'s `if:` is narrowed accordingly so it still only reacts to `CI`.
    workflows: ["CI", "Claude Pipeline", "OpenCode Pipeline"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pipeline PR number whose red CI should be handed back to the agent.'
        required: true
        type: string
      force_retry:
        description: >-
          Repeat a nudge even if this exact CI run id was already commented
          about. Set only by `agentic-watchdog.yml`'s hourly re-raise, whose
          retry is for a handback no session ever picked up — never set this
          from `scan-after-runner`'s automatic, potentially-concurrent scan,
          which must not double-post. A human retrying by hand opts in the
          same way.
        required: false
        type: boolean
        default: false

permissions:
  issues: write
  pull-requests: write
  contents: read
  actions: read

jobs:
  nudge:
    # A green CI needs nothing from this workflow, and a cancelled one is not a
    # verdict about the code. Narrowed to `CI` specifically (not any
    # `workflow_run`) so a runner's own completion — success or failure, it
    # ended for reasons this job cannot see — is never misread as a CI
    # failure: `scan-after-runner` handles that event instead, on its own
    # branch/SHA/run-id lookup.
    if: >-
      vars.AGENTIC_CI_FIX_ENABLED != 'false' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.name == 'CI' && github.event.workflow_run.conclusion == 'failure'))
    # Deliberately excludes `Claude Pipeline` / `OpenCode Pipeline` completing —
    # those two route to `scan-after-runner` below instead, never here.
    runs-on: ubuntu-latest
    concurrency:
      group: agentic-ci-failure-${{ inputs.pr || github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      # Checked out for the live-session guard below, which reads runner runs
      # through `issue-api.cjs` and decides whose they are with
      # `run-liveness.cjs` — the same two modules `agentic-recover-blocked`
      # uses, so the two guards cannot disagree about what "live" means.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      # The PAT, not GITHUB_TOKEN, and for once the mention is the point. A
      # comment created with GITHUB_TOKEN is authored by `github-actions[bot]`,
      # and both runners filter `comment.user.type != 'Bot'` — so the nudge would
      # be posted and nothing would read it. This is the second comment in the
      # whole pipeline allowed to carry an agent mention, after the assignment
      # comment; see `agentic-autonomous-pipeline`'s github-loop reference.
      - name: Hand the failure back to the agent that owns the PR
        uses: actions/github-script@v7
        env:
          AGENTIC_AGENT: ${{ vars.AGENTIC_AGENT }}
          ATTEMPT_LIMIT: ${{ vars.AGENTIC_CI_FIX_ATTEMPT_LIMIT }}
          DISPATCH_PR: ${{ inputs.pr }}
          FORCE_RETRY: ${{ inputs.force_retry }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          github-token: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Same normalisation as `agentic-assign`: an unrecognised value is
            // a misconfiguration, and posting a mention nothing answers would
            // read as "the agent was asked and ignored it".
            const configured = (process.env.AGENTIC_AGENT || '@opencode').trim().replace(/^@/, '').toLowerCase();
            if (configured !== 'claude' && configured !== 'opencode') {
              core.setFailed(`AGENTIC_AGENT is \`${configured}\` — expected @claude or @opencode.`);
              return;
            }
            const mention = `@${configured}`;

            // The pipeline's own branch is the whole scope of this workflow. CI
            // failing on `main`, on a human's branch, or on a harness branch is
            // somebody else's problem and must not summon an agent.
            //
            // The `-<runId>` suffix is not optional decoration: since #554 every
            // branch a run creates carries its own run id, so `pipeline/feature-769`
            // is the shorthand and `pipeline/feature-769-32908623869` is what is
            // actually on the remote. This pattern was anchored `-(\d+)$` and so
            // matched none of them — the entire outside fail-safe had been dead
            // for every real pipeline PR, silently, which is why PR #773's red
            // check reached a human instead of an agent. Both halves match, and
            // the issue number is group 1 either way.
            const PIPELINE_HEAD = /^pipeline\/feature-(\d+)(?:-\d+)?$/;

            // What counts as a channel, which conclusions are red, and one run
            // per workflow, newest — `cancel-in-progress` leaves superseded runs
            // on the same head forever, and counting those makes every pushed
            // fix permanently red. One module decides all three for every
            // reader of a pull request's head: this fail-safe, the merge gate,
            // and the scan below.
            const { RUN_FAILURES, latestPerWorkflow } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/ci-handback.cjs`
            );

            const dispatched = parseInt(process.env.DISPATCH_PR || '', 10);
            let pr;
            let ciRunId = parseInt(process.env.RUN_ID || '', 10);

            if (!Number.isNaN(dispatched)) {
              pr = (await github.rest.pulls.get({ owner, repo, pull_number: dispatched })).data;
            } else {
              const head = (process.env.HEAD_BRANCH || '').trim();
              if (!PIPELINE_HEAD.test(head)) {
                core.info(`CI reported on ${head || '(no branch)'}, which is not a pipeline PR head. Nothing to do.`);
                return;
              }
              const open = await github.rest.pulls.list({
                owner, repo, state: 'open', head: `${owner}:${head}`, per_page: 10
              });
              pr = open.data[0];
              if (!pr) {
                core.info(`No open pull request from ${head}. It merged, closed, or was never opened.`);
                return;
              }
              // A run reporting on a commit that is no longer the head has
              // already been answered: something pushed a fix, and that push's
              // own CI run is the one whose verdict counts. Nudging on the old
              // one would ask the agent to fix a failure it may have just fixed.
              const reported = (process.env.HEAD_SHA || '').trim();
              if (reported && pr.head.sha !== reported) {
                core.info(
                  `#${pr.number}: CI reported on ${reported.slice(0, 7)} but the head is now ` +
                  `${pr.head.sha.slice(0, 7)} — superseded, its own run decides.`
                );
                return;
              }
            }

            const match = PIPELINE_HEAD.exec(pr.head?.ref || '');
            if (!match) {
              core.info(`#${pr.number}: head ${pr.head?.ref} is not a pipeline feature branch. Nothing to do.`);
              return;
            }
            const issueNumber = parseInt(match[1], 10);

            if (pr.state !== 'open') {
              core.info(`#${pr.number}: ${pr.state}, nothing to fix.`);
              return;
            }
            // A draft is the pipeline saying a channel is red and stayed red —
            // it has already been escalated, and its issue has already been
            // released. Nudging it would restart a conversation a human owns.
            if (pr.draft) {
              core.info(`#${pr.number}: draft — the run already reported a channel it could not turn green.`);
              return;
            }

            // The opt-out, and the honest half of the live-session guard below.
            // That guard can only see the two runner workflows, so a session
            // driven from the web app, the desktop app, or a human at a terminal
            // is invisible to it — and nudging then wakes a second worker onto a
            // branch somebody is already fixing. "Is a human working on this" is
            // not observable from the Actions API, so it is declared rather than
            // detected: this label says hands off, and the fail-safe believes it.
            const HOLD_LABEL = 'ci-fix-hold';
            const labels = (pr.labels || []).map((label) => (typeof label === 'string' ? label : label.name));
            if (labels.includes(HOLD_LABEL)) {
              core.info(
                `#${pr.number}: carries \`${HOLD_LABEL}\` — somebody owns this red CI already. ` +
                'Remove the label to hand it back to the agent.'
              );
              return;
            }

            // ── The guard that makes this safe to fire on every red CI ──
            // A session that is still running on this work is already waiting
            // on this very verdict: `agentic-pipeline-finalization`'s
            // `[await-ci]` step reads it and loops. Commenting now would queue a
            // second runner on this pull request, and two sessions would push to
            // one branch. The check covers the whole runner job, not just its
            // agent step, so a run in its rescue or recovery steps still counts
            // as live.
            //
            // **This work, not any work.** Several sessions can be live at once
            // (`AGENTIC_MAX_PARALLEL_RUNS`), and before runs carried their
            // entity in `run-name` this guard declined whenever *any* runner run
            // was live — which, with sessions always running, would have been
            // forever: a dead session's red PR never handed back to anyone. A
            // run is this PR's when it names the issue the head was built for
            // or the pull request itself; a run whose identity cannot be read
            // counts too (`runConcerns` in `run-liveness.cjs`).
            //
            // Skipping here is not dropping the failure: `agentic-watchdog.yml`
            // sweeps open pipeline PRs whose CI is red and dispatches this
            // workflow again, and `scan-after-runner` below re-scans the moment
            // a runner finishes, so a PR whose verdict landed while its session
            // was live is picked up instead of waiting for a human.
            const liveness = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/run-liveness.cjs`);
            const { createIssueApi } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/issue-api.cjs`);
            const api = createIssueApi(github, { owner, repo, log: core.info });
            const runner = await api.runnerRuns();
            if (runner.unknown) {
              core.setFailed(
                `#${pr.number}: the runner workflows' runs could not be read, so a live session on this ` +
                'pull request cannot be ruled out. Not commenting; the watchdog re-raises it.'
              );
              return;
            }
            const live = liveness.liveRunFor(runner.runs, [
              { kind: 'issue', number: issueNumber },
              { kind: 'pr', number: pr.number },
            ]);
            if (live) {
              core.info(
                `#${pr.number}: runner run ${live.id} (\`${live.display_title}\`) is ${live.status} on this ` +
                'work — its session reads this verdict itself. Not commenting.'
              );
              return;
            }

            // Anything else falls back to the default rather than disabling the
            // brake — same rule as `AGENTIC_BLOCKED_CHAIN_LIMIT`.
            const configuredLimit = parseInt(process.env.ATTEMPT_LIMIT || '', 10);
            const limit = Number.isInteger(configuredLimit) && configuredLimit > 0 ? configuredLimit : 3;

            // The event this workflow answers, identified. On the `workflow_run`
            // path it is the run that woke us. On a dispatch — a human, the
            // merge gate, or the watchdog re-raising a PR whose CI reported
            // while a session was live — there is no such run, so the head is
            // read here, and it must actually be red or conflicting: a dispatch
            // is a request to look, never evidence.
            //
            // **A conflict with the base is the same kind of failure.** The
            // merge gate merges only a head that contains the base's tip, and
            // with several sessions live the base moves under every open pull
            // request. A PR that conflicts with it can neither be brought up to
            // date by the gate nor merged, and before this nothing handed it to
            // anyone: the gate went red, this fail-safe found every channel
            // green and said "nothing to fix". Only a dispatch asks about it —
            // the `workflow_run` path answers a CI run and nothing else — and
            // `dirty` is GitHub's own verdict, read here rather than trusted
            // from whoever dispatched.
            //
            // **Every channel on the head, not just `ci.yml`.** This used to look
            // up one workflow by path, so a red check any other workflow emitted
            // was invisible to the fail-safe — which is precisely how PR #773's
            // `closing-keyword-guard` failure reached nobody while `ci.yml` itself
            // was green. What blocks a merge is a failing run, whichever file
            // emitted it.
            const dispatchedLookup = Number.isNaN(ciRunId);
            let redRuns = [];
            let conflict = null;
            if (dispatchedLookup && pr.mergeable_state === 'dirty') {
              const { data: base } = await github.rest.repos.getBranch({ owner, repo, branch: pr.base.ref });
              conflict = { base: pr.base.ref, sha: base.commit.sha };
            } else if (dispatchedLookup) {
              const onHead = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner, repo, head_sha: pr.head.sha, per_page: 100
              });
              const channels = latestPerWorkflow(onHead);
              if (channels.length === 0) {
                core.info(`#${pr.number}: no channel has reported on ${pr.head.sha.slice(0, 7)} yet. Nothing to hand back.`);
                return;
              }
              redRuns = channels.filter(
                (run) => run.status === 'completed' && RUN_FAILURES.has(run.conclusion)
              );
              if (redRuns.length === 0) {
                const stillGoing = channels.filter((run) => run.status !== 'completed');
                core.info(
                  stillGoing.length > 0
                    ? `#${pr.number}: ${stillGoing.length} channel(s) still running on ${pr.head.sha.slice(0, 7)}, none red. Nothing to hand back.`
                    : `#${pr.number}: every channel on ${pr.head.sha.slice(0, 7)} reported green. Nothing to fix.`
                );
                return;
              }
              // The marker names one run, so the newest red one identifies the
              // handback; the comment below still lists the jobs of all of them.
              ciRunId = redRuns.map((run) => run.id).sort((a, b) => b - a)[0];
            } else {
              redRuns = [{ id: ciRunId }];
            }

            // ── Idempotency, and the brake ──
            // Both read off the PR's own comments, so no state is kept anywhere
            // else and nothing has to be cleaned up. The marker names the commit
            // and the CI run the handback was raised for — or, for a conflict,
            // the commit and the base tip it conflicts with: the same conflict
            // is one question, and the base moving on is a new one.
            //
            // **No clock anywhere in here.** Duration thresholds are the wrong
            // tool for this: a cooldown long enough for today's CI is a stall
            // tomorrow, and one short enough for tomorrow double-asks today.
            // What separates a repeated question from a new one is *event
            // identity*, and GitHub already provides it — a workflow run has an
            // id, and a redelivered webhook carries the same one.
            const MARKER = '<!-- agentic-ci-failure -->';
            const PARKED = '<!-- agentic-ci-failure-parked -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100
            });
            const nudges = comments.filter((comment) => (comment.body || '').includes(MARKER));
            const asksAbout = conflict ? `${pr.head.sha} conflict:${conflict.sha}` : `run:${ciRunId}`;
            const askedAboutThisRun = nudges.some((comment) => (comment.body || '').includes(asksAbout));

            // Firing twice for the same run id means the same event arrived
            // twice — a redelivery, a re-request, or (now that
            // `scan-after-runner` also dispatches this workflow, potentially
            // from two overlapping scans) a second automatic decision reaching
            // the same still-empty comment list before the first one's comment
            // landed — and answering it twice would queue a second session.
            // This holds regardless of how the job was invoked: a
            // `workflow_dispatch` is no longer, on its own, evidence that a
            // repeat is wanted. Only `force_retry` says that explicitly.
            const forceRetry = dispatchedLookup && process.env.FORCE_RETRY === 'true';
            const asked = conflict
              ? `the conflict of ${pr.head.sha.slice(0, 7)} with ${conflict.base} at ${conflict.sha.slice(0, 7)}`
              : `CI run ${ciRunId}`;
            if (askedAboutThisRun && !forceRetry) {
              core.info(`#${pr.number}: ${asked} was already handed back. Same event, not a new failure.`);
              return;
            }

            // `force_retry` is the clock-free retry `agentic-watchdog.yml`'s
            // hourly sweep asks for explicitly: a handback whose session died
            // before pushing anything — the head never moves, so nothing about
            // the failure changes — is asked again on the next sweep rather
            // than skipped forever. It is not free: it counts against the
            // limit below like any other attempt, so the retry is bounded and
            // ends in a parked PR with its issue released, never in a silent
            // stall. `scan-after-runner` never sets it, so its own dispatch can
            // never repeat a nudge for a run id already commented about.
            if (askedAboutThisRun) {
              core.info(
                `#${pr.number}: ${asked} was handed back before and the head is still ` +
                `${pr.head.sha.slice(0, 7)} with no session running — force_retry requested. Asking again.`
              );
            }

            // What the failure actually was. A comment that says "CI is red"
            // sends the session to go and find out; naming the jobs and their
            // log URLs is the difference between a fix and a re-diagnosis.
            let failures = [];
            for (const red of redRuns) {
              try {
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  owner, repo, run_id: red.id, filter: 'latest', per_page: 100
                });
                failures.push(...jobs
                  .filter((job) => ['failure', 'cancelled', 'timed_out'].includes(job.conclusion))
                  .map((job) => `- \`${job.name}\` — ${job.conclusion} — ${job.html_url}`));
              } catch (error) {
                core.warning(`Could not list the failing jobs of run ${red.id}: ${error.message}`);
              }
            }
            const failureBlock = conflict
              ? `- \`${pr.head.ref}\` conflicts with \`${conflict.base}\` at \`${conflict.sha.slice(0, 7)}\``
              : failures.length
                ? failures.join('\n')
                : '- (the failing jobs could not be listed — open the PR\'s Checks tab)';

            if (nudges.length >= limit) {
              // The brake, and it must leave the queue moving. A draft takes the
              // PR out of auto-merge's selection, and `blocked` on the issue is
              // what `handle-failure.yml` chains from — without it this PR would
              // hold its issue exactly as #581 did, which is the bug.
              core.warning(`#${pr.number}: ${nudges.length} CI-fix attempts already (limit ${limit}). Parking it.`);

              try {
                await github.graphql(
                  `mutation($id: ID!) { convertPullRequestToDraft(input: { pullRequestId: $id }) { clientMutationId } }`,
                  { id: pr.node_id }
                );
              } catch (error) {
                core.warning(`#${pr.number}: could not convert to draft: ${error.message}`);
              }

              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number,
                body: [
                  '⛔ **Still not mergeable after ' + nudges.length + ' agent attempt(s).**',
                  '',
                  'What is failing:',
                  failureBlock,
                  '',
                  `The limit is \`AGENTIC_CI_FIX_ATTEMPT_LIMIT\` (${limit}), shared by red channels and conflicts with the base. This pull request is now a draft, so the merge gate no longer considers it, and issue #${issueNumber} is labelled \`blocked\` — the queue moves on rather than waiting on a failure that is not converging.`,
                  '',
                  '@Nico2398 — the failures above are the whole record. Fix them and mark the PR ready for review, or close it and put `ready` back on the issue.',
                  '',
                  PARKED
                ].join('\n')
              });

              // The PAT again: a label applied with GITHUB_TOKEN raises no
              // `issues: labeled` event, and `handle-failure.yml` — the thing
              // that releases the queue — would never fire.
              try {
                const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
                const labels = issue.labels.map((label) => (typeof label === 'string' ? label : label.name));
                if (issue.state === 'open' && !labels.includes('blocked')) {
                  await github.rest.issues.addLabels({
                    owner, repo, issue_number: issueNumber, labels: ['blocked']
                  });
                }
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: issueNumber, name: 'in-progress'
                }).catch(() => {});
              } catch (error) {
                core.warning(`Could not settle issue #${issueNumber}: ${error.message}`);
              }
              return;
            }

            const attempt = nudges.length + 1;
            const redBody = [
              `${mention} — CI is red on this pull request and no agent session is running. Fix it.`,
              '',
              `This is CI-fix attempt ${attempt} of ${limit} on PR #${pr.number} (\`${pr.head.ref}\`, commit \`${pr.head.sha.slice(0, 7)}\`), which closes issue #${issueNumber}.`,
              '',
              '**What is failing:**',
              failureBlock,
              '',
              '**What to do** — this is the `ci-fix` task type; load `agentic-pipeline-ci-fix` and follow it:',
              '',
              `1. Check out the existing \`${pr.head.ref}\` and \`git pull --no-rebase\` it — the merge gate may have merged \`${pr.base.ref}\` into it. Do **not** recreate it, and do not start a fresh TDD cycle — the work is already on it and this pull request is built on it.`,
              '2. Read the failing job logs above before changing anything. A CI-only channel (interaction-mode `visual`, the production `build`) reports things a sandbox without a GPU cannot reproduce, so read the log and the FAIL screenshots in the run artifacts rather than assuming the failure is local.',
              '3. Decide which side is wrong — the change or the expectation — and fix that side. A baked expectation updated to match broken behaviour is a silent regression.',
              `4. Verify every channel the fix touches, commit, and push to \`${pr.head.ref}\`. Never \`[skip ci]\`, never rebase or force-push.`,
              '5. Then **wait for CI to report** before ending the session: `npm run ci:await -- --pr ' + pr.number + '`. Green means done. Red means go back to step 2.',
              '',
              `The \`READY TO MERGE\` marker on this pull request stays as it is — the merge gate merges it once CI is green on a head that contains \`${pr.base.ref}\`, and that is what releases issue #${issueNumber} and starts the next task. If you cannot turn a channel green, say so in a comment, convert this pull request to a draft, and label issue #${issueNumber} \`blocked\`.`,
            ];
            const conflictBody = conflict && [
              `${mention} — this pull request conflicts with \`${conflict.base}\` and no agent session is running on it. Resolve it.`,
              '',
              `This is attempt ${attempt} of ${limit} on PR #${pr.number} (\`${pr.head.ref}\`, commit \`${pr.head.sha.slice(0, 7)}\`), which closes issue #${issueNumber}. \`${conflict.base}\` is at \`${conflict.sha.slice(0, 7)}\`. Other work landed while this one was in flight; the merge gate merges a pull request only on top of the current \`${conflict.base}\`, and it cannot merge this one in for you.`,
              '',
              '**What to do** — this is the `ci-fix` task type, conflict variant; load `agentic-pipeline-ci-fix` and follow it:',
              '',
              `1. Check out the existing \`${pr.head.ref}\` and \`git pull --no-rebase\` it. Do **not** recreate it, and do not start a fresh TDD cycle.`,
              `2. \`git fetch origin ${conflict.base}\` and \`git merge origin/${conflict.base}\`. Resolve every conflict so both sides' intent survives. Regenerate lockfiles and generated files with their tooling, never by hand. A conflict in a mirrored context file is resolved once and mirrored to all three runtime directories.`,
              '3. Re-run the verification channels the merge touched — at least `npm run typecheck` and `npm run test`, plus `npm run validate:context` if any context file conflicted.',
              `4. Commit the merge and push to \`${pr.head.ref}\`. Never \`[skip ci]\`, never rebase or force-push.`,
              '5. Then **wait for CI to report** before ending the session: `npm run ci:await -- --pr ' + pr.number + '`. Green means done — the merge gate merges it. Red means fix it and push again.',
              '',
              `If the branch already merges cleanly when you look, the conflict was resolved before you arrived: go straight to step 5. If resolving it means choosing between two behaviours only a human can choose between, say so in a comment, convert this pull request to a draft, and label issue #${issueNumber} \`blocked\`.`,
            ];
            await github.rest.issues.createComment({
              owner, repo, issue_number: pr.number,
              body: [...(conflictBody || redBody), '', `${MARKER} ${pr.head.sha} ${conflict ? `conflict:${conflict.sha}` : `run:${ciRunId}`}`].join('\n')
            });

            core.info(`#${pr.number}: asked ${mention} to ${conflict ? 'resolve a conflict with ' + conflict.base : 'fix CI'} (attempt ${attempt}/${limit}).`);

  # `nudge` above declines to comment while a runner session is live, because
  # that session's own `[await-ci]` step reads the verdict itself — but the
  # only thing that used to notice a session ending without ever reaching
  # that verdict was `agentic-watchdog.yml`'s hourly cron, and cron delivery
  # has been observed 3-5 hours late. This job is the event-driven
  # replacement: every time a runner workflow completes, for any reason,
  # every open pipeline PR gets re-assessed and any that are red and
  # unanswered get `nudge` re-dispatched on themselves — exactly the sweep
  # `agentic-watchdog.yml`'s "Re-raise a red CI on an open pipeline PR" step
  # already does, just woken by the runner finishing instead of by the clock.
  scan-after-runner:
    if: >-
      vars.AGENTIC_CI_FIX_ENABLED != 'false' &&
      github.event_name == 'workflow_run' &&
      (github.event.workflow_run.name == 'Claude Pipeline' || github.event.workflow_run.name == 'OpenCode Pipeline')
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow-level block for this job
    # entirely rather than adding to it, so everything this job's steps call
    # has to be listed here: checkout (contents), the PR/comment reads below
    # (pull-requests, issues), and the one write this job needs that `nudge`
    # never did — dispatching itself (actions). `nudge` stays on the
    # workflow-level grant, which is `actions: read` only: it lists runs and
    # jobs but never dispatches, so it never needed write.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: write
    # One scan across every open pipeline PR, not scoped per-PR like `nudge`'s
    # group — two runner completions close together must not both read the
    # same still-empty comment list and both decide `dispatch: true` before
    # either dispatch lands. `cancel-in-progress: true` because a scan
    # superseded by a newer one is redundant, not lost work: the newer scan
    # re-reads the same PRs with fresher data.
    concurrency:
      group: agentic-ci-failure-scan-after-runner
      cancel-in-progress: true
    steps:
      # Needed so the github-script step below can `require()` the shared
      # decision module — the first checkout in this workflow.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Re-scan open pipeline PRs for an unanswered red CI
        uses: actions/github-script@v7
        env:
          ATTEMPT_LIMIT: ${{ vars.AGENTIC_CI_FIX_ATTEMPT_LIMIT }}
        with:
          github-token: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Required from the workspace, not vendored into this YAML: the
            // same marker-based ledger and attempt limit `nudge` uses, so
            // this scan and that job can never disagree about what counts as
            // "already asked" or "at the limit".
            const { PIPELINE_HEAD, assessPipelinePr } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/ci-handback.cjs`
            );

            const configuredLimit = parseInt(process.env.ATTEMPT_LIMIT || '', 10);
            const limit = Number.isInteger(configuredLimit) && configuredLimit > 0 ? configuredLimit : 3;

            const open = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100
            });

            let dispatched = 0;
            for (const pr of open) {
              if (pr.draft || !PIPELINE_HEAD.test(pr.head?.ref || '')) continue;

              const runsOnHead = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner, repo, head_sha: pr.head.sha, per_page: 100
              });
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number, per_page: 100
              });

              const verdict = assessPipelinePr({ pr, runsOnHead, comments, limit });
              if (!verdict.dispatch) {
                core.info(`#${pr.number}: ${verdict.reason}. Not dispatching.`);
                continue;
              }

              core.warning(`#${pr.number}: ${verdict.reason} — dispatching the fail-safe.`);
              await github.rest.actions.createWorkflowDispatch({
                owner, repo,
                workflow_id: 'agentic-ci-failure.yml',
                ref: context.payload.repository?.default_branch || 'main',
                inputs: { pr: String(pr.number) }
              });
              dispatched += 1;
            }

            core.info(`Dispatched the fail-safe for ${dispatched} pipeline PR(s).`);
