name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Skip PRs opened by the autonomous pipeline and other bot branches.
    # Author filtering does not work here: pipeline PRs are pushed with the
    # owner's PAT, so they carry the same author login as hand-written PRs.
    # The head branch prefix is the only reliable distinguisher.
    if: >-
      !startsWith(github.head_ref, 'pipeline/') &&
      !startsWith(github.head_ref, 'claude/') &&
      !startsWith(github.head_ref, 'opencode/') &&
      !startsWith(github.head_ref, 'copilot/')

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The reviewer needs the verification channels too -- a review that cannot
      # run `npm run typecheck` or `npm run test` is guessing. Mirrors claude.yml.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer Chrome
        run: npx puppeteer browsers install chrome

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Same reasoning as claude.yml: throwaway runner, no human to approve,
          # `deny` rules from .claude/settings.json still enforced.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: '--permission-mode bypassPermissions'

