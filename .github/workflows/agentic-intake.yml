name: "Pipeline: intake a filed issue"

# Filing an issue records work; it never starts a run. Four mechanisms start an
# autonomous session, and each reacts to a run ending or a human asking —
# `agentic-autonomous-pipeline`'s github-loop reference lists them. None of them
# is an issue being opened.
#
# This workflow assigns nothing. It exists only to keep the labels usable by
# hand: it makes sure the lifecycle and scope label definitions exist so a human
# can pick them from the GitHub UI, and it drops a stale `done` from a reopened
# issue. An issue carrying `ready` waits in the queue until an entry point
# reaches it — filing it, labelling it, or reopening it does not.
on:
  issues:
    types: [opened, reopened]

permissions:
  issues: write
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # The scope taxonomy is read from `assignability.cjs`, the one place that
      # decides what a scope means, so a label defined here can never name a
      # scope the assigner does not know.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Normalise lifecycle labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const n = context.payload.issue.number;
            const reopened = context.payload.action === 'reopened';
            const on = new Set(
              (context.payload.issue.labels || []).map((l) => (typeof l === 'string' ? l : l.name))
            );

            // Ensures the two label definitions exist so a human picking them
            // from the GitHub UI finds them there. Never applied automatically.
            const ensureLabel = async (name, color, description) => {
              await github.rest.issues.createLabel({ owner, repo, name, color, description })
                .catch(() => {});
            };
            await ensureLabel('agent-task', '0e8a16', 'Atomic task for the autonomous pipeline');
            await ensureLabel('ready', '1d76db', 'Waiting in the assignment queue');
            // `paused` is applied by a run, not by a human picking it from the
            // UI — but it has to *exist* before the first run reaches for it,
            // and it is the one lifecycle label that also goes on pull requests,
            // where `assignability.cjs` reads it as a handover rather than a
            // collision. Defined here for the same reason as the other two.
            await ensureLabel(
              'paused',
              'fbca04',
              'A run stopped here on a dependency; the queue returns to it when that dependency lands'
            );

            // Scope labels say which area an issue's diff stays inside, and
            // `AGENTIC_MAX_PARALLEL_RUNS` above 1 only runs issues side by side
            // when their scopes differ. Defined, never applied: an issue with
            // no scope label runs alone, which is safe, and a wrong one costs a
            // conflict round, so labelling stays a deliberate act.
            const { SCOPES, SCOPE_PREFIX } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/assignability.cjs`);
            for (const [scope, description] of Object.entries(SCOPES)) {
              await ensureLabel(`${SCOPE_PREFIX}${scope}`, 'c5def5', description);
            }

            // Reopening is a human saying the work is not finished after all.
            // `done` no longer reflects reality, but re-entering the queue is
            // still their call: they add `ready` back themselves.
            if (reopened && on.has('done')) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: n, name: 'done' })
                .catch(() => {});
              on.delete('done');
              core.info(`#${n}: reopened, dropped stale done.`);
            }

            core.info(
              on.has('ready')
                ? `#${n}: carries ready and waits in the queue. Dispatch "Pipeline: run the configured agent on the next ready issue" to start it, or let a merged pipeline PR chain to it.`
                : `#${n}: no ready label, so it is not in the queue.`
            );
