name: "Pipeline: merge gate"

# The one workflow that merges a pull request.
#
# A pull request merges only when every channel on its head is green and that
# head already contains `main`'s tip — so the tree that lands on `main` is one
# CI has passed. Green alone was the rule while only one agent session ran at a
# time and `main` could only move through that session's own merge. With several
# sessions live (`AGENTIC_MAX_PARALLEL_RUNS`), two pull requests can each be
# green and be red together, and merging both would put a `main` on the branch
# that no channel ever ran. `agentic-auto-merge`'s action holds the verdict;
# this workflow holds the lock and decides when to look.
#
# **The lock.** The sweep runs under `agentic-merge`, one at a time, so two
# sweeps can never each find a different PR up to date with the same `main` and
# merge both. Job-level, not workflow-level: a run whose `if:` resolves false —
# a failed CI, a noop runner run — must not claim the one pending slot on its
# way to finding that out, or it evicts a sweep that would have merged
# (#572/#610 were that eviction, in the runner group). GitHub keeps one pending
# run per group and drops the rest, which is harmless here only because every
# sweep evaluates every open pull request: whichever one survives reads them all.
#
# **When it looks.** Never on a clock. Each wake is an event that can change a
# verdict:
#
#   - CI completing green on any branch. On a PR head, that PR may now merge
#     (PR #499 sat marked and green for want of this trigger). On `main`, every
#     open PR may now be behind.
#   - A runner run finishing. Its PR may be marked and green already, and a
#     conflict the CI fail-safe declined to hand back while that session was
#     live can be handed back now. Filtered on `run-name` so the noop run every
#     comment creates wakes nothing.
#   - A dispatch: `auto-assign-next.yml` on a marked PR's own events (a marker
#     added after CI finished raises no CI event), the watchdog's hourly
#     re-raise of anything marked and open, or a human.
on:
  workflow_run:
    workflows: ["CI", "Claude Pipeline", "OpenCode Pipeline"]
    types: [completed]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why the sweep was asked for. Logged only — every sweep evaluates every open marked pull request.'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  gate:
    # A CI run that failed leaves nothing to merge; the fail-safe owns it.
    if: >-
      vars.AGENTIC_AUTO_MERGE_ENABLED == 'true' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.name == 'CI' && github.event.workflow_run.conclusion == 'success') ||
        (github.event.workflow_run.name != 'CI' && startsWith(github.event.workflow_run.display_title, 'agentic-run '))
      )
    runs-on: ubuntu-latest
    concurrency:
      group: agentic-merge
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Say what woke the sweep
        env:
          EVENT: ${{ github.event_name }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          TITLE: ${{ github.event.workflow_run.display_title }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          REASON: ${{ inputs.reason }}
        run: |
          if [ "${EVENT}" = "workflow_dispatch" ]; then
            echo "Dispatched: ${REASON:-no reason given}."
          else
            echo "${WORKFLOW} completed (${TITLE}) on ${BRANCH}."
          fi

      # The PAT, not GITHUB_TOKEN: releasing a parked workflow run needs
      # `actions: write`; the merge commit an update pushes must raise
      # `pull_request: synchronize` so CI runs on it; and a merge performed by
      # the PAT raises the `pull_request: closed` event auto-assign-next.yml
      # chains from.
      - name: Merge what is green on top of main, update what is behind
        id: merge
        uses: ./.github/actions/agentic-auto-merge
        with:
          token: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}

      # A red channel or a conflict with `main` is the agent's to fix, and
      # `agentic-ci-failure.yml` is the fail-safe that hands a pull request back
      # to the agent that owns it. It re-applies every one of its own guards
      # (pipeline head, not a draft, no live session on this work,
      # `ci-fix-hold`, the attempt limit, "already asked about this"), so this
      # decides nothing; it only makes sure the question gets asked.
      #
      # This is the general path and deliberately not keyed to any workflow: the
      # gate reads every channel on the head, so dispatching from its verdict
      # covers a red check from a workflow nobody thought to enumerate — PR
      # #773's closing-keyword guard, with `ci.yml` itself green.
      #
      # `always()` because the sweep step fails on stuck PRs and must not take
      # the handback down with it.
      - name: Hand a red or conflicting marked PR back to the agent
        if: always() && steps.merge.outputs.handback != ''
        uses: actions/github-script@v7
        env:
          HANDBACK: ${{ steps.merge.outputs.handback }}
        with:
          github-token: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
          script: |
            const prs = (process.env.HANDBACK || '').split(/\s+/).filter(Boolean);
            const failed = [];
            for (const pr of prs) {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'agentic-ci-failure.yml',
                  ref: context.payload.repository?.default_branch || 'main',
                  inputs: { pr: String(pr) }
                });
                core.info(`#${pr}: handed to the CI fail-safe.`);
              } catch (error) {
                core.warning(`#${pr}: could not dispatch the CI fail-safe: ${error.message}`);
                failed.push(pr);
              }
            }
            // The watchdog re-raises these on its next pass, but a handback
            // that did not happen is still a state that must not pass in green.
            if (failed.length > 0) {
              core.setFailed(`Could not hand back: ${failed.map((pr) => `#${pr}`).join(', ')}.`);
            }

      # `always()`: the sweep fails the job on a stuck or unmarked PR, and that
      # is precisely the run whose numbers are worth printing.
      - name: Report
        if: always()
        run: |
          echo "Merged: ${{ steps.merge.outputs.merged || 'none' }}."
          echo "Brought up to date, CI running again: ${{ steps.merge.outputs.updated || 'none' }}."
          echo "Waiting on checks: ${{ steps.merge.outputs.pending || 'none' }}."
          echo "Handed to the CI fail-safe: ${{ steps.merge.outputs.handback || 'none' }}."
          echo "Unable to move: ${{ steps.merge.outputs.stuck || 'none' }}."
          echo "Released ${{ steps.merge.outputs.approved || '0' }} parked workflow run(s)."
