name: OpenCode Pipeline

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to resolve'
        required: false
        type: string
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  # Repo-wide, and shared by name with the other runner: exactly one autonomous
  # agent session may run at a time, whichever runtime it is. Queued runs wait
  # rather than cancel the live one.
  group: agentic-runner
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  run:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.comment.user.type != 'Bot' &&
        (
          startsWith(github.event.comment.body, '@opencode ') ||
          contains(github.event.comment.body, ' @opencode ') ||
          endsWith(github.event.comment.body, ' @opencode') ||
          github.event.comment.body == '@opencode' ||
          startsWith(github.event.comment.body, '@OpenCode ') ||
          contains(github.event.comment.body, ' @OpenCode ') ||
          endsWith(github.event.comment.body, ' @OpenCode') ||
          github.event.comment.body == '@OpenCode'
        )
      )
    runs-on: ubuntu-latest
    # Kept identical to claude-runner.yml: GitHub-hosted maximum, because 180 cut
    # a real run off mid-finalization and a cancelled job loses everything the
    # rescue step cannot push. `AGENTIC_STALL_MINUTES` must stay above this — see
    # agentic-watchdog.yml.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          # The pipeline branches off main and cherry-picks between its own
          # branches; a shallow clone loses the history those operations need.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup git auth for push operations
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
        run: gh auth setup-git

      # The pipeline creates every branch from `main` by name. On a PR review
      # comment the workspace is on the PR head, and `git rev-parse main` fails
      # when only `origin/main` exists — fetch-depth 0 above guarantees it does.
      - name: Ensure a local main ref to branch from
        run: git rev-parse --verify --quiet main >/dev/null || git branch main origin/main

      - name: Get opencode version
        id: version
        shell: bash
        run: |
          VERSION=$(curl -sf https://api.github.com/repos/anomalyco/opencode/releases/latest | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)
          echo "version=${VERSION:-latest}" >> "$GITHUB_OUTPUT"

      - name: Cache opencode
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.opencode/bin
          key: opencode-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}

      - name: Install opencode
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Add opencode to PATH
        shell: bash
        run: echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      # Shared with claude-runner.yml so both runtimes receive the same task text.
      - name: Build trigger context prompt
        id: context
        uses: ./.github/actions/agentic-prompt
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue_number: ${{ inputs.issue_number }}

      # `default_agent: orchestrator` in .opencode/opencode.json makes the
      # orchestrator the primary agent of this session, so the run starts in the
      # pipeline. Claude Code has no such setting — claude-runner.yml routes
      # through the /agentic-run command instead.
      - name: Run opencode
        id: opencode
        shell: bash
        run: |
          set +e
          opencode --print-logs --log-level WARN github run 2>&1 | tee /tmp/opencode.log
          EXIT_CODE=$?
          echo "session_id=$(grep -oP 'opencode session \K\S+' /tmp/opencode.log | tail -1)" >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
          OPENCODE_PERMISSION: '{"external_directory":"allow","doom_loop":"deny"}'
          MODEL: opencode/deepseek-v4-flash-free
          MENTIONS: '@opencode'

      - name: Export full session
        if: always()
        shell: bash
        run: |
          SESSION_ID="${{ steps.opencode.outputs.session_id }}"
          if [ -n "$SESSION_ID" ]; then
            echo "::group::Full Session Export"
            opencode export "$SESSION_ID" 2>/dev/null || echo "(export unavailable)"
            echo "::endgroup::"
          else
            echo "(no session ID found)"
          fi

      # A session that ends before opening its PR leaves `pipeline/feature-<N>`
      # on this VM and nowhere else. `always()`: the cases worth rescuing are
      # exactly the ones where the step above failed, timed out, or was
      # cancelled — and the one where it "succeeded" having ended its turn on
      # work it was still waiting for.
      - name: Rescue an unfinished run
        if: always() && steps.context.outputs.issue != ''
        uses: ./.github/actions/agentic-rescue
        with:
          token: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
          issue: ${{ steps.context.outputs.issue }}

      # When the run closed the issue without opening a PR, no pull_request event
      # will ever fire, so auto-assign-next.yml cannot carry the chain. Do it here.
      - name: Chain to next issue if resolved without PR
        if: steps.context.outputs.issue != '' && vars.AGENTIC_AUTO_ASSIGN_ENABLED == 'true'
        uses: ./.github/actions/agentic-assign
        with:
          token: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
          agent: ${{ vars.AGENTIC_AGENT }}
          guard: closed_without_pr
          completed_issue: ${{ steps.context.outputs.issue }}
          reason: auto-assigned after issue #${{ steps.context.outputs.issue }} was resolved without a PR
