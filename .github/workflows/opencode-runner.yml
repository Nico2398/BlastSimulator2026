name: OpenCode Pipeline

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to resolve'
        required: false
        type: string
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# What this run is working on, as every liveness check reads it. `display_title`
# is the only identity a run carries in `listWorkflowRuns`, and several agent
# sessions can be live at once (`AGENTIC_MAX_PARALLEL_RUNS`), so "a runner run
# is live" no longer means "this issue's run is live". `run-liveness.cjs`'s
# `parseRunEntity` reads this exact shape — `agentic-run issue-<N>`,
# `agentic-run pr-<N>`, `agentic-run manual` — and a trigger the job will skip
# is `agentic-noop`, so the burst of no-op runs every comment in the repository
# creates is never mistaken for a session. The trigger test and the entity are
# the same expressions as the concurrency group below, and `autonomy-loop.test.ts`
# holds the two equal.
run-name: >-
  ${{
    (
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.comment.user.type != 'Bot' &&
        (
          startsWith(github.event.comment.body, '@opencode ') ||
          contains(github.event.comment.body, ' @opencode ') ||
          endsWith(github.event.comment.body, ' @opencode') ||
          github.event.comment.body == '@opencode' ||
          startsWith(github.event.comment.body, '@OpenCode ') ||
          contains(github.event.comment.body, ' @OpenCode ') ||
          endsWith(github.event.comment.body, ' @OpenCode') ||
          github.event.comment.body == '@OpenCode'
        )
      )
    )
      && format(
        'agentic-run {0}',
        (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request) &&
          format('pr-{0}', github.event.pull_request.number || github.event.issue.number) ||
        github.event_name == 'workflow_dispatch' &&
          (inputs.issue_number && format('issue-{0}', inputs.issue_number) || 'manual') ||
        format('issue-{0}', github.event.issue.number)
      )
      || 'agentic-noop'
  }}

concurrency:
  # One session per issue or pull request, shared by name with claude-runner.yml.
  # This group is not the cap on how many sessions run: GitHub has no "at most
  # N" primitive, and `agentic-assign` is what keeps `in-progress` issues at or
  # under `AGENTIC_MAX_PARALLEL_RUNS`. What this group prevents is two sessions
  # on one entity — two assignment comments on one issue, two CI handbacks on
  # one pull request — which would build two branches for one issue or push
  # twice to one. Queued runs wait rather than cancel the live one.
  #
  # But `issue_comment`/`pull_request_review_comment` carry no content filter at
  # the workflow level — every comment anywhere in the repo creates a run here,
  # whether or not the job's own `if:` below will act on it. GitHub Actions
  # keeps only one *pending* run per group; a second one that arrives before the
  # first starts silently cancels it, zero steps, nothing to retry from. #572
  # and #610 were both a real assignment's run queued correctly behind a live
  # session, then evicted seconds later by that same session's own trailing
  # wrap-up comment — a no-op that never mentions @opencode and would have
  # resolved `if:` false, but still claimed the slot on its way to finding that
  # out. So this mirrors the job's own `if:` here too: only a trigger the job
  # will actually act on may contend for an entity's slot. Everything else gets
  # its own group, keyed by this run's id, so it can never evict real work —
  # the same reasoning `auto-assign-next.yml` already applies to keep auto-merge
  # arming out of the `agentic-assignment` group.
  group: >-
    ${{
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.comment.user.type != 'Bot' &&
          (
            startsWith(github.event.comment.body, '@opencode ') ||
            contains(github.event.comment.body, ' @opencode ') ||
            endsWith(github.event.comment.body, ' @opencode') ||
            github.event.comment.body == '@opencode' ||
            startsWith(github.event.comment.body, '@OpenCode ') ||
            contains(github.event.comment.body, ' @OpenCode ') ||
            endsWith(github.event.comment.body, ' @OpenCode') ||
            github.event.comment.body == '@OpenCode'
          )
        )
      )
        && format(
          'agentic-runner-{0}',
          (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request) &&
            format('pr-{0}', github.event.pull_request.number || github.event.issue.number) ||
          github.event_name == 'workflow_dispatch' &&
            (inputs.issue_number && format('issue-{0}', inputs.issue_number) || 'manual') ||
          format('issue-{0}', github.event.issue.number)
        )
        || format('agentic-runner-noop-{0}', github.run_id)
    }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  run:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.comment.user.type != 'Bot' &&
        (
          startsWith(github.event.comment.body, '@opencode ') ||
          contains(github.event.comment.body, ' @opencode ') ||
          endsWith(github.event.comment.body, ' @opencode') ||
          github.event.comment.body == '@opencode' ||
          startsWith(github.event.comment.body, '@OpenCode ') ||
          contains(github.event.comment.body, ' @OpenCode ') ||
          endsWith(github.event.comment.body, ' @OpenCode') ||
          github.event.comment.body == '@OpenCode'
        )
      )
    runs-on: ubuntu-latest
    # GitHub-hosted maximum, and the outer bound only. Each agent step below
    # carries its own `timeout-minutes`, so an attempt that overruns fails inside
    # a live job and the retry and rescue still run — claude-runner.yml holds the
    # arithmetic and the runs that decided it. `AGENTIC_STALL_MINUTES` must stay
    # above this — see agentic-watchdog.yml.
    timeout-minutes: 360
    steps:
      # First step, so elapsed time measured against it matches the window
      # `timeout-minutes` is counting. The retry gate below spends it, and the
      # loop deadline derived from it is what the session's own loops read —
      # `agentic-autonomous-pipeline` holds that rule; claude-runner.yml holds
      # the fallback rule for the variable.
      - name: Record when the job started
        id: clock
        env:
          LOOP_BUDGET_MINUTES: ${{ vars.AGENTIC_LOOP_BUDGET_MINUTES }}
        run: |
          started_at=$(date +%s)
          echo "started_at=${started_at}" >> "$GITHUB_OUTPUT"
          case "${LOOP_BUDGET_MINUTES}" in
            ''|*[!0-9]*|0) budget=180 ;;
            *) budget=${LOOP_BUDGET_MINUTES} ;;
          esac
          echo "loop_deadline=$(( started_at + budget * 60 ))" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          # The pipeline branches off main and cherry-picks between its own
          # branches; a shallow clone loses the history those operations need.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup git auth for push operations
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
        run: gh auth setup-git

      # The pipeline creates every branch from `main` by name. On a PR review
      # comment the workspace is on the PR head, and `git rev-parse main` fails
      # when only `origin/main` exists — fetch-depth 0 above guarantees it does.
      - name: Ensure a local main ref to branch from
        run: git rev-parse --verify --quiet main >/dev/null || git branch main origin/main

      - name: Get opencode version
        id: version
        shell: bash
        run: |
          VERSION=$(curl -sf https://api.github.com/repos/anomalyco/opencode/releases/latest | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)
          echo "version=${VERSION:-latest}" >> "$GITHUB_OUTPUT"

      - name: Cache opencode
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.opencode/bin
          key: opencode-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}

      - name: Install opencode
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Add opencode to PATH
        shell: bash
        run: echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      # Shared with claude-runner.yml so both runtimes receive the same task text.
      - name: Build trigger context prompt
        id: context
        uses: ./.github/actions/agentic-prompt
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue_number: ${{ inputs.issue_number }}

      # `default_agent: orchestrator` in .opencode/opencode.json makes the
      # orchestrator the primary agent of this session, so the run starts in the
      # pipeline. Claude Code has no such setting — claude-runner.yml routes
      # through the /agentic-run command instead.
      - name: Run opencode
        id: opencode
        # The first attempt's share of the job budget — claude-runner.yml.
        timeout-minutes: 270
        shell: bash
        run: |
          set +e
          opencode --print-logs --log-level WARN github run 2>&1 | tee /tmp/opencode.log
          EXIT_CODE=$?
          echo "session_id=$(grep -oP 'opencode session \K\S+' /tmp/opencode.log | tail -1)" >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
          OPENCODE_PERMISSION: '{"external_directory":"allow","doom_loop":"deny"}'
          MODEL: opencode/deepseek-v4-flash-free
          MENTIONS: '@opencode'
          # Past this epoch the session starts no new loop iteration —
          # `agentic-autonomous-pipeline`. OpenCode reads it from the shared
          # skill text alone; `references/runtime-parity.md` says why.
          AGENTIC_LOOP_DEADLINE_EPOCH: ${{ steps.clock.outputs.loop_deadline }}

      - name: Export full session
        if: always()
        shell: bash
        run: |
          SESSION_ID="${{ steps.opencode.outputs.session_id }}"
          if [ -n "$SESSION_ID" ]; then
            echo "::group::Full Session Export"
            opencode export "$SESSION_ID" 2>/dev/null || echo "(export unavailable)"
            echo "::endgroup::"
          else
            echo "(no session ID found)"
          fi

      # Kept identical in shape to claude-runner.yml. OpenCode's delegation is
      # synchronous, so it cannot lose a run to a backgrounded sub-agent — but a
      # crash, a revoked key or a model that simply stops leaves the same wreck,
      # and the retry costs nothing when the first attempt did settle the issue.
      - name: Did the run settle its issue?
        id: state
        if: always() && steps.context.outputs.issue != ''
        uses: ./.github/actions/agentic-run-state
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue: ${{ steps.context.outputs.issue }}
          started_at: ${{ steps.clock.outputs.started_at }}
          budget_minutes: '360'

      # `always()` for the reason claude-runner.yml gives on its own retry: a
      # step without it is skipped after any failed step, timeouts included.
      - name: Retry the run when the first attempt settled nothing
        id: opencode_retry
        if: always() && steps.state.outputs.retry == 'true'
        timeout-minutes: 80
        shell: bash
        run: |
          set +e
          opencode --print-logs --log-level WARN github run 2>&1 | tee /tmp/opencode-retry.log
          EXIT_CODE=$?
          echo "session_id=$(grep -oP 'opencode session \K\S+' /tmp/opencode-retry.log | tail -1)" >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
          OPENCODE_PERMISSION: '{"external_directory":"allow","doom_loop":"deny"}'
          MODEL: opencode/deepseek-v4-flash-free
          MENTIONS: '@opencode'
          AGENTIC_LOOP_DEADLINE_EPOCH: ${{ steps.clock.outputs.loop_deadline }}
          # Overrides the PROMPT the agentic-prompt action exported, so the retry
          # knows it is one, and knows what the previous attempt left behind: those
          # branches are on this disk and nowhere else, never pushed.
          PROMPT: |
            ▶ THIS IS A RETRY. The previous session in this job ended without settling this issue.

            ${{ steps.state.outputs.reason }}

            What that attempt left on this runner's disk:
            ${{ steps.state.outputs.branch_state }}

            Those branches exist here and nowhere else — they were never pushed. Inspect them
            before deciding: continue the furthest one that is sound, or rebuild from `main`.
            Either way this attempt owes the same terminal outcome as any other run.

            ${{ steps.context.outputs.prompt }}

      # Reported, not acted on: the rescue step below reads the state itself and
      # owns what happens next.
      - name: Did the retry settle its issue?
        if: always() && steps.opencode_retry.outcome != 'skipped'
        uses: ./.github/actions/agentic-run-state
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue: ${{ steps.context.outputs.issue }}

      # A session that ends before opening its PR leaves `pipeline/feature-<N>`
      # on this VM and nowhere else. `always()`: the cases worth rescuing are
      # exactly the ones where the step above failed, timed out, or was
      # cancelled — and the one where it "succeeded" having ended its turn on
      # work it was still waiting for.
      - name: Rescue an unfinished run
        if: always() && steps.context.outputs.issue != ''
        uses: ./.github/actions/agentic-rescue
        with:
          token: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
          issue: ${{ steps.context.outputs.issue }}
          branch: ${{ steps.context.outputs.feature_branch }}

      # No auto-merge step here any more. The merge gate
      # (`agentic-auto-merge.yml`) is the one thing that merges, under its own
      # lock, and this run finishing is one of the events that wakes it: its
      # `workflow_run` trigger names this workflow and filters on the
      # `run-name` above. That sweep releases any run parked as
      # `action_required` on this run's PR, and fails loudly on a pipeline PR
      # that is neither marked nor draft — the two things the step that stood
      # here used to do from inside this job.

      # Last step, deliberately: the concurrency slot this job holds frees the
      # moment it finishes, so this is the last chance to notice whether that
      # slot's own queue lost something on the way in. See the action for why —
      # #572, #610.
      - name: Recover a run this session's slot blocked
        if: always()
        continue-on-error: true
        uses: ./.github/actions/agentic-recover-blocked
        with:
          token: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
          self_issue: ${{ steps.context.outputs.issue }}
          grace_window_minutes: ${{ vars.AGENTIC_RUN_LIVENESS_GRACE_MINUTES }}

      # No chaining step here, deliberately. A run whose deliverable was an
      # answer or an executed command closes its own issue and stops there: a
      # runner starting the next session would be the pipeline deciding to run
      # again on its own, with no view of the queue it is restarting. Four
      # workflows start a session, and every one of them reacts to an event with
      # that view: `agentic-trigger.yml` (a human dispatching it),
      # `auto-assign-next.yml` (a merged pipeline PR), `handle-failure.yml` (a
      # run that halted `blocked` or `paused`), and `agentic-chain-on-close.yml`
      # (this very case — the issue closed with no PR). The close is what this
      # step's absence hands to that last one; the issue is released (closed,
      # `done`, `in-progress` dropped) and the chain happens over there.
