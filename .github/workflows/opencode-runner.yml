name: OpenCode Pipeline

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to resolve'
        required: false
        type: string
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  # Repo-wide, and shared by name with the other runner: exactly one autonomous
  # agent session may run at a time, whichever runtime it is. Queued runs wait
  # rather than cancel the live one.
  group: agentic-runner
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  run:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.comment.user.type != 'Bot' &&
        (
          startsWith(github.event.comment.body, '@opencode ') ||
          contains(github.event.comment.body, ' @opencode ') ||
          endsWith(github.event.comment.body, ' @opencode') ||
          github.event.comment.body == '@opencode' ||
          startsWith(github.event.comment.body, '@OpenCode ') ||
          contains(github.event.comment.body, ' @OpenCode ') ||
          endsWith(github.event.comment.body, ' @OpenCode') ||
          github.event.comment.body == '@OpenCode'
        )
      )
    runs-on: ubuntu-latest
    # Kept identical to claude-runner.yml: GitHub-hosted maximum, because 180 cut
    # a real run off mid-finalization and a cancelled job loses everything the
    # rescue step cannot push. `AGENTIC_STALL_MINUTES` must stay above this — see
    # agentic-watchdog.yml.
    timeout-minutes: 360
    steps:
      # First step, so elapsed time measured against it matches the window
      # `timeout-minutes` is counting. The retry gate below spends it.
      - name: Record when the job started
        id: clock
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          # The pipeline branches off main and cherry-picks between its own
          # branches; a shallow clone loses the history those operations need.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup git auth for push operations
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
        run: gh auth setup-git

      # The pipeline creates every branch from `main` by name. On a PR review
      # comment the workspace is on the PR head, and `git rev-parse main` fails
      # when only `origin/main` exists — fetch-depth 0 above guarantees it does.
      - name: Ensure a local main ref to branch from
        run: git rev-parse --verify --quiet main >/dev/null || git branch main origin/main

      - name: Get opencode version
        id: version
        shell: bash
        run: |
          VERSION=$(curl -sf https://api.github.com/repos/anomalyco/opencode/releases/latest | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)
          echo "version=${VERSION:-latest}" >> "$GITHUB_OUTPUT"

      - name: Cache opencode
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.opencode/bin
          key: opencode-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}

      - name: Install opencode
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Add opencode to PATH
        shell: bash
        run: echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      # Shared with claude-runner.yml so both runtimes receive the same task text.
      - name: Build trigger context prompt
        id: context
        uses: ./.github/actions/agentic-prompt
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue_number: ${{ inputs.issue_number }}

      # `default_agent: orchestrator` in .opencode/opencode.json makes the
      # orchestrator the primary agent of this session, so the run starts in the
      # pipeline. Claude Code has no such setting — claude-runner.yml routes
      # through the /agentic-run command instead.
      - name: Run opencode
        id: opencode
        shell: bash
        run: |
          set +e
          opencode --print-logs --log-level WARN github run 2>&1 | tee /tmp/opencode.log
          EXIT_CODE=$?
          echo "session_id=$(grep -oP 'opencode session \K\S+' /tmp/opencode.log | tail -1)" >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
          OPENCODE_PERMISSION: '{"external_directory":"allow","doom_loop":"deny"}'
          MODEL: opencode/deepseek-v4-flash-free
          MENTIONS: '@opencode'

      - name: Export full session
        if: always()
        shell: bash
        run: |
          SESSION_ID="${{ steps.opencode.outputs.session_id }}"
          if [ -n "$SESSION_ID" ]; then
            echo "::group::Full Session Export"
            opencode export "$SESSION_ID" 2>/dev/null || echo "(export unavailable)"
            echo "::endgroup::"
          else
            echo "(no session ID found)"
          fi

      # Kept identical in shape to claude-runner.yml. OpenCode's delegation is
      # synchronous, so it cannot lose a run to a backgrounded sub-agent — but a
      # crash, a revoked key or a model that simply stops leaves the same wreck,
      # and the retry costs nothing when the first attempt did settle the issue.
      - name: Did the run settle its issue?
        id: state
        if: always() && (steps.context.outputs.issue != '' || steps.context.outputs.pr != '')
        uses: ./.github/actions/agentic-run-state
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue: ${{ steps.context.outputs.issue }}
          pr: ${{ steps.context.outputs.pr }}
          pr_head_ref: ${{ steps.context.outputs.pr_head_ref }}
          pr_head_sha: ${{ steps.context.outputs.pr_head_sha }}
          started_at: ${{ steps.clock.outputs.started_at }}
          budget_minutes: '360'

      - name: Retry the run when the first attempt settled nothing
        id: opencode_retry
        if: steps.state.outputs.retry == 'true'
        shell: bash
        run: |
          set +e
          opencode --print-logs --log-level WARN github run 2>&1 | tee /tmp/opencode-retry.log
          EXIT_CODE=$?
          echo "session_id=$(grep -oP 'opencode session \K\S+' /tmp/opencode-retry.log | tail -1)" >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
          OPENCODE_PERMISSION: '{"external_directory":"allow","doom_loop":"deny"}'
          MODEL: opencode/deepseek-v4-flash-free
          MENTIONS: '@opencode'
          # Overrides the PROMPT the agentic-prompt action exported, so the retry
          # knows it is one, and knows what the previous attempt left behind: those
          # branches are on this disk and nowhere else, never pushed.
          PROMPT: |
            ▶ THIS IS A RETRY. The previous session in this job ended without settling the task it was given.

            ${{ steps.state.outputs.reason }}

            What that attempt left on this runner's disk:
            ${{ steps.state.outputs.branch_state }}

            Those branches exist here and nowhere else — they were never pushed. Inspect them
            before deciding: continue the furthest one that is sound, or rebuild from `main`.
            Either way this attempt owes the same terminal outcome as any other run.

            ${{ steps.context.outputs.prompt }}

      # Reported, not acted on: the rescue step below reads the state itself and
      # owns what happens next.
      - name: Did the retry settle its issue?
        if: always() && steps.opencode_retry.outcome != 'skipped'
        uses: ./.github/actions/agentic-run-state
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue: ${{ steps.context.outputs.issue }}
          pr: ${{ steps.context.outputs.pr }}
          pr_head_ref: ${{ steps.context.outputs.pr_head_ref }}
          pr_head_sha: ${{ steps.context.outputs.pr_head_sha }}

      # A session that ends before opening its PR leaves `pipeline/feature-<N>`
      # on this VM and nowhere else. `always()`: the cases worth rescuing are
      # exactly the ones where the step above failed, timed out, or was
      # cancelled — and the one where it "succeeded" having ended its turn on
      # work it was still waiting for.
      #
      # `|| pr != ''` covers the trigger that had no net at all until PR #481: a
      # `@claude` comment on a PR carries no issue number, so this step used to
      # exit immediately and a run that ended holding a half-finished rebase left
      # nothing behind but an eye reaction on the comment.
      - name: Rescue an unfinished run
        if: always() && (steps.context.outputs.issue != '' || steps.context.outputs.pr != '')
        uses: ./.github/actions/agentic-rescue
        with:
          token: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
          issue: ${{ steps.context.outputs.issue }}
          pr: ${{ steps.context.outputs.pr }}
          pr_head_ref: ${{ steps.context.outputs.pr_head_ref }}
          pr_head_sha: ${{ steps.context.outputs.pr_head_sha }}

      # The run just opened its PR, so this is the moment the PR came into
      # existence — and the only moment that does not depend on who opened it.
      # A PR authored by `github-actions[bot]` raises `pull_request` workflow
      # runs that GitHub creates and immediately parks as `action_required`:
      # auto-assign-next.yml never runs, and neither does CI. This step reads the
      # `READY TO MERGE` marker off the branch this run was told to build,
      # releases those parked runs so CI actually starts, and enables auto-merge
      # under the PAT. `always()`: an agent step that crashed after opening the
      # PR is exactly the case worth covering, and `agentic-rescue` above may
      # have opened one itself — a draft, which the action skips on its own.
      - name: Arm auto-merge on the PR this run opened
        if: always() && steps.context.outputs.issue != '' && vars.AGENTIC_AUTO_MERGE_ENABLED == 'true'
        continue-on-error: true
        uses: ./.github/actions/agentic-auto-merge
        with:
          token: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
          head: pipeline/feature-${{ steps.context.outputs.issue }}

      # When the run closed the issue without opening a PR, no pull_request event
      # will ever fire, so auto-assign-next.yml cannot carry the chain. Do it here.
      - name: Chain to next issue if resolved without PR
        if: steps.context.outputs.issue != '' && vars.AGENTIC_AUTO_ASSIGN_ENABLED == 'true'
        uses: ./.github/actions/agentic-assign
        with:
          token: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
          agent: ${{ vars.AGENTIC_AGENT }}
          guard: closed_without_pr
          completed_issue: ${{ steps.context.outputs.issue }}
          reason: auto-assigned after issue #${{ steps.context.outputs.issue }} was resolved without a PR
