name: "Pipeline: watchdog for stalled agent runs"

on:
  schedule:
    # Offset from the hour so it does not collide with other scheduled jobs.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: read
  actions: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      # No checkout: the sweep is `actions/github-script` and reads nothing from
      # the workspace. The composite action that needed one was the idle-queue
      # restart, which this workflow no longer performs.

      # A run that dies without labelling the issue `blocked` — OOM, a hung
      # tool call, the job timeout, a revoked token — leaves the issue
      # `in-progress` forever. The chain then halts correctly but silently, and
      # nobody is told. This sweeps those into `blocked`, which handle-failure.yml
      # already notifies on. The PAT is required: labelling with GITHUB_TOKEN
      # raises no `issues: labeled` event, so the notification would never fire.
      - name: Label stalled in-progress issues as blocked
        uses: actions/github-script@v7
        env:
          STALL_MINUTES: ${{ vars.AGENTIC_STALL_MINUTES }}
        with:
          github-token: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Comfortably above the runners' job timeout, so a slow-but-alive
            // run is never mistaken for a dead one. A configured value below the
            // timeout is a misconfiguration with teeth — it declares live runs
            // lost and reassigns their issues underneath them — so it is clamped
            // loudly rather than obeyed. Both runners declare `timeout-minutes`.
            const jobTimeoutMinutes = 360;
            const configured = parseInt(process.env.STALL_MINUTES || '', 10) || jobTimeoutMinutes + 60;
            const stallMinutes = Math.max(configured, jobTimeoutMinutes + 60);
            if (stallMinutes !== configured) {
              core.warning(
                `AGENTIC_STALL_MINUTES=${configured} is below the runners' ${jobTimeoutMinutes}-minute job timeout, ` +
                `which would sweep live runs. Using ${stallMinutes} instead.`
              );
            }
            const cutoff = Date.now() - stallMinutes * 60_000;

            const { data: inProgress } = await github.rest.issues.listForRepo({
              owner, repo, labels: 'in-progress', state: 'open', per_page: 50
            });

            if (inProgress.length === 0) {
              core.info('No in-progress issues. Nothing to sweep.');
              return;
            }

            // A PR counts only when its head is the pipeline's own branch for
            // the issue, or GitHub records it as closing the issue. A timeline
            // cross-reference counts for nothing: any PR that merely writes
            // "#N" anywhere in its body raises one, and this sweep is the
            // last-resort net — a stray mention must not make a dead run's
            // issue immortally `in-progress`. Same predicate inlined in
            // agentic-run-state and agentic-assign (no shared file — this
            // workflow runs without a checkout to read one from).
            const deliverablePr = async (issueNumber) => {
              // A work branch is `pipeline/<role>-<issue>-<runId>`: unique per run, so
              // no run can collide with the branch an earlier one abandoned (#554,
              // run 166, lost six hours to exactly that). `head` takes one exact ref,
              // so the family is enumerated first; the bare name is always asked too,
              // for the pull requests that predate the convention and for a merged
              // one whose branch has since been deleted.
              const family = new RegExp(`^pipeline/feature-${issueNumber}(?:-[A-Za-z0-9._-]+)?$`);
              const refs = await github.rest.git
                .listMatchingRefs({ owner, repo, ref: `heads/pipeline/feature-${issueNumber}` })
                .then(({ data }) => data.map((entry) => entry.ref.replace('refs/heads/', '')))
                .catch(() => []);
              const heads = [`pipeline/feature-${issueNumber}`, ...refs.filter((ref) => family.test(ref))];
              const headPrs = [];
              for (const head of new Set(heads)) {
                const { data } = await github.rest.pulls.list({
                  owner, repo, state: 'all', head: `${owner}:${head}`, per_page: 20
                });
                headPrs.push(...data);
              }
              const fromPipeline =
                headPrs.find((pr) => pr.state === 'open') || headPrs.find((pr) => pr.merged_at);
              if (fromPipeline) {
                return {
                  number: fromPipeline.number,
                  how: `from ${fromPipeline.head?.ref || `pipeline/feature-${issueNumber}`}, ${fromPipeline.merged_at ? 'merged' : 'open'}`
                };
              }
              const linked = await github.graphql(
                `query($owner: String!, $repo: String!, $number: Int!) {
                   repository(owner: $owner, name: $repo) {
                     issue(number: $number) {
                       closedByPullRequestsReferences(first: 10, includeClosedPrs: false) {
                         nodes { number merged }
                       }
                     }
                   }
                 }`,
                { owner, repo, number: issueNumber }
              );
              const closer = linked?.repository?.issue?.closedByPullRequestsReferences?.nodes?.[0];
              if (closer) {
                return { number: closer.number, how: `closing reference, ${closer.merged ? 'merged' : 'open'}` };
              }
              return null;
            };

            let swept = 0;
            for (const issue of inProgress) {
              const n = issue.number;

              // A deliverable PR means the run produced something; it is the
              // PR's CI and review that carry it from here, however long that
              // takes.
              const pr = await deliverablePr(n);
              if (pr) {
                core.info(`#${n}: pull request #${pr.number} (${pr.how}) carries it, leaving alone.`);
                continue;
              }

              const { data: events } = await github.rest.issues.listEventsForTimeline({
                owner, repo, issue_number: n, per_page: 100
              });

              const labelledAt = events
                .filter((e) => e.event === 'labeled' && e.label?.name === 'in-progress')
                .map((e) => Date.parse(e.created_at))
                .filter((t) => !Number.isNaN(t))
                .sort((a, b) => b - a)[0];

              if (labelledAt === undefined) {
                core.warning(`#${n}: in-progress but no labelling event found — cannot age it, skipping.`);
                continue;
              }

              const ageMinutes = Math.round((Date.now() - labelledAt) / 60_000);
              if (labelledAt > cutoff) {
                core.info(`#${n}: in-progress for ${ageMinutes}m, under the ${stallMinutes}m threshold.`);
                continue;
              }

              core.warning(`#${n}: in-progress for ${ageMinutes}m with no PR — marking blocked.`);

              await github.rest.issues.createComment({
                owner, repo, issue_number: n,
                body: [
                  `🕳️ **Watchdog: this run was lost.**`,
                  '',
                  `Issue #${n} has been \`in-progress\` for ${ageMinutes} minutes (threshold ${stallMinutes}) and no pull request was ever linked to it. The agent session ended without labelling the issue \`blocked\` — a crash, a hung tool call, the job timeout, or a revoked token.`,
                  '',
                  'Marking it `blocked` so the failure is visible and the chain can be restarted deliberately.',
                  '',
                  'Check the runner workflow logs for that window before resuming. Any `pipeline/*-' + n + '` branches left behind are safe to delete — the pipeline recreates them from scratch on the next run.'
                ].join('\n')
              });

              await github.rest.issues.addLabels({
                owner, repo, issue_number: n, labels: ['blocked']
              });
              await github.rest.issues.removeLabel({
                owner, repo, issue_number: n, name: 'in-progress'
              }).catch(() => {});

              swept += 1;
            }

            core.info(`Swept ${swept} stalled issue(s).`);

      # The sweep above leaves alone any issue that has a linked pull request,
      # because a PR means the run produced something and its CI and review
      # carry it from here. That is right until the PR's CI goes red with no
      # session left to read it: `agentic-auto-merge.yml` skips a failed CI run,
      # so nothing merges, nothing chains, and the linked-PR skip above makes the
      # stall invisible. Issue #552 held the queue that way behind PR #581.
      #
      # `agentic-ci-failure.yml` is what handles that, on the CI-completion
      # event. It declines while any agent session is live — a live session reads
      # its own verdict through `[await-ci]`, and a second comment would queue a
      # second runner onto one branch — and that decline is the case this step
      # covers: it re-raises the same event later by dispatching that workflow,
      # which re-applies every one of its guards. A dropped `workflow_run`
      # webhook lands here too.
      #
      # This is still not the queue restarting on a clock. Nothing here selects
      # an issue or assigns anything; it hands a pull request that already exists
      # back to the agent that already owns it. The `actions: write` scope is for
      # the dispatch, and the PAT for the same reason as everything else here.
      - name: Re-raise a red CI on an open pipeline PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            // The `-<runId>` suffix every branch has carried since #554. Anchored
            // without it, this matched no real pipeline head and the sweep swept
            // nothing — see the same note in `agentic-ci-failure.yml`.
            const PIPELINE_HEAD = /^pipeline\/feature-\d+(?:-\d+)?$/;
            const RUN_FAILURES = ['failure', 'cancelled', 'timed_out', 'startup_failure', 'stale'];

            // Kept in shape with `scripts/lib/workflow-verdict.ts` and the fail-safe's own
            // copy: a run on the head is a channel unless it is named here. Read
            // as a path list rather than a `ci.yml` lookup because a red check
            // blocks the merge whichever workflow emitted it (PR #773's was the
            // closing-keyword guard, with `ci.yml` green).
            const MACHINERY = new Set([
              '.github/workflows/agentic-auto-merge.yml',
              '.github/workflows/agentic-ci-failure.yml',
              '.github/workflows/agentic-intake.yml',
              '.github/workflows/agentic-trigger.yml',
              '.github/workflows/agentic-watchdog.yml',
              '.github/workflows/auto-assign-next.yml',
              '.github/workflows/claude-runner.yml',
              '.github/workflows/handle-failure.yml',
              '.github/workflows/opencode-runner.yml',
            ]);

            const open = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100
            });

            let raised = 0;
            for (const pr of open) {
              // Scope, in the same order the fail-safe applies it: the
              // pipeline's own branch, and never a draft — a draft is a channel
              // the run already reported it could not turn green.
              if (!PIPELINE_HEAD.test(pr.head?.ref || '') || pr.draft) continue;

              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner, repo, head_sha: pr.head.sha, per_page: 100
              });
              // One run per workflow, newest: `cancel-in-progress` leaves
              // superseded runs on the head, and counting those would re-raise a
              // failure a pushed fix already answered.
              const latest = new Map();
              for (const run of runs) {
                if (MACHINERY.has(run.path)) continue;
                const seen = latest.get(run.workflow_id);
                if (!seen || run.id > seen.id) latest.set(run.workflow_id, run);
              }
              const red = [...latest.values()].find(
                (run) => run.status === 'completed' && RUN_FAILURES.includes(run.conclusion)
              );

              if (!red) continue;

              // Every other decision — is a session live, has this commit
              // already been asked about, is the attempt limit spent — belongs
              // to the fail-safe and is made there, once, on the current state.
              core.warning(`#${pr.number}: \`${red.name}\` ${red.conclusion} on ${pr.head.sha.slice(0, 7)} — re-raising the fail-safe.`);
              await github.rest.actions.createWorkflowDispatch({
                owner, repo,
                workflow_id: 'agentic-ci-failure.yml',
                ref: context.payload.repository?.default_branch || 'main',
                inputs: { pr: String(pr.number) }
              });
              raised += 1;
            }

            core.info(`Re-raised ${raised} red pipeline PR(s).`);

      # The two sweeps above are the whole of this workflow: it reports lost runs
      # and releases the issues they were holding, and it re-raises a red CI
      # nobody is reading. It never assigns.
      #
      # That is not the same as never restarting the queue. The `blocked` label
      # the sweep applies is itself an entry point — `handle-failure.yml` reacts
      # to it and chains to the next assignable issue — so a lost run is picked
      # up rather than parked. The distinction that matters is where the decision
      # comes from: the sweep reacts to a run that died, not to the clock. An
      # idle queue with no lost run in it stays idle, however many `ready` issues
      # are waiting, until a merge or a human asks for the next one.
      #
      # This is also why the sweep must label with the PAT: a label applied with
      # GITHUB_TOKEN raises no `issues: labeled` event, and both the failure
      # notification and the chain would be lost with it.
      - name: Report
        run: echo 'Sweep complete. This workflow never assigns — the `blocked` label it applies is what releases the queue, through handle-failure.yml.'
