name: "Pipeline: watchdog for stalled agent runs"

on:
  schedule:
    # Offset from the hour so it does not collide with other scheduled jobs.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      # No checkout: the sweep is `actions/github-script` and reads nothing from
      # the workspace. The composite action that needed one was the idle-queue
      # restart, which this workflow no longer performs.

      # A run that dies without labelling the issue `blocked` — OOM, a hung
      # tool call, the job timeout, a revoked token — leaves the issue
      # `in-progress` forever. The chain then halts correctly but silently, and
      # nobody is told. This sweeps those into `blocked`, which handle-failure.yml
      # already notifies on. The PAT is required: labelling with GITHUB_TOKEN
      # raises no `issues: labeled` event, so the notification would never fire.
      - name: Label stalled in-progress issues as blocked
        uses: actions/github-script@v7
        env:
          STALL_MINUTES: ${{ vars.AGENTIC_STALL_MINUTES }}
        with:
          github-token: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Comfortably above the runners' job timeout, so a slow-but-alive
            // run is never mistaken for a dead one. A configured value below the
            // timeout is a misconfiguration with teeth — it declares live runs
            // lost and reassigns their issues underneath them — so it is clamped
            // loudly rather than obeyed. Both runners declare `timeout-minutes`.
            const jobTimeoutMinutes = 360;
            const configured = parseInt(process.env.STALL_MINUTES || '', 10) || jobTimeoutMinutes + 60;
            const stallMinutes = Math.max(configured, jobTimeoutMinutes + 60);
            if (stallMinutes !== configured) {
              core.warning(
                `AGENTIC_STALL_MINUTES=${configured} is below the runners' ${jobTimeoutMinutes}-minute job timeout, ` +
                `which would sweep live runs. Using ${stallMinutes} instead.`
              );
            }
            const cutoff = Date.now() - stallMinutes * 60_000;

            const { data: inProgress } = await github.rest.issues.listForRepo({
              owner, repo, labels: 'in-progress', state: 'open', per_page: 50
            });

            if (inProgress.length === 0) {
              core.info('No in-progress issues. Nothing to sweep.');
              return;
            }

            // A PR counts only when its head is the pipeline's own branch for
            // the issue, or GitHub records it as closing the issue. A timeline
            // cross-reference counts for nothing: any PR that merely writes
            // "#N" anywhere in its body raises one, and this sweep is the
            // last-resort net — a stray mention must not make a dead run's
            // issue immortally `in-progress`. Same predicate inlined in
            // agentic-run-state and agentic-assign (no shared file — this
            // workflow runs without a checkout to read one from).
            const deliverablePr = async (issueNumber) => {
              const { data: headPrs } = await github.rest.pulls.list({
                owner, repo, state: 'all',
                head: `${owner}:pipeline/feature-${issueNumber}`, per_page: 20
              });
              const fromPipeline = headPrs.find((pr) => pr.state === 'open' || pr.merged_at);
              if (fromPipeline) {
                return {
                  number: fromPipeline.number,
                  how: `from pipeline/feature-${issueNumber}, ${fromPipeline.merged_at ? 'merged' : 'open'}`
                };
              }
              const linked = await github.graphql(
                `query($owner: String!, $repo: String!, $number: Int!) {
                   repository(owner: $owner, name: $repo) {
                     issue(number: $number) {
                       closedByPullRequestsReferences(first: 10, includeClosedPrs: false) {
                         nodes { number merged }
                       }
                     }
                   }
                 }`,
                { owner, repo, number: issueNumber }
              );
              const closer = linked?.repository?.issue?.closedByPullRequestsReferences?.nodes?.[0];
              if (closer) {
                return { number: closer.number, how: `closing reference, ${closer.merged ? 'merged' : 'open'}` };
              }
              return null;
            };

            let swept = 0;
            for (const issue of inProgress) {
              const n = issue.number;

              // A deliverable PR means the run produced something; it is the
              // PR's CI and review that carry it from here, however long that
              // takes.
              const pr = await deliverablePr(n);
              if (pr) {
                core.info(`#${n}: pull request #${pr.number} (${pr.how}) carries it, leaving alone.`);
                continue;
              }

              const { data: events } = await github.rest.issues.listEventsForTimeline({
                owner, repo, issue_number: n, per_page: 100
              });

              const labelledAt = events
                .filter((e) => e.event === 'labeled' && e.label?.name === 'in-progress')
                .map((e) => Date.parse(e.created_at))
                .filter((t) => !Number.isNaN(t))
                .sort((a, b) => b - a)[0];

              if (labelledAt === undefined) {
                core.warning(`#${n}: in-progress but no labelling event found — cannot age it, skipping.`);
                continue;
              }

              const ageMinutes = Math.round((Date.now() - labelledAt) / 60_000);
              if (labelledAt > cutoff) {
                core.info(`#${n}: in-progress for ${ageMinutes}m, under the ${stallMinutes}m threshold.`);
                continue;
              }

              core.warning(`#${n}: in-progress for ${ageMinutes}m with no PR — marking blocked.`);

              await github.rest.issues.createComment({
                owner, repo, issue_number: n,
                body: [
                  `🕳️ **Watchdog: this run was lost.**`,
                  '',
                  `Issue #${n} has been \`in-progress\` for ${ageMinutes} minutes (threshold ${stallMinutes}) and no pull request was ever linked to it. The agent session ended without labelling the issue \`blocked\` — a crash, a hung tool call, the job timeout, or a revoked token.`,
                  '',
                  'Marking it `blocked` so the failure is visible and the chain can be restarted deliberately.',
                  '',
                  'Check the runner workflow logs for that window before resuming. Any `pipeline/*-' + n + '` branches left behind are safe to delete — the pipeline recreates them from scratch on the next run.'
                ].join('\n')
              });

              await github.rest.issues.addLabels({
                owner, repo, issue_number: n, labels: ['blocked']
              });
              await github.rest.issues.removeLabel({
                owner, repo, issue_number: n, name: 'in-progress'
              }).catch(() => {});

              swept += 1;
            }

            core.info(`Swept ${swept} stalled issue(s).`);

      # The sweep above is the whole of this workflow: it reports lost runs and
      # releases the issues they were holding. It deliberately does NOT restart
      # the queue.
      #
      # A clock-driven restart would start agent sessions nobody asked for —
      # every hour, for as long as any `ready` issue exists. Starting a run is a
      # deliberate act, and there are exactly two: a human dispatching
      # `agentic-trigger.yml`, or a merged pipeline pull request chaining
      # through `auto-assign-next.yml`. An idle queue is therefore an idle
      # queue, and stays one until somebody asks for the next run.
      - name: Report
        run: echo 'Sweep complete. This workflow never assigns — start a run with the manual trigger, or let a merged pipeline PR chain to the next issue.'
