name: "Pipeline: handle agent failure"

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  notify:
    if: github.event.label.name == 'blocked'
    runs-on: ubuntu-latest
    steps:
      - name: Comment and notify
        uses: actions/github-script@v7
        env:
          AGENTIC_AGENT: ${{ vars.AGENTIC_AGENT }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const raw = (process.env.AGENTIC_AGENT || '').trim().replace(/^@/, '').toLowerCase();
            const agent = raw === 'claude' ? 'Claude' : 'OpenCode';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: [
                `🚨 **Pipeline paused — the ${agent} agent is blocked on this issue.**`,
                '',
                '@Nico2398 — please review:',
                '1. The PR and agent session logs',
                '2. Add the clarification this issue is missing as a comment',
                '3. Remove `blocked` and add `ready`',
                '',
                'Adding `ready` is the whole resume procedure: it re-enters the intake workflow, which reassigns as soon as no other run is live. Nothing to dispatch by hand.',
                '',
                'Or complete the task manually and the pipeline will auto-continue on merge.'
              ].join('\n')
            });
