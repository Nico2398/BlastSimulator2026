name: "Pipeline: handle agent failure"

# A run that ends `blocked` is finished, exactly as a merged PR is finished. Both
# are terminal, and both have to release the queue — nothing else starts the next
# session, and a pipeline with no human in it cannot wait for somebody to notice.
# So this workflow does two things on the `blocked` label: it chains to the next
# assignable issue, and it reports what happened on the issue that stopped.
#
# Chaining from a failure is the risk the cascade brake exists to bound. A
# systemic failure — an expired token, a broken `main`, a runner image that no
# longer builds — would otherwise march through the whole backlog labelling every
# issue `blocked` in minutes. `agentic-assign` counts the runs that have ended
# `blocked` since the pipeline last merged anything and stops at
# AGENTIC_BLOCKED_CHAIN_LIMIT.
on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read
  pull-requests: read

jobs:
  chain:
    if: github.event.label.name == 'blocked'
    runs-on: ubuntu-latest
    # Shared with every other path into the queue, so no two can assign at once.
    concurrency:
      group: agentic-assignment
      cancel-in-progress: false
    outputs:
      issue: ${{ steps.assign.outputs.issue }}
      mention: ${{ steps.assign.outputs.mention }}
      halted: ${{ steps.assign.outputs.halted }}
    steps:
      # The assignability rules are read from the workspace, not vendored into
      # the action's YAML, so the repository has to be here.
      - name: Checkout repository
        if: vars.AGENTIC_AUTO_ASSIGN_ENABLED == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      # The `after_blocked_run` guard is what makes this safe to fire on any
      # `blocked` label: it chains only when the issue actually held a run, so a
      # human labelling a backlog issue `blocked` starts nothing.
      - name: Assign the next ready issue
        id: assign
        if: vars.AGENTIC_AUTO_ASSIGN_ENABLED == 'true'
        uses: ./.github/actions/agentic-assign
        with:
          token: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
          agent: ${{ vars.AGENTIC_AGENT }}
          reason: auto-assigned after issue #${{ github.event.issue.number }} ended blocked
          guard: after_blocked_run
          completed_issue: ${{ github.event.issue.number }}
          blocked_chain_limit: ${{ vars.AGENTIC_BLOCKED_CHAIN_LIMIT }}

  notify:
    if: always() && github.event.label.name == 'blocked'
    needs: chain
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN deliberately: this comment carries no agent mention and must
      # trigger nothing. The assignment comment the chain job posts is the only
      # comment in the pipeline allowed to wake a runner.
      - name: Comment and notify
        uses: actions/github-script@v7
        env:
          AGENTIC_AGENT: ${{ vars.AGENTIC_AGENT }}
          CHAINED_ISSUE: ${{ needs.chain.outputs.issue }}
          CHAIN_HALTED: ${{ needs.chain.outputs.halted }}
          CHAIN_RESULT: ${{ needs.chain.result }}
          AUTO_ASSIGN: ${{ vars.AGENTIC_AUTO_ASSIGN_ENABLED }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const raw = (process.env.AGENTIC_AGENT || '').trim().replace(/^@/, '').toLowerCase();
            const agent = raw === 'claude' ? 'Claude' : 'OpenCode';
            const chained = process.env.CHAINED_ISSUE || '';
            const halted = process.env.CHAIN_HALTED === 'true';
            const autoAssign = process.env.AUTO_ASSIGN === 'true';

            // What happened to the queue is the part a human cannot infer from
            // this issue alone, so it is stated rather than left to be checked.
            // A chain that did not finish must never read as "nothing was
            // assignable" — that is the one wording that would send someone away
            // from a queue that has actually stalled.
            const queue = halted
              ? '⛔ **The queue is parked.** Too many runs in a row have ended `blocked` since the last pipeline merge, so the chain stopped rather than working through the backlog. See the cascade-brake comment above.'
              : chained
                ? `➡️ **The pipeline has moved on to #${chained}.** This issue is not holding the queue.`
                : !autoAssign
                  ? '💤 **Auto-assign is off** (`AGENTIC_AUTO_ASSIGN_ENABLED`), so nothing was chained.'
                  : process.env.CHAIN_RESULT !== 'success'
                    ? `⚠️ **The chain step did not complete** (\`${process.env.CHAIN_RESULT}\`), so nothing was assigned and the queue state is unknown. Check this workflow run.`
                    : '💤 **Nothing else was assignable**, so the queue is idle. It resumes on the next merged pipeline PR, on the next run that ends blocked, or on a manual dispatch.';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: [
                `🚨 **The ${agent} agent is blocked on this issue.**`,
                '',
                queue,
                '',
                '@Nico2398 — please review:',
                '1. The PR and agent session logs',
                '2. Add the clarification this issue is missing as a comment',
                '3. Remove `blocked` and add `ready`',
                '',
                'Adding `ready` puts this issue back in the queue; it does not start a run. A run begins when a pipeline PR merges, when another run ends blocked, or when a human dispatches **Pipeline: run the configured agent on the next ready issue**.',
                '',
                'If a rescued draft PR is still open against this issue, close it or finish it before adding `ready` — an issue with an open PR is not assignable, because a second run would collide with the branch that PR is built on.',
                '',
                'Or complete the task manually and the pipeline will auto-continue on merge.'
              ].join('\n')
            });
