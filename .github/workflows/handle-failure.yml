name: "Pipeline: handle a run that halted without merging"

# A run that ends `blocked` or `paused` is finished, exactly as a merged PR is
# finished. All three are terminal, and all three have to release the queue —
# nothing else starts the next session, and a pipeline with no human in it cannot
# wait for somebody to notice. So this workflow does two things on either label:
# it chains to the next assignable issue, and it reports what happened on the
# issue that stopped.
#
# The two labels differ only in who acts next, and that changes the notice rather
# than the chaining:
#
#   blocked — a human has to answer something. The issue leaves the queue and
#             waits, and the notice asks for the clarification.
#   paused  — a dependency the run filed is in the way. The issue is already back
#             at `ready` with that dependency as its `Blocked by`, so the queue
#             brings it back on its own once the dependency lands; the notice
#             says so and asks for nothing.
#
# Chaining from a halt is the risk the cascade brake exists to bound. A systemic
# failure — an expired token, a broken `main`, a runner image that no longer
# builds — would otherwise march through the whole backlog in minutes.
# `agentic-assign` counts the runs that have halted under either label since the
# pipeline last merged anything and stops at AGENTIC_BLOCKED_CHAIN_LIMIT.
on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read
  pull-requests: read

jobs:
  chain:
    if: github.event.label.name == 'blocked' || github.event.label.name == 'paused'
    runs-on: ubuntu-latest
    # Shared with every other path into the queue, so no two can assign at once.
    concurrency:
      group: agentic-assignment
      cancel-in-progress: false
    outputs:
      issue: ${{ steps.assign.outputs.issue }}
      mention: ${{ steps.assign.outputs.mention }}
      halted: ${{ steps.assign.outputs.halted }}
    steps:
      # The assignability rules are read from the workspace, not vendored into
      # the action's YAML, so the repository has to be here.
      - name: Checkout repository
        if: vars.AGENTIC_AUTO_ASSIGN_ENABLED == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      # The `after_*_run` guards are what make this safe to fire on any such
      # label: each chains only when the issue actually held a run, so a human
      # labelling a backlog issue `blocked` starts nothing.
      - name: Assign the next ready issue
        id: assign
        if: vars.AGENTIC_AUTO_ASSIGN_ENABLED == 'true'
        uses: ./.github/actions/agentic-assign
        with:
          token: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
          agent: ${{ vars.AGENTIC_AGENT }}
          # Quoted, and it has to stay quoted: YAML opens a comment at an
          # unquoted ` #`, so this read `auto-assigned after issue` on every run
          # since it was written — the issue number and the outcome were parsed
          # away, and the assignment comment quoting the reason said neither.
          reason: "auto-assigned after issue #${{ github.event.issue.number }} ended ${{ github.event.label.name }}"
          guard: ${{ github.event.label.name == 'paused' && 'after_paused_run' || 'after_blocked_run' }}
          completed_issue: ${{ github.event.issue.number }}
          blocked_chain_limit: ${{ vars.AGENTIC_BLOCKED_CHAIN_LIMIT }}

  notify:
    if: always() && (github.event.label.name == 'blocked' || github.event.label.name == 'paused')
    needs: chain
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN deliberately: this comment carries no agent mention and must
      # trigger nothing. The assignment comment the chain job posts is the only
      # comment in the pipeline allowed to wake a runner.
      - name: Comment and notify
        uses: actions/github-script@v7
        env:
          AGENTIC_AGENT: ${{ vars.AGENTIC_AGENT }}
          CHAINED_ISSUE: ${{ needs.chain.outputs.issue }}
          CHAIN_HALTED: ${{ needs.chain.outputs.halted }}
          CHAIN_RESULT: ${{ needs.chain.result }}
          AUTO_ASSIGN: ${{ vars.AGENTIC_AUTO_ASSIGN_ENABLED }}
          HALT_LABEL: ${{ github.event.label.name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const raw = (process.env.AGENTIC_AGENT || '').trim().replace(/^@/, '').toLowerCase();
            const agent = raw === 'claude' ? 'Claude' : 'OpenCode';
            const chained = process.env.CHAINED_ISSUE || '';
            const halted = process.env.CHAIN_HALTED === 'true';
            const autoAssign = process.env.AUTO_ASSIGN === 'true';
            const paused = process.env.HALT_LABEL === 'paused';

            // What happened to the queue is the part a human cannot infer from
            // this issue alone, so it is stated rather than left to be checked.
            // A chain that did not finish must never read as "nothing was
            // assignable" — that is the one wording that would send someone away
            // from a queue that has actually stalled.
            const queue = halted
              ? '⛔ **The queue is parked.** Too many runs in a row have halted without merging since the last pipeline merge, so the chain stopped rather than working through the backlog. See the cascade-brake comment above.'
              : chained
                ? `➡️ **The pipeline has moved on to #${chained}.** This issue is not holding the queue.`
                : !autoAssign
                  ? '💤 **Auto-assign is off** (`AGENTIC_AUTO_ASSIGN_ENABLED`), so nothing was chained.'
                  : process.env.CHAIN_RESULT !== 'success'
                    ? `⚠️ **The chain step did not complete** (\`${process.env.CHAIN_RESULT}\`), so nothing was assigned and the queue state is unknown. Check this workflow run.`
                    : '💤 **Nothing else was assignable**, so the queue is idle. It resumes on the next merged pipeline PR, on the next run that halts, or on a manual dispatch.';

            // A pause is not a failure and must not read as one. Nothing is
            // being asked of a human here: the issue is already back at `ready`
            // behind the dependency the run filed, and the queue returns to it
            // by itself once that dependency merges. Printing the `blocked`
            // notice's "please add the clarification this issue is missing"
            // would send someone looking for a question that was never asked.
            const report = paused
              ? [
                  `⏸️ **The ${agent} agent paused this issue — it is waiting on another issue, not on you.**`,
                  '',
                  queue,
                  '',
                  'The run stopped because something it depends on has to land first. It filed that dependency, recorded it as this issue\'s `Blocked by`, and put this issue back to `ready`. Nothing is lost and nothing is expected of you:',
                  '',
                  '- While the dependency is open, this issue is skipped — `assignability.cjs` will not start a run on ground that is not there.',
                  '- When the dependency\'s PR merges, this issue becomes assignable again and the queue picks it up in number order.',
                  '- Any work the run had already finished is on a draft PR labelled `paused`. That PR is the resume point, and the next run is told to continue on its branch rather than start again. **Leave it open** — closing it discards the work; merging it lands a half-finished change.',
                  '',
                  'Read the run\'s own comment above for what it finished and what it left. Intervene only if you disagree with the dependency it identified.'
                ]
              : [
                  `🚨 **The ${agent} agent is blocked on this issue.**`,
                  '',
                  queue,
                  '',
                  '@Nico2398 — please review:',
                  '1. The PR and agent session logs',
                  '2. Add the clarification this issue is missing as a comment',
                  '3. Remove `blocked` and add `ready`',
                  '',
                  'Adding `ready` puts this issue back in the queue; it does not start a run. A run begins when a pipeline PR merges, when another run halts, or when a human dispatches **Pipeline: run the configured agent on the next ready issue**.',
                  '',
                  'If a rescued draft PR is still open against this issue, close it or finish it before adding `ready` — an issue with an open PR is not assignable, because a second run would collide with the branch that PR is built on. The one exception is a PR labelled `paused`: that is a deliberate handover and the queue knows to resume from it.',
                  '',
                  'Or complete the task manually and the pipeline will auto-continue on merge.'
                ];

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: report.join('\n')
            });
