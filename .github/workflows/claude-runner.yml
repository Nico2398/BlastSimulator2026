name: Claude Pipeline

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to resolve'
        required: false
        type: string
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  # Repo-wide, and shared by name with the other runner: exactly one autonomous
  # agent session may run at a time, whichever runtime it is. Queued runs wait
  # rather than cancel the live one.
  group: agentic-runner
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  run:
    # Mirrors opencode-runner.yml's trigger, with @claude as the mention. Both
    # runners stay enabled: the assignment comment names exactly one agent, so
    # only the configured one answers, and a human can still summon the other
    # by hand.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.comment.user.type != 'Bot' &&
        (
          startsWith(github.event.comment.body, '@claude ') ||
          contains(github.event.comment.body, ' @claude ') ||
          endsWith(github.event.comment.body, ' @claude') ||
          github.event.comment.body == '@claude' ||
          startsWith(github.event.comment.body, '@Claude ') ||
          contains(github.event.comment.body, ' @Claude ') ||
          endsWith(github.event.comment.body, ' @Claude') ||
          github.event.comment.body == '@Claude'
        )
      )
    runs-on: ubuntu-latest
    # GitHub-hosted maximum. 180 was not enough for a real run: issue #404 was
    # still fixing code-review findings when the clock cut it off at three hours,
    # and a cancelled job loses everything the rescue step cannot push. A run
    # that overruns 360 minutes is stuck, not slow. `AGENTIC_STALL_MINUTES` must
    # stay above this — see agentic-watchdog.yml.
    timeout-minutes: 360
    steps:
      # First step, so elapsed time measured against it matches the window
      # `timeout-minutes` is counting. The retry gate below spends it.
      - name: Record when the job started
        id: clock
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The pipeline branches off main and cherry-picks between its own
          # branches; a shallow clone loses the history those operations need.
          fetch-depth: 0
          persist-credentials: false

      # Branch pushes and `gh pr create` must run under the PAT. A PR opened
      # with GITHUB_TOKEN raises no pull_request event, which would leave
      # auto-assign-next.yml dormant and break the autonomy loop.
      - name: Setup git auth for push operations
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
        run: gh auth setup-git

      # The pipeline creates every branch from `main` by name. On a PR review
      # comment the workspace is on the PR head, and `git rev-parse main` fails
      # when only `origin/main` exists — fetch-depth 0 above guarantees it does.
      - name: Ensure a local main ref to branch from
        run: git rev-parse --verify --quiet main >/dev/null || git branch main origin/main

      # Claude runs the verification channels itself. Without Node, dependencies
      # and a browser, every `npm run` fails before permissions matter.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer Chrome
        run: npx puppeteer browsers install chrome

      # Shared with opencode-runner.yml so both runtimes receive the same task text.
      - name: Build trigger context prompt
        id: context
        uses: ./.github/actions/agentic-prompt
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue_number: ${{ inputs.issue_number }}

      # OpenCode starts in the orchestrator through `default_agent` in
      # .opencode/opencode.json. Claude Code has no equivalent setting, so the
      # /agentic-run command carries that mandate instead.
      - name: Run Claude Code
        id: claude
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The PAT, not GITHUB_TOKEN. The action exports its own `github_token`
          # into the session environment, overriding the step-level `GH_TOKEN`
          # above — so whatever is passed here is the identity `gh pr create`
          # runs under, and the account that ends up authoring the PR. With
          # GITHUB_TOKEN that account is `github-actions[bot]`, and GitHub
          # creates the PR's `pull_request` workflow runs already parked as
          # `action_required`: "N workflows awaiting approval", no CI, no
          # auto-assign, until something approves them by hand. PR #430 opened
          # that way. Under the PAT the author is a real repository user, the
          # runs start on their own, and the parked-run release in
          # `agentic-auto-merge` goes back to being a safety net rather than the
          # only thing that ever starts CI.
          github_token: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
          additional_permissions: |
            actions: read
          # Any branch the harness generates for itself lands inside the
          # pipeline namespace, where it cannot be mistaken for the deliverable
          # `pipeline/feature-<N>` and is already skipped by claude-code-review.
          branch_prefix: 'pipeline/scratch-'
          # `/agentic-run` forks straight into the `orchestrator` agent, so the
          # orchestrator is the first thing that runs — the equivalent of
          # OpenCode's `default_agent`. The entity reference leads the argument
          # so the fork still knows what it is working on even if the multi-line
          # context that follows does not survive argument substitution.
          prompt: |
            /agentic-run ${{ steps.context.outputs.entity }}
            ${{ steps.context.outputs.prompt }}
          # No permission prompts. The runner is a throwaway VM with no access
          # beyond this checkout and the job's own scoped tokens, and there is
          # no human present to approve anything -- a prompt is a silent hang.
          # `deny` rules still apply, so the .env reads denied in
          # .claude/settings.json stay denied.
          claude_args: '--permission-mode bypassPermissions --model claude-sonnet-5'
          # Without this the action prints "full output hidden for security" and
          # the job log carries no tool trace at all, so a finished run cannot be
          # audited: which specialists the orchestrator delegated to, and which
          # verification channels it actually ran, are only knowable from the
          # summary comment the session writes about itself.
          #
          # This repo is public, so the log — not an artifact — is the right
          # place for it. Actions redacts registered secrets from log output;
          # uploaded artifacts get no such treatment, and this runner holds a PAT
          # and runs under `bypassPermissions`, so a transcript artifact would
          # publish anything a Bash step happened to echo.
          show_full_output: true

      # `always()`: a crashed, failed or early-ended attempt is exactly the case
      # this gate exists to catch. A cancelled job (the 360-minute timeout) skips
      # it, which is correct — there is no clock left to retry inside.
      - name: Did the run settle its issue?
        id: state
        if: always() && steps.context.outputs.issue != ''
        uses: ./.github/actions/agentic-run-state
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue: ${{ steps.context.outputs.issue }}
          started_at: ${{ steps.clock.outputs.started_at }}
          budget_minutes: '360'

      # Spelled out rather than looped because Actions has no loop over a `uses:`
      # step. One retry, not three: a real run takes over two hours, so a second
      # attempt is all the 360-minute budget holds — and the failures this catches
      # (a turn ended with work outstanding, a crash in the first minutes, a
      # transient API error) all die early and leave the whole budget behind.
      #
      # The `if` has no `success()` in it deliberately: this must run precisely
      # when the attempt above did not settle the issue, whether it reported
      # failure or reported success having done nothing.
      - name: Retry the run when the first attempt settled nothing
        id: claude_retry
        if: steps.state.outputs.retry == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Same PAT as the first attempt, for the same reason: the retry is the
          # attempt that opens the PR whenever the first one did not.
          github_token: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
          additional_permissions: |
            actions: read
          branch_prefix: 'pipeline/scratch-'
          # Same entry point as the first attempt, prefixed with what went wrong.
          # The branch inventory matters: a branch the previous attempt built is
          # on this disk and nowhere else, so the retry either continues it or
          # rebuilds it, and it cannot know which without being told.
          prompt: |
            /agentic-run ${{ steps.context.outputs.entity }}
            ▶ THIS IS A RETRY. The previous session in this job ended without settling this issue.

            ${{ steps.state.outputs.reason }}

            What that attempt left on this runner's disk:
            ${{ steps.state.outputs.branch_state }}

            Those branches exist here and nowhere else — they were never pushed. Inspect them
            before deciding: continue the furthest one that is sound, or rebuild from `main`.
            Either way this attempt owes the same terminal outcome as any other run.

            The most likely reason the last attempt ended early is a delegation that did not
            return inside the turn that issued it. Every delegation is synchronous. Parallel
            means several delegations in ONE message, all awaited in that same turn — never
            work launched now and collected later, because there is no later turn.

            ${{ steps.context.outputs.prompt }}
          claude_args: '--permission-mode bypassPermissions --model claude-sonnet-5'
          show_full_output: true

      # Reported, not acted on: the rescue step below reads the state itself and
      # owns what happens next. This exists so the job log names the outcome of
      # the retry instead of leaving it to be inferred from the rescue comment.
      - name: Did the retry settle its issue?
        if: always() && steps.claude_retry.outcome != 'skipped'
        uses: ./.github/actions/agentic-run-state
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue: ${{ steps.context.outputs.issue }}

      # A session that ends before opening its PR leaves `pipeline/feature-<N>`
      # on this VM and nowhere else. `always()`: the cases worth rescuing are
      # exactly the ones where the step above failed, timed out, or was
      # cancelled — and the one where it "succeeded" having ended its turn on
      # work it was still waiting for.
      - name: Rescue an unfinished run
        if: always() && steps.context.outputs.issue != ''
        uses: ./.github/actions/agentic-rescue
        with:
          token: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
          issue: ${{ steps.context.outputs.issue }}

      # The run just opened its PR, so this is the moment the PR came into
      # existence — and the only moment that does not depend on who opened it.
      # A PR authored by `github-actions[bot]` raises `pull_request` workflow
      # runs that GitHub creates and immediately parks as `action_required`:
      # auto-assign-next.yml never runs, and neither does CI. This step reads the
      # `READY TO MERGE` marker off the branch this run was told to build,
      # releases those parked runs so CI actually starts, and enables auto-merge
      # under the PAT. `always()`: an agent step that crashed after opening the
      # PR is exactly the case worth covering, and `agentic-rescue` above may
      # have opened one itself — a draft, which the action skips on its own.
      - name: Arm auto-merge on the PR this run opened
        if: always() && steps.context.outputs.issue != '' && vars.AGENTIC_AUTO_MERGE_ENABLED == 'true'
        continue-on-error: true
        uses: ./.github/actions/agentic-auto-merge
        with:
          token: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
          head: pipeline/feature-${{ steps.context.outputs.issue }}

      # When the run closed the issue without opening a PR, no pull_request event
      # will ever fire, so auto-assign-next.yml cannot carry the chain. Do it here.
      - name: Chain to next issue if resolved without PR
        if: steps.context.outputs.issue != '' && vars.AGENTIC_AUTO_ASSIGN_ENABLED == 'true'
        uses: ./.github/actions/agentic-assign
        with:
          token: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
          agent: ${{ vars.AGENTIC_AGENT }}
          guard: closed_without_pr
          completed_issue: ${{ steps.context.outputs.issue }}
          reason: auto-assigned after issue #${{ steps.context.outputs.issue }} was resolved without a PR
