name: "Pipeline: assign next issue to the configured agent"

on:
  # `READY TO MERGE` normally arrives with the PR, so `opened` carries the happy
  # path. The others are the ways it can arrive later, and each was a dead end: a
  # body edited to add the line, a draft marked ready (auto-merge cannot be
  # enabled on a draft, so the attempt at `opened` is discarded), a PR reopened
  # after being closed. Auto-merge never being enabled means the PR never merges,
  # and an issue whose PR never merges holds the assignment queue for as long as
  # it stays open — the watchdog skips issues that have a linked PR.
  # `agentic-auto-merge` is idempotent, so re-evaluating costs nothing.
  #
  # This is the fast path and not the guarantee. These events never fire at all
  # for a PR authored by `github-actions[bot]`, whose runs are parked as
  # `action_required` — and none of them fires when CI finishes, which on this
  # repository is the moment the PR becomes mergeable at all. Every one of them
  # therefore runs while the checks are still in flight, and the action reports
  # the PR as pending rather than holding a runner open for it.
  # agentic-auto-merge.yml, on `workflow_run`, is what comes back afterwards.
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, closed]

permissions:
  issues: write
  contents: write
  pull-requests: write
  actions: write

jobs:
  # Arming and chaining are split because only one of them may be serialised.
  # Assignment shares a repo-wide concurrency group with every other path into
  # the queue; arming must not, because GitHub keeps one pending run per group
  # and drops the rest, and a dropped arming run is a PR that never merges.
  arm-auto-merge:
    if: github.event.action != 'closed' && vars.AGENTIC_AUTO_MERGE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      # Checked out because a composite action is read from the workspace, not
      # from the API.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      # The marker test, the gated-run release and the enable all live in the
      # action, so this path and the sweep in agentic-auto-merge.yml cannot
      # disagree about what "ready to merge" means.
      - name: Enable auto-merge
        continue-on-error: true
        uses: ./.github/actions/agentic-auto-merge
        with:
          token: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
          pr: ${{ github.event.pull_request.number }}

  chain-next-task:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    # Shared with every other path into the queue, so no two can assign at once.
    concurrency:
      group: agentic-assignment
      cancel-in-progress: false
    steps:
      - name: Close the completed issue
        id: close-issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prBody = context.payload.pull_request.body || '';

            // Anchored to a line of its own: `Closes #N` on its own line is the
            // pipeline's PR-body convention (agentic-assign writes it into every
            // assignment, agentic-rescue writes it into every rescue body). An
            // unanchored match let any prose mention — "also fixes #X
            // partially", a quoted issue body — close the wrong issue, label it
            // `done`, and feed the wrong number to agentic-assign, while the
            // right issue kept holding the queue.
            const closesMatch = prBody.match(/^\s*(?:Closes?|Resolves|Fixes)\s+#(\d+)\s*$/im);
            if (!closesMatch) {
              core.info('No explicit close directive found in PR body. Skipping issue close.');
              core.setOutput('issue', '');
              return;
            }

            const n = parseInt(closesMatch[1], 10);
            core.info(`Closing issue #${n} (referenced in merged PR body).`);
            await github.rest.issues.update({ owner, repo, issue_number: n, state: 'closed' });
            await github.rest.issues.addLabels({ owner, repo, issue_number: n, labels: ['done'] }).catch(() => {});
            await github.rest.issues.removeLabel({ owner, repo, issue_number: n, name: 'in-progress' }).catch(() => {});
            core.setOutput('issue', String(n));

      - name: Checkout repository
        if: vars.AGENTIC_AUTO_ASSIGN_ENABLED == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      # The assignment comment mentions whichever agent AGENTIC_AGENT names, and
      # that mention starts the matching runner workflow. This is the link that
      # closes the autonomy loop: merged PR → next issue → next agent run.
      - name: Assign the next ready issue
        id: assign
        if: vars.AGENTIC_AUTO_ASSIGN_ENABLED == 'true'
        uses: ./.github/actions/agentic-assign
        with:
          token: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
          agent: ${{ vars.AGENTIC_AGENT }}
          reason: auto-assigned from merged PR #${{ github.event.pull_request.number }}
          completed_issue: ${{ steps.close-issue.outputs.issue }}

      - name: Report auto-assign state
        run: |
          if [ "${{ vars.AGENTIC_AUTO_ASSIGN_ENABLED }}" != "true" ]; then
            echo 'Auto-assign is disabled (AGENTIC_AUTO_ASSIGN_ENABLED is not "true").'
          elif [ -n "${{ steps.assign.outputs.issue }}" ]; then
            echo "Assigned issue #${{ steps.assign.outputs.issue }} to ${{ steps.assign.outputs.mention }}."
          else
            echo "Nothing assigned — see the assign step for the reason."
          fi
