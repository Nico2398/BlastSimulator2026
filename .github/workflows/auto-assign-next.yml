name: "Pipeline: assign next issue to the configured agent"

on:
  # Two jobs on one trigger. `chain-next-task` reacts to a merge. `wake-merge-gate`
  # reacts to everything else a pull request does, because `READY TO MERGE` can
  # arrive after the PR did — a body edited to add the line, a draft marked
  # ready, a PR reopened — and when CI has already finished by then, no CI event
  # is coming to bring the merge gate back. Each was once a dead end: a marked,
  # green PR that never merged, holding its issue and every assignment behind
  # it, because the watchdog skips issues that have a linked PR.
  #
  # These events never fire at all for a PR authored by `github-actions[bot]`,
  # whose runs are parked as `action_required`. The gate's own triggers — CI
  # completing, a runner finishing — are what reach that PR.
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, closed]

permissions:
  issues: write
  contents: write
  pull-requests: write
  actions: write

jobs:
  # Waking the gate and chaining are split because only one of them may be
  # serialised. Assignment shares a repo-wide concurrency group with every other
  # path into the queue; the wake-up must not, because GitHub keeps one pending
  # run per group and drops the rest, and a dropped wake-up is a PR nobody
  # looks at again.
  #
  # It merges nothing itself. `agentic-auto-merge.yml` is the one workflow that
  # merges, under its own lock, because a merge decided here — one PR at a
  # time, on this PR's head alone — is exactly the merge that lands two
  # separately-green PRs onto an untested `main`.
  wake-merge-gate:
    if: >-
      github.event.action != 'closed' &&
      vars.AGENTIC_AUTO_MERGE_ENABLED == 'true' &&
      !github.event.pull_request.draft &&
      (
        contains(github.event.pull_request.body, 'READY TO MERGE') ||
        startsWith(github.event.pull_request.head.ref, 'pipeline/feature-')
      )
    runs-on: ubuntu-latest
    steps:
      # `continue-on-error`: this run sits on the PR head, and a red one would
      # read to every reader of that head as a failing channel — even though
      # this workflow is on the machinery list, a human reading the checks is
      # not. A dispatch that did not happen is re-raised by the watchdog.
      - name: Ask the merge gate to look
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          PR: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
        with:
          github-token: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'agentic-auto-merge.yml',
              ref: context.payload.repository?.default_branch || 'main',
              inputs: { reason: `pull request #${process.env.PR} ${process.env.ACTION}` }
            });
            core.info(`Asked the merge gate to look — #${process.env.PR} ${process.env.ACTION}.`);

  chain-next-task:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    # Shared with every other path into the queue, so no two can assign at once.
    concurrency:
      group: agentic-assignment
      cancel-in-progress: false
    steps:
      - name: Close the completed issue
        id: close-issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prBody = context.payload.pull_request.body || '';

            // Anchored to a line of its own: `Closes #N` on its own line is the
            // pipeline's PR-body convention (agentic-assign writes it into every
            // assignment, agentic-rescue writes it into every rescue body). An
            // unanchored match let any prose mention — "also fixes #X
            // partially", a quoted issue body — close the wrong issue, label it
            // `done`, and feed the wrong number to agentic-assign, while the
            // right issue kept holding the queue.
            //
            // Every such line, not the first: one pull request can finish
            // several issues. PR #1251 closed #1200 and #1252; only #1200 got
            // `done`, and #1252 was left closed still claiming `in-progress`.
            const closing = [...new Set(
              [...prBody.matchAll(/^\s*(?:Closes?|Resolves|Fixes)\s+#(\d+)\s*$/gim)].map((m) => parseInt(m[1], 10))
            )];
            if (closing.length === 0) {
              core.info('No explicit close directive found in PR body. Skipping issue close.');
              core.setOutput('issue', '');
              return;
            }

            for (const n of closing) {
              core.info(`Closing issue #${n} (referenced in merged PR body).`);
              await github.rest.issues.update({ owner, repo, issue_number: n, state: 'closed', state_reason: 'completed' });
              // The Definition of Done (`agentic-autonomous-pipeline`): a closed
              // issue carries `done` and nothing that says the work is still
              // queued, owned, halted or waiting. The merge gate has already made
              // the other half true — this PR merged only with CI green on a head
              // containing `main`'s tip. Scope labels stay, as the record of what
              // the change touched.
              await github.rest.issues.addLabels({ owner, repo, issue_number: n, labels: ['done'] }).catch(() => {});
              for (const stale of ['in-progress', 'ready', 'blocked', 'paused']) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: n, name: stale }).catch(() => {});
              }
            }
            // The assigner takes one finished issue, for the cascade-brake count
            // and its notices. Every one of them has already dropped
            // `in-progress` above, so none is counted as live either way.
            core.setOutput('issue', String(closing[0]));

      - name: Checkout repository
        if: vars.AGENTIC_AUTO_ASSIGN_ENABLED == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      # The assignment comment mentions whichever agent AGENTIC_AGENT names, and
      # that mention starts the matching runner workflow. This is the link that
      # closes the autonomy loop: merged PR → next issue → next agent run.
      - name: Assign the next ready issue
        id: assign
        if: vars.AGENTIC_AUTO_ASSIGN_ENABLED == 'true'
        uses: ./.github/actions/agentic-assign
        with:
          token: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
          agent: ${{ vars.AGENTIC_AGENT }}
          # Quoted, and it has to stay quoted: YAML opens a comment at an
          # unquoted ` #`, so this read `auto-assigned from merged PR` on every
          # run since it was written, with the PR number parsed away.
          reason: "auto-assigned from merged PR #${{ github.event.pull_request.number }}"
          completed_issue: ${{ steps.close-issue.outputs.issue }}
          max_parallel: ${{ vars.AGENTIC_MAX_PARALLEL_RUNS }}

      - name: Report auto-assign state
        run: |
          if [ "${{ vars.AGENTIC_AUTO_ASSIGN_ENABLED }}" != "true" ]; then
            echo 'Auto-assign is disabled (AGENTIC_AUTO_ASSIGN_ENABLED is not "true").'
          elif [ -n "${{ steps.assign.outputs.issues }}" ]; then
            echo "Assigned issue(s) ${{ steps.assign.outputs.issues }} to ${{ steps.assign.outputs.mention }}."
          else
            echo "Nothing assigned — see the assign step for the reason."
          fi
