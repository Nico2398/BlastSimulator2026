name: "Pipeline: run the configured agent on the next ready issue"

on:
  workflow_dispatch:  # manual trigger only

permissions:
  issues: write
  contents: read

jobs:
  kickstart:
    runs-on: ubuntu-latest
    # Shared with every other path into the queue, so no two can assign at once.
    concurrency:
      group: agentic-assignment
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Posts the assignment comment that mentions the configured agent, which
      # in turn starts claude-runner.yml or opencode-runner.yml. The PAT matters:
      # a comment posted with GITHUB_TOKEN triggers no workflow at all.
      - name: Assign the next ready issue
        id: assign
        uses: ./.github/actions/agentic-assign
        with:
          token: ${{ secrets.PAT_TOKEN_COPILOT_AUTOMATION }}
          agent: ${{ vars.AGENTIC_AGENT }}
          reason: manual pipeline trigger
          max_parallel: ${{ vars.AGENTIC_MAX_PARALLEL_RUNS }}

      - name: Report
        run: |
          if [ -n "${{ steps.assign.outputs.issues }}" ]; then
            echo "Assigned issue(s) ${{ steps.assign.outputs.issues }} to ${{ steps.assign.outputs.mention }}."
          else
            echo "Nothing assigned — see the step above for the reason."
          fi
