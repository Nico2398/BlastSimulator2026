name: "Agent Task"
description: "One atomic task for the autonomous pipeline"
labels: ["agent-task", "ready"]
body:
  - type: markdown
    attributes:
      value: >
        Filing this issue is the whole handover. The pipeline picks it up on its own,
        plans it, writes the tests, implements it, verifies it, and opens the pull
        request. Describe the outcome you want — the planner derives which files and
        tests it needs. Where this issue leaves a choice open the run takes the default
        the specs already imply and records it in the pull request, so an unanswered
        corner is not a reason to hold the issue back.

        This form files the issue `ready`, which is a promise that it meets the
        Definition of Ready (the `agentic-issue-creation` skill): the outcome and how
        to verify it are stated, every dependency is declared, and the Scope field
        says which areas the change stays inside. Scope is what lets several runs work
        at once without stepping on each other; an issue without one is taken back
        out of the queue with a comment saying so.

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why does this task exist? What feature does it belong to?
    validations:
      required: true

  - type: textarea
    id: task
    attributes:
      label: Task
      description: >
        What should be different once this is done? Name the mechanic, screen, or
        behaviour. Reference files and functions when you already know them.
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: >
        How a reader tells this is finished — observable outcomes, not commands.
        The run picks the verification channels itself.
      value: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: >
        Every area the change will edit — not the areas it only reads, calls or
        tests through. Runs whose scopes do not overlap can work at the same
        time, so every extra scope costs parallelism. engine: src/core/engine,
        entities, state · nav: src/core/nav, src/core/mining · economy:
        src/core/economy, campaign, scores · world: src/core/world, weather,
        events · ui: all of src/ui or its shared base (UIManager, PanelBase, dom,
        styles, tokens) — clashes with every UI area below · hud: shell, notify,
        MiniMap · panels: management panels and modals · workshop: blast
        planning UI · scene: src/ui/scene, BuildMenu · tutorial: tutorial
        overlay and steps · screens: menus, loading, world map, level end ·
        renderer: src/renderer, src/audio, 3D models · console: src/console ·
        scenarios: scripts/scenario-defs and the scenario runners · pipeline:
        workflows, actions, .github/scripts, agents, agentic-* skills (runs
        alone) · global: many areas at once (runs alone). A gameplay or dev skill
        takes the scope of the code it documents; files every area touches, like
        balance.ts or the locale files, need no scope of their own.
      multiple: true
      options:
        - scope:engine
        - scope:nav
        - scope:economy
        - scope:world
        - scope:ui
        - scope:hud
        - scope:panels
        - scope:workshop
        - scope:scene
        - scope:tutorial
        - scope:screens
        - scope:renderer
        - scope:console
        - scope:scenarios
        - scope:pipeline
        - scope:global
    validations:
      required: true

  - type: textarea
    id: blocked_by
    attributes:
      label: Blocked by
      description: >
        Issues that must have landed before this one starts. The pipeline defers this
        issue until every one of them is closed with its pull request merged.
        Prefer setting these in the issue's Relationships panel ("Blocked by") once
        it exists — that is what the queue trusts. What you write here is read too,
        and is what a human reads.
      placeholder: "#123 — level definition must exist first"

  - type: textarea
    id: constraints
    attributes:
      label: Scope constraints
      description: What this task should leave alone.
      placeholder: "Do not modify CI config, do not add dependencies"
