name: "Assign next agent task"
description: >
  Picks the next assignable ready issue, flips its labels, and posts the standard
  pipeline assignment comment addressed to the configured autonomous agent. The
  comment is the trigger: mentioning @claude or @opencode starts that runtime's
  runner workflow. Comment text is identical for both agents apart from the
  mention itself.

  What counts as assignable is decided in `.github/scripts/assignability.cjs`,
  which every entry point reaches through this action, so no two paths into the
  queue can disagree about it. The repository must be checked out — the rules are
  read from the workspace.

inputs:
  token:
    description: >
      Token used to post the assignment comment. Must be a PAT — a comment
      posted with GITHUB_TOKEN never triggers the runner workflows.
    required: true
  agent:
    description: >
      Configured autonomous agent, from the AGENTIC_AGENT repository variable.
      Accepts "@claude", "claude", "@opencode", "opencode". Empty means @opencode.
    required: false
    default: ""
  reason:
    description: "Why this assignment happened. Quoted in the comment."
    required: true
  guard:
    description: >
      Extra precondition to check before assigning.
      "closed_without_pr" — only chain when completed_issue is a run that closed its
      own issue without a deliverable PR, because its deliverable was an answer, a
      command or a set of filed issues rather than a diff. Requires the issue to have
      carried `in-progress`, so a human closing a backlog issue starts nothing. Same
      cascade brake.
      "after_blocked_run" — only chain when completed_issue is a run that ended `blocked`,
      and only while the cascade brake is open.
      "after_paused_run" — only chain when completed_issue is a run that ended `paused`:
      it stopped on a dependency it filed, put itself back in the queue behind that
      dependency, and the queue still has to move past it. Same cascade brake.
      "none" — no extra precondition. Single-flight is enforced either way.
    required: false
    default: "none"
  completed_issue:
    description: "Issue just finished. Excluded from the stall check and read by the guards."
    required: false
    default: ""
  blocked_chain_limit:
    description: >
      Consecutive runs that may halt without merging — `blocked` or `paused` —
      since the last merged pipeline PR before the chain guards stop chaining.
      From AGENTIC_BLOCKED_CHAIN_LIMIT; a non-positive or unparseable value falls
      back to 3 rather than disabling the brake.
    required: false
    default: ""

outputs:
  issue:
    description: "Issue number that was assigned, empty when nothing was assigned."
    value: ${{ steps.assign.outputs.issue }}
  mention:
    description: "Resolved agent mention (@claude or @opencode)."
    value: ${{ steps.assign.outputs.mention }}
  halted:
    description: >
      "true" when the cascade brake stopped the chain — consecutive runs are
      failing and the queue is deliberately parked until a human looks.
    value: ${{ steps.assign.outputs.halted }}

runs:
  using: composite
  steps:
    - id: assign
      uses: actions/github-script@v7
      env:
        AGENTIC_AGENT: ${{ inputs.agent }}
        ASSIGN_REASON: ${{ inputs.reason }}
        ASSIGN_GUARD: ${{ inputs.guard }}
        COMPLETED_ISSUE: ${{ inputs.completed_issue }}
        BLOCKED_CHAIN_LIMIT: ${{ inputs.blocked_chain_limit }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;

          // Required from the workspace, not vendored into this YAML: the rules
          // decide whether an unattended run starts on a task it cannot finish,
          // and rules that only exist inside a workflow file cannot be tested.
          const rules = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/assignability.cjs`);
          const { createIssueApi } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/issue-api.cjs`);

          const log = (message) => core.info(message);
          const api = createIssueApi(github, { owner, repo, log });

          core.setOutput('issue', '');
          core.setOutput('halted', 'false');

          // --- Resolve which agent answers the assignment comment ---
          const mention = rules.resolveMention(process.env.AGENTIC_AGENT);
          if (!mention) {
            core.setFailed(
              `AGENTIC_AGENT is "${process.env.AGENTIC_AGENT}" — expected "@claude" or "@opencode".`
            );
            return;
          }
          core.setOutput('mention', mention);
          core.info(`Configured autonomous agent: ${mention}`);

          const guard = process.env.ASSIGN_GUARD || 'none';
          const reason = process.env.ASSIGN_REASON || 'pipeline assignment';
          const completed = process.env.COMPLETED_ISSUE
            ? parseInt(process.env.COMPLETED_ISSUE, 10)
            : null;

          // --- Guard: only chain when the finished issue produced no PR ---
          if (guard === 'closed_without_pr') {
            if (!completed) {
              core.info('No completed issue supplied — nothing to chain from.');
              return;
            }
            const finished = await api.getIssue(completed);
            if (!finished) {
              core.setFailed(`Issue #${completed} could not be read — not chaining on an unknown state.`);
              return;
            }
            if (finished.state !== 'closed') {
              core.info(`Issue #${completed} still open — a PR is expected to carry the chain.`);
              return;
            }
            // Deliverable PRs only — a prose mention must not read as the
            // deliverable and kill the chain (#568). Unknown fails closed.
            const finishedPrs = await api.deliverableFor(completed);
            if (finishedPrs.unknown) {
              core.setFailed(`Issue #${completed}'s pull requests could not be read — not chaining on an unknown state.`);
              return;
            }
            const carrier = finishedPrs.pipeline ?? finishedPrs.closers[0];
            if (carrier) {
              core.info(`Issue #${completed} has pull request #${carrier.number} — the merge event carries the chain.`);
              return;
            }

            // A human closing a stale backlog issue is tidying up, not ending a
            // run, and `issues: closed` fires for every one of them. Only an
            // issue a run actually held releases the next session — the same
            // test both halt guards apply. Without it, closing any old issue
            // starts a session nobody asked for, which is how filing #489 once
            // woke a runner through a different path.
            if (!(await api.everCarriedInProgress(completed))) {
              core.info(
                `Issue #${completed} never carried \`in-progress\`, so no run ended here. Not chaining.`
              );
              return;
            }

            // The run is over, so `in-progress` cannot still be true. A run that
            // settles its own issue drops it, but one that was closed from
            // outside may not have — and left on a closed issue it is invisible
            // to single flight, which lists open issues only, while still
            // reading as a live run to anything that looks the issue up directly.
            if (finished.labels.includes(rules.IN_PROGRESS)) {
              await github.rest.issues
                .removeLabel({ owner, repo, issue_number: completed, name: rules.IN_PROGRESS })
                .catch(() => {});
              core.info(`Issue #${completed}: dropped \`in-progress\`, the run that held it closed it.`);
            }

            core.info(`Issue #${completed} closed without a PR — chaining directly.`);
          }

          // --- Guard: chain past a run that halted without merging ---
          // `blocked` and `paused` are both terminal outcomes like a merge is,
          // and the queue has to keep moving through either: nothing else starts
          // the next session, and a fully autonomous pipeline cannot wait for
          // somebody to notice. They differ only in who acts next — `blocked`
          // waits on a human, `paused` waits on an issue the pipeline will work
          // itself — and neither difference changes what happens to the queue.
          // What it must not do is keep chaining while every run halts.
          const HALT_GUARDS = {
            after_blocked_run: { label: rules.BLOCKED, noun: 'blocked' },
            after_paused_run: { label: rules.PAUSED, noun: 'paused' },
          };
          if (HALT_GUARDS[guard]) {
            const { label, noun } = HALT_GUARDS[guard];

            if (!completed) {
              core.info(`No ${noun} issue supplied — nothing to chain from.`);
              return;
            }

            const halted = await api.getIssue(completed);
            if (!halted) {
              core.setFailed(`Issue #${completed} could not be read — not chaining on an unknown state.`);
              return;
            }
            if (!halted.labels.includes(label)) {
              core.info(`Issue #${completed} no longer carries \`${label}\` — nothing to chain from.`);
              return;
            }

            // A human labelling a backlog issue `blocked` is filing a note, not
            // ending a run. Only an issue that was actually assigned — one that
            // carried `in-progress` at some point — releases the next session.
            if (!(await api.everCarriedInProgress(completed))) {
              core.info(
                `Issue #${completed} never carried \`in-progress\`, so no run ended here. Not chaining.`
              );
              return;
            }

            // The run is over, so `in-progress` cannot still be true. Left on, it
            // would defer this assignment against a session that no longer exists
            // and hold the queue until the watchdog.
            if (halted.labels.includes(rules.IN_PROGRESS)) {
              await github.rest.issues
                .removeLabel({ owner, repo, issue_number: completed, name: rules.IN_PROGRESS })
                .catch(() => {});
              core.info(`Issue #${completed}: dropped \`in-progress\`, the run that held it ended ${noun}.`);
            }
          }

          // --- Cascade brake ---
          // Every chain that fires from a finished run passes here, not just the
          // two that fire from a halting one. A `done` close is a success, but
          // it is not a *merge*: it resets nothing, so a queue deliberately
          // parked because run after run is halting must not be restarted by the
          // one issue that happened to close cleanly. The merge path is the only
          // caller that skips the brake, and it skips it because a merge zeroes
          // the count by definition.
          if (guard !== 'none') {
            const limit = rules.blockedChainLimit(process.env.BLOCKED_CHAIN_LIMIT);
            const failures = await rules.consecutiveHaltedRuns(api);
            if (failures >= limit) {
              core.setOutput('halted', 'true');
              core.warning(
                `${failures} runs have halted without merging since the last pipeline merge (limit ${limit}). ` +
                'Not chaining — this is a systemic failure, not a task-specific one.'
              );
              await announceHalt(failures, limit);
              return;
            }
            core.info(
              `${failures} halted run(s) since the last pipeline merge, under the limit of ${limit}. Chaining.`
            );
          }

          // --- Pick the next assignable issue ---
          const { issue, reason: why, unreadable } = await rules.selectNextAssignable(api, {
            log,
            completedIssue: completed,
          });

          if (!issue) {
            // An unread queue is not an empty queue. On 17 Aug 2026 the GraphQL
            // read behind `deliverableFor` answered 503 for every candidate;
            // all three dispatches that day ended green on "Nothing assigned",
            // and #554 was never assigned to anyone who could see why.
            if (unreadable && unreadable.length > 0) {
              core.setFailed(
                `Nothing assigned, and ${unreadable.length} ready issue(s) could not be assessed: ` +
                unreadable.map((skip) => `#${skip.number} — ${skip.reason}`).join('; ') +
                '. This is a failed read, not an empty queue: nothing here says the queue is idle.'
              );
              return;
            }
            core.info(`Nothing assigned — ${why}.`);
            return;
          }

          const n = issue.number;
          await github.rest.issues.removeLabel({
            owner, repo, issue_number: n, name: rules.READY
          }).catch(() => {});
          // `paused` said "a run stopped here and put the issue back in the
          // queue". It has just been picked up, so the statement is no longer
          // true — and left on, it would be counted a second time by the cascade
          // brake and chained from a second time by handle-failure.yml.
          await github.rest.issues.removeLabel({
            owner, repo, issue_number: n, name: rules.PAUSED
          }).catch(() => {});
          await github.rest.issues.addLabels({
            owner, repo, issue_number: n, labels: [rules.IN_PROGRESS]
          });

          // Cached from `assessCandidate`, which already read it to decide the
          // issue was assignable at all. A paused pull request means a previous
          // run left finished work on a branch, and this assignment has to send
          // the new run to that branch — the default instructions below would
          // have it build a fresh one from `main` and silently abandon the work.
          const resume = rules.resumeTargetFor(await api.deliverableFor(n));
          if (resume) {
            core.info(
              `#${n} resumes from pull request #${resume.number}` +
              (resume.head ? ` on \`${resume.head}\`` : '') + '.'
            );
          }

          const resumeBlock = resume
            ? [
                '',
                `**▶ THIS RUN RESUMES PULL REQUEST #${resume.number} — DO NOT START OVER.**`,
                '',
                `A previous run on this issue stopped on a dependency, saved what it had finished, and left it on ${resume.head ? `\`${resume.head}\`` : `pull request #${resume.number}'s head branch`}. That dependency has since landed, which is why this issue is assignable again.`,
                '',
                `1. Read pull request #${resume.number} first — its body states what is already done and what remains. Read the issue thread too, but the pull request is the authority on where the work stopped.`,
                `2. Check out that pull request's head branch and continue on it. Create no \`pipeline/tests-*\`, \`pipeline/impl-*\` or \`pipeline/feature-*\` branch for this issue: the branch already exists, its commits are the work, and building a new one from \`main\` throws that work away.`,
                `3. Finish only what the pull request says remains, plus whatever the landed dependency now makes possible. Re-verify every channel at the end — the earlier run's results were recorded against an older \`main\`.`,
                `4. When it is done, push to that same branch, mark pull request #${resume.number} ready for review, remove its \`paused\` label, and add \`READY TO MERGE\` on a line of its own as a new comment **and** in the body. Do not open a second pull request.`,
                '',
                'If the remaining work turns out to be unrelated to what that branch holds, say so on the pull request and continue on the branch anyway — a second pull request against one issue makes the issue unassignable to everyone.',
              ]
            : [];

          // The comment IS the trigger. It must carry the whole assignment:
          // which agent answers, what to build, and how the pipeline runs it.
          // Identical for every agent apart from the mention on the first line.
          const body = [
            `${mention} — autonomous pipeline assignment for issue #${n} (${reason}).`,
            '',
            `**Task:** resolve issue #${n} end to end and open the pull request that closes it.`,
            ...resumeBlock,
            '',
            '**▶ FIRST ACTION — hand this task to the `orchestrator` agent.**',
            'Classification, planning, TDD, code review and PR creation are the orchestrator\'s job,',
            'delegated to specialist sub-agents. Do not implement anything in this session directly,',
            'and do not explore the codebase before the orchestrator has classified the task.',
            '',
            'The orchestrator then follows its own procedure:',
            '',
            `1. Classify the task and load the matching \`agentic-pipeline-*\` skill. The system itself is described in the \`agentic-autonomous-pipeline\` skill.`,
            `2. Run the TDD cycle with branch isolation on \`pipeline/tests-${n}\` and \`pipeline/impl-${n}\` — the implementer never sees the tests.`,
            `3. Cherry-pick the implementation onto \`pipeline/feature-${n}\`, then run code review, refactor and validation there.`,
            '4. Run every verification channel the change touches. A renderer or UI change is not done until screenshots have been inspected; a player-facing flow is not done until an interaction-mode scenario proves a player can reach the goal by clicking.',
            `5. Open the PR from \`pipeline/feature-${n}\` to \`main\`. Its body must contain \`Closes #${n}\`, plus \`READY TO MERGE\` on a line of its own. Open it as a draft without that line only when a channel stayed red, or when nothing will ever report on it — name the channel. A channel CI owns, like interaction-mode scenarios behind the \`full-ci\` label, is covered by the marker rather than blocked by it: the marked PR waits on those jobs and merges on their result. **Never leave the PR non-draft and unmarked** — nothing in the pipeline comes back to add the marker, and the issue holds \`in-progress\` until a human notices. How many review findings, visual iterations or retries the run took does not decide PR status.`,
            '',
            'Do not use `[skip ci]` on pipeline branches — it suppresses the auto-merge workflow.',
            '',
            `Where this issue leaves a requirement open, choose the default the spec and surrounding code already imply, record it in the PR body under \`## Decisions taken\`, and finish the run — see the \`agentic-decision-autonomy\` skill for the rule, for what to fix on the fly rather than file, and for the blockers that genuinely stop a run.`,
            '',
            `Something you find that is in the way of this task is not automatically a halt: fix it on the spot when it is small, and when it is not, file it and work around it behind a \`TODO(#<new issue>)\` bypass so this run still lands. Only a finding that makes the task impossible ends the run early — and then it \`pause\`s rather than blocks. Both procedures are in \`agentic-decision-autonomy\`.`,
            '',
            `This issue now carries \`in-progress\`, and the queue reads that label as a live run. End the run with it in a terminal state, and there are four:`,
            '',
            `- a merged-ready PR that closes it;`,
            `- \`paused\` — a dependency you filed is in the way, so the issue goes back to \`ready\` with that issue as its \`Blocked by\` and the \`paused\` label on top, and any partial work is saved on a draft PR labelled \`paused\`. The queue re-picks it on its own once the dependency lands;`,
            `- \`blocked\` — a human has to answer something before the work can proceed at all. Comment what is missing;`,
            `- or — when the deliverable is an answer or a command rather than a diff — issue #${n} closed and labelled \`done\`.`,
            '',
            `An issue left holding \`in-progress\` defers every later assignment until the watchdog sweeps it.`
          ].join('\n');

          await github.rest.issues.createComment({ owner, repo, issue_number: n, body });

          core.setOutput('issue', String(n));
          core.info(`Assigned issue #${n} to ${mention}.`);

          // --- Cascade brake report ---
          // Posted on the issue the chain stopped at, because a warning in a job
          // log is not somewhere anyone is watching, and this is the one state
          // the autonomous loop cannot leave on its own. Once per halt: a second
          // notice on every subsequent failure would bury the first.
          async function announceHalt(failures, limit) {
            const marker = '<!-- agentic-cascade-brake -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: completed, per_page: 100
            });
            if (comments.some((comment) => (comment.body || '').includes(marker))) {
              core.info('Cascade-brake notice already posted on this issue.');
              return;
            }
            await github.rest.issues.createComment({
              owner, repo, issue_number: completed,
              body: [
                marker,
                '🛑 **Pipeline halted — the failures are not task-specific.**',
                '',
                `${failures} runs have ended \`blocked\` or \`paused\` since the pipeline last merged one of its own pull requests, which is at or over the limit of ${limit} (\`AGENTIC_BLOCKED_CHAIN_LIMIT\`).`,
                '',
                'A run that halts normally chains straight to the next issue, so the queue keeps moving without anyone watching. Several in a row is a different signal: an expired token, a broken `main`, a runner image that no longer builds. Chaining on would march through the rest of the backlog halting every issue in minutes.',
                '',
                'The queue is parked until a human looks. Nothing is lost — every issue involved keeps its labels and its branches.',
                '',
                '**To resume:** fix what the recent runs have in common, then dispatch **Pipeline: run the configured agent on the next ready issue**. Merging any pipeline PR also resets the count on its own.'
              ].join('\n')
            });
            core.info(`Posted the cascade-brake notice on #${completed}.`);
          }
