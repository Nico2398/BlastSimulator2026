name: "Assign next agent task"
description: >
  Picks the next unblocked ready issue, flips its labels, and posts the standard
  pipeline assignment comment addressed to the configured autonomous agent. The
  comment is the trigger: mentioning @claude or @opencode starts that runtime's
  runner workflow. Comment text is identical for both agents apart from the
  mention itself.

inputs:
  token:
    description: >
      Token used to post the assignment comment. Must be a PAT — a comment
      posted with GITHUB_TOKEN never triggers the runner workflows.
    required: true
  agent:
    description: >
      Configured autonomous agent, from the AGENTIC_AGENT repository variable.
      Accepts "@claude", "claude", "@opencode", "opencode". Empty means @opencode.
    required: false
    default: ""
  reason:
    description: "Why this assignment happened. Quoted in the comment."
    required: true
  guard:
    description: >
      Extra precondition to check before assigning.
      "closed_without_pr" — only chain when completed_issue closed without a linked PR.
      "none" — no extra precondition. Single-flight is enforced either way.
    required: false
    default: "none"
  completed_issue:
    description: "Issue just finished. Excluded from the stall check and read by the closed_without_pr guard."
    required: false
    default: ""

outputs:
  issue:
    description: "Issue number that was assigned, empty when nothing was assigned."
    value: ${{ steps.assign.outputs.issue }}
  mention:
    description: "Resolved agent mention (@claude or @opencode)."
    value: ${{ steps.assign.outputs.mention }}

runs:
  using: composite
  steps:
    - id: assign
      uses: actions/github-script@v7
      env:
        AGENTIC_AGENT: ${{ inputs.agent }}
        ASSIGN_REASON: ${{ inputs.reason }}
        ASSIGN_GUARD: ${{ inputs.guard }}
        COMPLETED_ISSUE: ${{ inputs.completed_issue }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;

          // --- Resolve which agent answers the assignment comment ---
          const raw = (process.env.AGENTIC_AGENT || '').trim().replace(/^@/, '').toLowerCase();
          const handles = { '': '@opencode', opencode: '@opencode', claude: '@claude' };
          const mention = handles[raw];
          if (!mention) {
            core.setFailed(
              `AGENTIC_AGENT is "${process.env.AGENTIC_AGENT}" — expected "@claude" or "@opencode".`
            );
            return;
          }
          core.setOutput('mention', mention);
          core.setOutput('issue', '');
          core.info(`Configured autonomous agent: ${mention}`);

          const guard = process.env.ASSIGN_GUARD || 'none';
          const reason = process.env.ASSIGN_REASON || 'pipeline assignment';
          const completed = process.env.COMPLETED_ISSUE
            ? parseInt(process.env.COMPLETED_ISSUE, 10)
            : null;

          // Issue numbers an issue declares itself blocked by. Two spellings
          // reach here and both are canonical somewhere: the `Blocked by`
          // section `agentic-issue-creation` and the issue form produce, and
          // the inline `Depends on: #N` older issues carry. Matching only the
          // second one used to let a correctly written issue run ahead of the
          // dependency it named, which fails the run rather than deferring it.
          const dependenciesOf = (body) => {
            const deps = new Set();
            let inSection = false;
            for (const line of (body || '').split('\n')) {
              if (/^\s*(?:#{1,6}\s*|\*\*)?(?:blocked\s+by|depends?\s+on|dependencies)\b/i.test(line)) {
                inSection = true;
              } else if (inSection && /^\s*(?:#{1,6}\s+\S|\*\*\S)/.test(line)) {
                inSection = false;   // the next section starts; the list is over
                continue;
              } else if (!inSection) {
                continue;
              }
              for (const ref of line.matchAll(/#(\d+)/g)) {
                deps.add(parseInt(ref[1], 10));
              }
            }
            return [...deps];
          };

          const hasLinkedPr = async (number) => {
            const { data: events } = await github.rest.issues.listEventsForTimeline({
              owner, repo, issue_number: number, per_page: 100
            });
            return events.some((e) => e.event === 'cross-referenced' && e.source?.issue?.pull_request);
          };

          // --- Guard: only chain when the finished issue produced no PR ---
          if (guard === 'closed_without_pr') {
            if (!completed) {
              core.info('No completed issue supplied — nothing to chain from.');
              return;
            }
            const { data: finished } = await github.rest.issues.get({
              owner, repo, issue_number: completed
            });
            if (finished.state !== 'closed') {
              core.info(`Issue #${completed} still open — a PR is expected to carry the chain.`);
              return;
            }
            if (await hasLinkedPr(completed)) {
              core.info(`Issue #${completed} has a linked PR — the merge event carries the chain.`);
              return;
            }
            core.info(`Issue #${completed} closed without a PR — chaining directly.`);
          }

          const { data: inProgress } = await github.rest.issues.listForRepo({
            owner, repo, labels: 'in-progress', state: 'open', per_page: 20
          });

          // --- Single flight: never let two agent sessions run at once ---
          // An issue keeps `in-progress` until its PR merges, so any other one
          // still carrying that label means a run is live. Assigning now would
          // put a second session on the same working tree of branches.
          //
          // Defer either way, and never diagnose. From the labels alone a run
          // forty seconds old is indistinguishable from one that died hours
          // ago; only `agentic-watchdog.yml` ages it against
          // AGENTIC_STALL_MINUTES, so declaring a run lost is its job alone.
          // This step used to comment "Pipeline halted — no linked PR was
          // created" on sight, and posted it on #404 one minute into a
          // two-hour session that was still running.
          for (const busy of inProgress) {
            if (busy.number === completed) continue;

            if (await hasLinkedPr(busy.number)) {
              core.info(
                `Issue #${busy.number} is in progress with a linked PR — deferring. ` +
                'Merging that PR re-enters this step.'
              );
            } else {
              core.info(
                `Issue #${busy.number} is in progress with no linked PR yet — deferring. ` +
                'The watchdog labels it `blocked` if the run turns out to be lost.'
              );
            }
            return;
          }

          // --- Pick the next assignable issue ---
          const { data: ready } = await github.rest.issues.listForRepo({
            owner, repo, labels: 'ready', state: 'open', sort: 'created', direction: 'asc', per_page: 30
          });
          ready.sort((a, b) => a.number - b.number);

          for (const issue of ready) {
            if (issue.pull_request) continue;
            if (issue.labels.some((l) => (typeof l === 'string' ? l : l.name) === 'blocked')) {
              core.info(`#${issue.number}: labelled blocked, skipping.`);
              continue;
            }

            let blocked = false;
            for (const depNumber of dependenciesOf(issue.body)) {
              if (depNumber === issue.number) continue;
              const dep = await github.rest.issues.get({
                owner, repo, issue_number: depNumber
              }).catch(() => null);
              if (!dep) {
                core.warning(`#${issue.number}: dependency #${depNumber} does not exist, ignoring it.`);
                continue;
              }
              if (dep.data.state !== 'closed') {
                core.info(`#${issue.number}: dependency #${depNumber} not closed, skipping.`);
                blocked = true;
                break;
              }
            }
            if (blocked) continue;

            const n = issue.number;
            await github.rest.issues.removeLabel({
              owner, repo, issue_number: n, name: 'ready'
            }).catch(() => {});
            await github.rest.issues.addLabels({
              owner, repo, issue_number: n, labels: ['in-progress']
            });

            // The comment IS the trigger. It must carry the whole assignment:
            // which agent answers, what to build, and how the pipeline runs it.
            // Identical for every agent apart from the mention on the first line.
            const body = [
              `${mention} — autonomous pipeline assignment for issue #${n} (${reason}).`,
              '',
              `**Task:** resolve issue #${n} end to end and open the pull request that closes it.`,
              '',
              '**▶ FIRST ACTION — hand this task to the `orchestrator` agent.**',
              'Classification, planning, TDD, code review and PR creation are the orchestrator\'s job,',
              'delegated to specialist sub-agents. Do not implement anything in this session directly,',
              'and do not explore the codebase before the orchestrator has classified the task.',
              '',
              'The orchestrator then follows its own procedure:',
              '',
              `1. Classify the task and load the matching \`agentic-pipeline-*\` skill. The system itself is described in the \`agentic-autonomous-pipeline\` skill.`,
              `2. Run the TDD cycle with branch isolation on \`pipeline/tests-${n}\` and \`pipeline/impl-${n}\` — the implementer never sees the tests.`,
              `3. Cherry-pick the implementation onto \`pipeline/feature-${n}\`, then run code review, refactor and validation there.`,
              '4. Run every verification channel the change touches. A renderer or UI change is not done until screenshots have been inspected; a player-facing flow is not done until `npm run playtest` passes.',
              `5. Open the PR from \`pipeline/feature-${n}\` to \`main\`. Its body must contain \`Closes #${n}\`, plus \`READY TO MERGE\` on a line of its own once every verification channel the change owes reports PASS. Open it as a draft without that line only when a channel could not run or stayed red — name the channel. How many review findings, visual iterations or retries the run took does not decide PR status.`,
              '',
              'Do not use `[skip ci]` on pipeline branches — it suppresses the auto-merge workflow.',
              '',
              `Where this issue leaves a requirement open, choose the default the spec and surrounding code already imply, record it in the PR body under \`## Decisions taken\`, and finish the run — see the \`agentic-decision-autonomy\` skill for the rule and for the five blockers that genuinely stop a run. On one of those, label this issue \`blocked\`, comment what is missing, and stop.`,
              '',
              `This issue now carries \`in-progress\`, and the queue reads that label as a live run. End the run with it in a terminal state: a merged-ready PR that closes it, \`blocked\` naming what is missing, or — when the deliverable is an answer or a command rather than a diff — issue #${n} closed and labelled \`done\`. An issue left holding \`in-progress\` defers every later assignment until the watchdog sweeps it.`
            ].join('\n');

            await github.rest.issues.createComment({ owner, repo, issue_number: n, body });

            core.setOutput('issue', String(n));
            core.info(`Assigned issue #${n} to ${mention}.`);
            return;
          }

          core.info('No assignable ready issues. Pipeline idle.');
