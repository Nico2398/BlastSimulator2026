name: "Autonomous run state"
description: >
  Answers one question after an agent session ends: did this run leave its issue
  in a terminal state? A run is terminal when it produced a pull request, said it
  was blocked, paused itself behind a dependency it filed, or closed the issue.
  Anything else means the session stopped with the work unfinished and nobody
  told — the failure mode that cost issue #404 three hours and killed issue #406
  fifty-eight seconds in.

  It also reports whether a retry is worth attempting inside the remaining job
  budget, and what the previous attempt left on the runner's disk, so the retry
  prompt can tell the next session where to pick up.

inputs:
  token:
    description: "Token used to read the issue, its labels and its linked PRs. GITHUB_TOKEN is enough."
    required: true
  issue:
    description: "Issue number the run was working on. Empty makes every output inert."
    required: true
  started_at:
    description: >
      Unix epoch seconds recorded when the job started, used with `budget_minutes`
      to decide whether a retry can still finish. Empty skips the clock check and
      only reports whether the run was terminal.
    required: false
    default: ""
  budget_minutes:
    description: "The job's `timeout-minutes`. Retrying past this is pointless — the job is cancelled mid-attempt."
    required: false
    default: "360"
  min_remaining_minutes:
    description: >
      A retry needs enough clock to reach a PR. Below this, report the run as lost
      rather than starting an attempt that the job timeout will cut off — which is
      how issue #404 lost everything it had done.
    required: false
    default: "75"

outputs:
  terminal:
    description: "'true' when the issue is in a terminal state and needs no further attempt."
    value: ${{ steps.state.outputs.terminal }}
  reason:
    description: "One line explaining the verdict, suitable for a job log or an issue comment."
    value: ${{ steps.state.outputs.reason }}
  retry:
    description: "'true' when the run is not terminal and the remaining job budget can still carry an attempt."
    value: ${{ steps.state.outputs.retry }}
  branch_state:
    description: "What the previous attempt left behind: local `pipeline/*-<N>` branches and their commit counts against main."
    value: ${{ steps.branches.outputs.branch_state }}

runs:
  using: composite
  steps:
    # Read from disk, not from the remote. The whole point of the retry is that
    # the previous attempt's branches never reached the remote, so `git branch -r`
    # would report nothing while the work sits in the working copy.
    - name: Describe what the previous attempt left on disk
      id: branches
      shell: bash
      env:
        ISSUE: ${{ inputs.issue }}
      run: |
        set -euo pipefail

        {
          echo "branch_state<<AGENTIC_BRANCH_STATE_EOF"
          if [ -z "${ISSUE}" ]; then
            echo "(no issue number — nothing to describe)"
          else
            # Two patterns, not one: a work branch is `pipeline/<role>-<issue>` or
            # `pipeline/<role>-<issue>-<runid>` (agentic-prompt's naming, family
            # regex `pipeline/feature-${issueNumber}(?:-[A-Za-z0-9._-]+)?$` a few
            # lines below in `deliverablePr`). The single `*-${ISSUE}` glob this
            # used to be only matched the bare form, so a real branch this run
            # built and left on disk — always run-id-suffixed in practice — read
            # as "none: ... so the work starts from main" on the retry prompt,
            # sending the next attempt to rebuild work that already existed.
            found=0
            for branch in $(git for-each-ref --format='%(refname:short)' \
              "refs/heads/pipeline/*-${ISSUE}" "refs/heads/pipeline/*-${ISSUE}-*" | sort -u); do
              found=1
              ahead=$(git rev-list --count "main..${branch}" 2>/dev/null || echo '?')
              echo "- ${branch}: ${ahead} commit(s) beyond main"
            done
            if [ "${found}" = "0" ]; then
              echo "- none: no pipeline/*-${ISSUE}(-*) branch exists on this runner, so the work starts from main"
            fi
          fi
          echo "AGENTIC_BRANCH_STATE_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Decide whether the run is terminal
      id: state
      uses: actions/github-script@v7
      env:
        ISSUE: ${{ inputs.issue }}
        STARTED_AT: ${{ inputs.started_at }}
        BUDGET_MINUTES: ${{ inputs.budget_minutes }}
        MIN_REMAINING_MINUTES: ${{ inputs.min_remaining_minutes }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const number = parseInt(process.env.ISSUE || '', 10);

          const settle = (terminal, retry, reason) => {
            core.setOutput('terminal', terminal ? 'true' : 'false');
            core.setOutput('retry', retry ? 'true' : 'false');
            core.setOutput('reason', reason);
            core.info(reason);
          };

          // A run triggered from a PR review comment carries no issue. There is
          // no lifecycle label to leave in a terminal state, so there is nothing
          // here to judge and nothing to retry.
          if (!Number.isInteger(number)) {
            settle(true, false, 'No issue number — this run has no lifecycle state to settle.');
            return;
          }

          const { data: issue } = await github.rest.issues.get({
            owner, repo, issue_number: number
          });
          const labels = new Set(
            (issue.labels || []).map((l) => (typeof l === 'string' ? l : l.name))
          );

          if (issue.state === 'closed') {
            settle(true, false, `Issue #${number} is closed — the run settled it.`);
            return;
          }
          if (labels.has('blocked')) {
            settle(true, false, `Issue #${number} is labelled \`blocked\` — the run stated what is missing.`);
            return;
          }
          // A paused run is terminal for the same reason a blocked one is: the
          // session decided, said so, and left the issue in a state the queue
          // acts on by itself. Retrying it would be worse than pointless — the
          // retry would rediscover the same dependency, and on the way there it
          // would rebuild from `main` the branch the pause deliberately saved.
          if (labels.has('paused')) {
            settle(
              true, false,
              `Issue #${number} is labelled \`paused\` — the run filed the dependency in its way and requeued itself behind it.`
            );
            return;
          }

          // A linked PR is the deliverable. Its own CI and review carry it from
          // here, however long that takes, so the run is done either way. But
          // "linked" must mean a PR from this run's own branch, or one GitHub
          // records as closing the issue — never a timeline cross-reference.
          // Any PR that merely writes "#N" anywhere in its body raises one of
          // those: docs PR #561's passing mention of #547 read as run #133's
          // deliverable and disarmed its retry with five hours of budget left.
          // The same predicate is inlined in agentic-watchdog.yml and
          // agentic-assign — no shared file, because the watchdog runs without
          // a checkout to read one from. The verdict names the PR it matched,
          // so a false positive is visible in the job log instead of silent.
          const deliverablePr = async (issueNumber) => {
            // A work branch is `pipeline/<role>-<issue>-<runId>`: unique per run, so
            // no run can collide with the branch an earlier one abandoned (#554,
            // run 166, lost six hours to exactly that). `head` takes one exact ref,
            // so the family is enumerated first; the bare name is always asked too,
            // for the pull requests that predate the convention and for a merged
            // one whose branch has since been deleted.
            const family = new RegExp(`^pipeline/feature-${issueNumber}(?:-[A-Za-z0-9._-]+)?$`);
            const refs = await github.rest.git
              .listMatchingRefs({ owner, repo, ref: `heads/pipeline/feature-${issueNumber}` })
              .then(({ data }) => data.map((entry) => entry.ref.replace('refs/heads/', '')))
              .catch(() => []);
            const heads = [`pipeline/feature-${issueNumber}`, ...refs.filter((ref) => family.test(ref))];
            const headPrs = [];
            for (const head of new Set(heads)) {
              const { data } = await github.rest.pulls.list({
                owner, repo, state: 'all', head: `${owner}:${head}`, per_page: 20
              });
              headPrs.push(...data);
            }
            const fromPipeline =
              headPrs.find((pr) => pr.state === 'open') || headPrs.find((pr) => pr.merged_at);
            if (fromPipeline) {
              return {
                number: fromPipeline.number,
                how: `from ${fromPipeline.head?.ref || `pipeline/feature-${issueNumber}`}, ${fromPipeline.merged_at ? 'merged' : 'open'}`
              };
            }
            // Closing references cover the manual-completion path: a human PR
            // from any branch whose body says `Closes #N`. `includeClosedPrs:
            // false` keeps open and merged PRs and drops closed-unmerged ones,
            // matching agentic-rescue's `state != "CLOSED"` reading.
            const linked = await github.graphql(
              `query($owner: String!, $repo: String!, $number: Int!) {
                 repository(owner: $owner, name: $repo) {
                   issue(number: $number) {
                     closedByPullRequestsReferences(first: 10, includeClosedPrs: false) {
                       nodes { number merged }
                     }
                   }
                 }
               }`,
              { owner, repo, number: issueNumber }
            );
            const closer = linked?.repository?.issue?.closedByPullRequestsReferences?.nodes?.[0];
            if (closer) {
              return { number: closer.number, how: `closing reference, ${closer.merged ? 'merged' : 'open'}` };
            }
            return null;
          };

          const pr = await deliverablePr(number);
          if (pr) {
            settle(true, false, `Issue #${number} has pull request #${pr.number} (${pr.how}) — the run produced its deliverable.`);
            return;
          }

          // Not terminal. Whether that is worth another attempt is a question
          // about the clock: an attempt that the job timeout cuts off mid-work
          // is strictly worse than reporting the run lost, because a cancelled
          // job takes its unpushed branches with it.
          const startedAt = parseInt(process.env.STARTED_AT || '', 10);
          const budget = parseInt(process.env.BUDGET_MINUTES || '', 10) || 360;
          const floor = parseInt(process.env.MIN_REMAINING_MINUTES || '', 10) || 75;

          if (!Number.isInteger(startedAt)) {
            settle(
              false, false,
              `Issue #${number} has no PR, no \`blocked\` or \`paused\` label and is still open — the run did not settle it. ` +
              'No start time was supplied, so no retry is scheduled.'
            );
            return;
          }

          const elapsed = Math.round((Date.now() / 1000 - startedAt) / 60);
          const remaining = budget - elapsed;
          const worthRetrying = remaining >= floor;

          settle(
            false, worthRetrying,
            `Issue #${number} has no PR, no \`blocked\` or \`paused\` label and is still open — the run did not settle it. ` +
            `${elapsed}m of the ${budget}m budget spent, ${remaining}m left; ` +
            (worthRetrying
              ? `at least ${floor}m is needed for an attempt, so one more will run.`
              : `an attempt needs ${floor}m, so this run is reported lost instead of being cut off mid-work.`)
          );
