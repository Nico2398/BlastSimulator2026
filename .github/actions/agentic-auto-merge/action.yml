name: 'Agentic auto-merge'
description: 'Enables auto-merge on every open PR carrying the READY TO MERGE marker, whatever account authored it.'

inputs:
  token:
    description: 'PAT with contents, pull-requests and actions write. GITHUB_TOKEN cannot approve gated runs.'
    required: true
  pr:
    description: 'Restrict to a single PR number. Empty means use `head`, or every open PR.'
    required: false
    default: ''
  head:
    description: 'Restrict to the open PR opened from this head branch, e.g. pipeline/feature-404.'
    required: false
    default: ''
  merge_method:
    description: 'merge, squash or rebase.'
    required: false
    default: 'squash'
  settle_seconds:
    description: >-
      How long to wait for a PR to settle when GitHub refuses native auto-merge
      and the merge has to happen here. Only the fallback path spends it.
    required: false
    default: '600'

outputs:
  enabled:
    description: 'Space-separated PR numbers that now have auto-merge enabled or were merged outright.'
    value: ${{ steps.sweep.outputs.enabled }}
  unarmed:
    description: 'Space-separated PR numbers that carried the marker and are still neither armed nor merged.'
    value: ${{ steps.sweep.outputs.unarmed }}
  pending:
    description: >-
      Space-separated PR numbers that carry the marker and are still waiting on
      checks. Not a failure: the CI-completion sweep re-evaluates each of them.
    value: ${{ steps.sweep.outputs.pending }}
  approved:
    description: 'Number of gated workflow runs released across the swept PRs.'
    value: ${{ steps.sweep.outputs.approved }}

runs:
  using: composite
  steps:
    - name: Enable auto-merge on every marked PR
      id: sweep
      uses: actions/github-script@v7
      env:
        ONLY_PR: ${{ inputs.pr }}
        ONLY_HEAD: ${{ inputs.head }}
        MERGE_METHOD: ${{ inputs.merge_method }}
        SETTLE_SECONDS: ${{ inputs.settle_seconds }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;

          // The marker decides, never the account. A pipeline PR is opened by
          // whichever identity the runner's token resolved to that day —
          // `github-actions[bot]` when the agent step overrides the PAT it was
          // handed, a real user when it does not — and the loop must not depend
          // on which. `READY TO MERGE` on a line of its own is the pipeline's
          // own ship signal, written by the orchestrator and by nothing else,
          // so it identifies an autonomous run's deliverable without asking who
          // pressed the button. Trailing whitespace is tolerated because the
          // line survives a round trip through the GitHub API and through
          // `gh pr edit`, both of which can add it.
          const carriesMergeMarker = (body) => {
            if (!body) return false;
            return body
              .split(/\r?\n/)
              .some((line) => line.trim() === 'READY TO MERGE');
          };

          // What `mergeable_state` means for a PR this action has to merge
          // itself, read together with the checks reporting on its head. GitHub
          // computes mergeability in the background, so a PR read seconds after
          // it was opened — exactly when a runner arms the PR it just created —
          // answers `unknown`; waiting resolves that. `dirty` and `behind` are
          // "not without a human or a branch update": no amount of waiting
          // changes either, so they end the wait immediately rather than
          // burning the whole budget.
          //
          // `unstable` and `blocked` are the two that the state alone cannot
          // decide, because each covers both a check still running and a check
          // that already failed. Waiting is right for the first and pointless
          // for the second, so the checks break the tie: a failure is `stuck`
          // now, and a run still in flight is `pending` — not a verdict this
          // job can improve on by holding a runner open, since the sweep on CI
          // completion re-evaluates the PR the moment there is something new to
          // read.
          const mergeVerdict = (state, checks) => {
            if (checks.failed > 0) return 'stuck';
            if (state === 'dirty' || state === 'behind') return 'stuck';
            if (state === 'clean') return 'merge';
            if (checks.pending > 0) return 'pending';
            return 'wait';
          };

          // `cancelled` sits with the failures on purpose: `filter: latest`
          // already drops a run superseded by a rerun of the same name, so a
          // cancellation that survives it is one nothing is going to repeat.
          // `action_required` is the opposite — the release above just requeued
          // it, and the rerun has not registered yet.
          const CHECK_FAILURES = new Set(['failure', 'cancelled', 'timed_out', 'startup_failure']);

          const checkState = async (sha) => {
            const runs = await github.paginate(github.rest.checks.listForRef, {
              owner, repo, ref: sha, filter: 'latest', per_page: 100
            });

            let pending = 0;
            let failed = 0;

            for (const run of runs) {
              // When a `pull_request` event carried this action here, the job
              // running it reports a check of its own on the same head. Count
              // that and the sweep waits on itself: `pending` forever, on a PR
              // whose real checks all passed.
              const url = run.details_url || run.html_url || '';
              if (url.includes(`/actions/runs/${context.runId}/`)) continue;

              if (run.status !== 'completed') pending += 1;
              else if (run.conclusion === 'action_required') pending += 1;
              else if (CHECK_FAILURES.has(run.conclusion)) failed += 1;
            }

            // Commit statuses are a separate API from check runs and a PR can
            // be held by either. `total_count === 0` reads as `pending` from
            // GitHub, which is why the count is tested before the state.
            const { data: combined } = await github.rest.repos.getCombinedStatusForRef({
              owner, repo, ref: sha
            });
            if (combined.total_count > 0) {
              if (combined.state === 'pending') pending += 1;
              if (combined.state === 'failure' || combined.state === 'error') failed += 1;
            }

            return { pending, failed };
          };

          const method = (process.env.MERGE_METHOD || 'squash').toUpperCase();
          const only = parseInt(process.env.ONLY_PR || '', 10);
          const head = (process.env.ONLY_HEAD || '').trim();
          const settleMs = (parseInt(process.env.SETTLE_SECONDS || '', 10) || 600) * 1000;
          const POLL_MS = 15_000;

          // Poll until the PR stops saying "ask again", or the budget runs out.
          // Only `wait` — mergeability still being computed — is worth a poll;
          // it resolves in seconds. Waiting out CI is not this budget's job.
          const settledState = async (n) => {
            const deadline = Date.now() + settleMs;
            for (;;) {
              const { data } = await github.rest.pulls.get({ owner, repo, pull_number: n });
              const state = data.mergeable_state;
              const checks = await checkState(data.head.sha);
              const verdict = mergeVerdict(state, checks);
              if (verdict !== 'wait' || Date.now() >= deadline) return { state, verdict, checks };
              core.info(`#${n}: \`${state}\` — waiting for it to settle.`);
              await new Promise((resolve) => setTimeout(resolve, POLL_MS));
            }
          };

          // By number when a `pull_request` event named one, by head branch when
          // a runner is arming the PR it just opened, everything open otherwise.
          let candidates;
          if (!Number.isNaN(only)) {
            candidates = [(await github.rest.pulls.get({ owner, repo, pull_number: only })).data];
          } else if (head) {
            candidates = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', head: `${owner}:${head}`, per_page: 100
            });
            if (candidates.length === 0) {
              core.info(`No open PR from ${head}. The run produced none, or it is not open yet.`);
            }
          } else {
            candidates = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100
            });
          }

          const enabled = [];
          const unarmed = [];
          const pending = [];
          let approved = 0;

          for (const summary of candidates) {
            const n = summary.number;

            if (summary.state !== 'open') {
              core.info(`#${n}: not open, skipping.`);
              continue;
            }
            if (summary.draft) {
              core.info(`#${n}: draft — a draft is the pipeline's way of saying a channel did not pass.`);
              continue;
            }
            if (!carriesMergeMarker(summary.body)) {
              core.info(`#${n}: no READY TO MERGE marker.`);
              continue;
            }

            core.info(`#${n}: marked READY TO MERGE by ${summary.user?.login} on ${summary.head.ref}.`);

            // A PR opened with GITHUB_TOKEN gets its `pull_request` workflow
            // runs created and immediately parked as `action_required`: CI never
            // starts, no check ever reports, and auto-merge waits on checks that
            // will never arrive. Releasing them here is what makes the enable
            // below mean something. Needs `actions: write` on the token — a
            // failure is reported, not fatal, since the PR may have no gated run.
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner, repo, head_sha: summary.head.sha, per_page: 100
            });
            const gated = runs.filter(
              (run) => run.status === 'action_required' || run.conclusion === 'action_required'
            );
            for (const run of gated) {
              try {
                await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/approve', {
                  owner, repo, run_id: run.id
                });
                core.info(`#${n}: released gated run ${run.id} (${run.name}).`);
                approved += 1;
              } catch (error) {
                core.warning(
                  `#${n}: could not release gated run ${run.id} (${run.name}): ${error.message}. ` +
                  'The token needs `actions: write`; without it the PR waits on checks that never start.'
                );
              }
            }

            // `gh pr merge --auto` is idempotent and so is this: re-running over
            // a PR that already has auto-merge enabled is the normal case on a
            // sweep, and costs one rejected mutation.
            //
            // The variable is `$mergeMethod`, not `$method`: @octokit/graphql
            // reserves its own request-option names — method, url, baseUrl,
            // headers, query, request, mediaType — and throws
            // `"method" cannot be used as variable name` before the mutation
            // ever leaves the runner. That threw on every call, so auto-merge
            // was never once enabled and PR #434 sat open, green and marked,
            // while both arming paths reported success.
            try {
              await github.graphql(
                `mutation($id: ID!, $mergeMethod: PullRequestMergeMethod!) {
                   enablePullRequestAutoMerge(input: { pullRequestId: $id, mergeMethod: $mergeMethod }) {
                     clientMutationId
                   }
                 }`,
                { id: summary.node_id, mergeMethod: method }
              );
              core.info(`#${n}: auto-merge enabled.`);
              enabled.push(n);
              continue;
            } catch (error) {
              const message = error.message || '';

              if (/already enabled/i.test(message)) {
                core.info(`#${n}: auto-merge already enabled.`);
                enabled.push(n);
                continue;
              }

              // Every other refusal is decided on the PR's state, never on the
              // wording of the error. GitHub refuses auto-merge on a PR that has
              // nothing left to wait for and on a repository with the feature
              // switched off, and those two messages used to be the only ones
              // that reached the merge below — so the one failure nobody had
              // predicted, the `$method` throw above, fell through to a warning
              // and a green step. A message this action does not recognise now
              // costs a wait, not a stalled queue.
              core.info(`#${n}: auto-merge refused (${message}) — merging it here instead.`);

              const settled = await settledState(n);

              // Checks still running is the normal state of a PR the pipeline
              // just opened, and on a `full-ci` PR they run for the better part
              // of an hour. Holding a runner open for that is the bug this path
              // used to have; the sweep on CI completion picks the PR back up.
              if (settled.verdict === 'pending') {
                core.info(
                  `#${n}: \`${settled.state}\`, ${settled.checks.pending} check(s) still running — ` +
                  'the CI-completion sweep re-evaluates it once they report.'
                );
                pending.push(n);
                continue;
              }

              if (settled.verdict !== 'merge') {
                const detail = settled.checks.failed > 0
                  ? `${settled.checks.failed} check(s) failed`
                  : `the PR settled as \`${settled.state}\`, not \`clean\``;
                core.warning(
                  `#${n}: auto-merge unavailable (${message}) and ${detail} — it needs a look.`
                );
                unarmed.push(n);
                continue;
              }

              try {
                await github.rest.pulls.merge({
                  owner, repo, pull_number: n, merge_method: method.toLowerCase()
                });
                core.info(`#${n}: merged directly — auto-merge unavailable and every check had reported.`);
                enabled.push(n);
              } catch (mergeError) {
                core.warning(`#${n}: direct merge failed: ${mergeError.message}`);
                unarmed.push(n);
              }
            }
          }

          core.setOutput('enabled', enabled.join(' '));
          core.setOutput('unarmed', unarmed.join(' '));
          core.setOutput('pending', pending.join(' '));
          core.setOutput('approved', String(approved));
          core.info(
            enabled.length === 0
              ? 'No PR carried the marker in a mergeable state.'
              : `Auto-merge covers PR(s): ${enabled.map((n) => `#${n}`).join(', ')}.`
          );
          if (pending.length > 0) {
            core.info(
              `Waiting on checks, re-evaluated when CI reports: ${pending.map((n) => `#${n}`).join(', ')}.`
            );
          }

          // A marked PR that ends neither armed nor merged holds its issue, and
          // the queue behind it, for as long as it stays open. Nothing else is
          // watching, so this is the last place it can be said out loud: the
          // step goes red rather than passing with a warning nobody reads.
          if (unarmed.length > 0) {
            core.setFailed(
              `Marked READY TO MERGE but neither armed nor merged: ${unarmed.map((n) => `#${n}`).join(', ')}. ` +
              'Each warning above names the PR state that stopped it.'
            );
          }
