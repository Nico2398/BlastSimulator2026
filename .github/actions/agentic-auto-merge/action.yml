name: 'Agentic merge gate'
description: >
  The one place a pull request is merged. Sweeps every open pull request that
  carries READY TO MERGE and merges one only when every channel on its head is
  green AND that head already contains its base branch's tip, so the tree that
  lands on `main` is a tree CI has already passed. A green head that is behind
  gets `main` merged into it and goes back through CI; a head that conflicts
  with `main` is handed back to the agent. Whatever account opened the PR.

  Called only from `agentic-auto-merge.yml`, under its `agentic-merge`
  concurrency group, which is what makes "up to date, then merge" hold: no two
  sweeps can each find a different PR up to date with the same `main` and merge
  both. The repository must be checked out — the machinery list is read from
  `.github/scripts/ci-handback.cjs`.

inputs:
  token:
    description: 'PAT with contents, pull-requests and actions write. GITHUB_TOKEN cannot approve gated runs, and a merge it performs raises no event.'
    required: true

outputs:
  merged:
    description: 'Space-separated PR numbers this sweep merged.'
    value: ${{ steps.sweep.outputs.merged }}
  updated:
    description: 'Space-separated PR numbers that were green but behind, and had their base merged into them. CI runs again on each.'
    value: ${{ steps.sweep.outputs.updated }}
  handback:
    description: >-
      Space-separated PR numbers with a red channel or a conflict with their
      base. The caller dispatches `agentic-ci-failure.yml` for each, which owns
      handing them back to the agent.
    value: ${{ steps.sweep.outputs.handback }}
  pending:
    description: >-
      Space-separated PR numbers still waiting on checks. Not a failure: CI
      completing is the event that brings the sweep back.
    value: ${{ steps.sweep.outputs.pending }}
  stuck:
    description: 'Space-separated PR numbers that are marked and cannot move for a reason no agent handback covers. The step fails on these.'
    value: ${{ steps.sweep.outputs.stuck }}
  approved:
    description: 'Number of gated workflow runs released across the swept PRs.'
    value: ${{ steps.sweep.outputs.approved }}

runs:
  using: composite
  steps:
    - name: Merge what is green on top of main, update what is behind
      id: sweep
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.token }}
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;

          // What counts as a channel, and what counts as red, is decided once
          // for every reader of a pull request's head — the CI fail-safe, the
          // watchdog, and this gate.
          const { RUN_FAILURES, latestPerWorkflow } = require(
            `${process.env.GITHUB_WORKSPACE}/.github/scripts/ci-handback.cjs`
          );

          // The marker decides, never the account. A pipeline PR is opened by
          // whichever identity the runner's token resolved to that day —
          // `github-actions[bot]` when the agent step overrides the PAT it was
          // handed, a real user when it does not — and the loop must not depend
          // on which. `READY TO MERGE` on a line of its own is the pipeline's
          // own ship signal, written by the orchestrator and by nothing else,
          // so it identifies an autonomous run's deliverable without asking who
          // pressed the button. Trailing whitespace is tolerated because the
          // line survives a round trip through the GitHub API and through
          // `gh pr edit`, both of which can add it.
          const carriesMergeMarker = (body) => {
            if (!body) return false;
            return body
              .split(/\r?\n/)
              .some((line) => line.trim() === 'READY TO MERGE');
          };

          // What the channels on a head have reported: one run per workflow,
          // newest, the pipeline's own machinery left out. Machinery matters
          // here specifically: `auto-assign-next.yml` runs on the PR head for
          // every `pull_request` event and dispatches this very sweep, so
          // counting it would read the PR as pending on the run that asked for
          // the look — and when CI had already finished, nothing would come
          // back for it.
          const checkState = (runs) => {
            let pending = 0;
            let failed = 0;
            const channels = latestPerWorkflow(runs);
            for (const run of channels) {
              if (run.status !== 'completed') pending += 1;
              else if (RUN_FAILURES.has(run.conclusion)) failed += 1;
            }
            return { pending, failed, total: channels.length };
          };

          // The gate, decided on state alone — never on a clock.
          //
          // `dirty` is a conflict with the base, and only an agent resolves one.
          // A failed channel is the CI fail-safe's. Anything still running, or
          // a head that has reported nothing at all, is pending: CI completing
          // is itself the event that brings the sweep back. `total === 0` is
          // deliberately not "nothing failed, so merge" — a PR read in the
          // second before its CI run is created has no runs yet, and merging on
          // that reads an absence of evidence as a pass.
          //
          // Then the rule that makes parallel runs safe: green is not enough.
          // Two pull requests can each be green alone and red together — a
          // rename and a new caller of the old name, a threshold and the
          // scenario that pinned it — and GitHub would merge both. So a green
          // head merges only when it already contains the base's tip (`merge`);
          // one that is behind gets the base merged in and goes through CI again
          // (`update`). `compare` means that question has not been asked yet.
          // `mergeable_state` cannot answer it: with no required checks GitHub
          // reports `clean` for a branch that is behind.
          const gateVerdict = (state, checks, behindBy) => {
            if (state === 'dirty') return 'conflict';
            if (checks.failed > 0) return 'red';
            if (checks.pending > 0 || checks.total === 0) return 'pending';
            if (!Number.isInteger(behindBy)) return 'compare';
            return behindBy > 0 ? 'update' : 'merge';
          };

          // A workflow run's own `conclusion` is `success` the moment every job
          // in it either passed or was skipped -- a job that never ran is
          // indistinguishable from that at the run level, which is how PR #615
          // merged with its interaction shards never having run. `ci.yml` runs
          // these jobs on every pull request; this is the independent line of
          // defence: never trust a run-level `success` for a job the run owes
          // without asking that run's own jobs. Kept identical to
          // scripts/lib/required-jobs.ts's list; autonomy-loop.test.ts
          // compares the two literals.
          const REQUIRED_JOBS = [
            { jobNamePrefix: 'Scenarios (interaction mode)' },
            { jobNamePrefix: 'Production build' },
          ];

          // `runs` is the same head-scoped list `checkState` reads, unfiltered —
          // this looks up the CI run directly by path rather than by workflow
          // name, since `.name` is a display string free to change independent
          // of the file that emits it.
          const missingRequiredJobs = async (runs) => {
            const ciRuns = runs.filter((r) => r.path === '.github/workflows/ci.yml');
            if (ciRuns.length === 0) return REQUIRED_JOBS.map((g) => g.jobNamePrefix);
            const ciRun = ciRuns.reduce((a, b) => (b.id > a.id ? b : a));

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: ciRun.id, per_page: 100
            });

            return REQUIRED_JOBS
              .filter((g) => {
                const matches = jobs.filter((j) => j.name.startsWith(g.jobNamePrefix));
                return matches.length === 0 || !matches.every((j) => j.conclusion === 'success');
              })
              .map((g) => g.jobNamePrefix);
          };

          // How many of the base's commits the head does not contain. `null`
          // when the comparison could not be read, which never merges.
          const behindBase = async (pr) => {
            try {
              const { data } = await github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: `${pr.base.ref}...${pr.head.sha}`, per_page: 1
              });
              return data.behind_by;
            } catch (error) {
              core.warning(`#${pr.number}: could not compare its head with ${pr.base.ref} (${error.status ?? error.message}).`);
              return null;
            }
          };

          // A pipeline run leaves its PR marked or draft; there is no third
          // state. `pipeline/feature-<N>` is the pipeline's own branch, so a
          // non-draft PR from one carrying no marker is a run that stopped
          // mid-sentence — #507 and #508 each said the marker "will follow once
          // the CI jobs report", and nothing exists to bring it. This gate
          // skips an unmarked PR, `auto-assign-next` chains from a merge that
          // never happens, and the watchdog skips any issue with a linked PR,
          // so issue #504 held `in-progress` for a day with every assignment
          // behind it waiting. This is the only place that sees it. The
          // `-<runId>` tail is what makes a work branch unique per run (#554);
          // branches from before the convention carry none, so both match.
          const PIPELINE_HEAD = /^pipeline\/feature-\d+(?:-[A-Za-z0-9._-]+)?$/;

          const merged = [];
          const updated = [];
          const handback = [];
          const pending = [];
          const stuck = [];
          const unmarked = [];
          let approved = 0;

          // A refused update or merge is judged on the PR's state afterwards,
          // never on the wording of the error (PR #434: a refusal string this
          // code did not recognise once fell through to a green step). A head
          // that moved is its own new CI run's business; a conflict goes back
          // to the agent; anything else is a state nothing here can repair.
          const settleRefusal = async (before, what) => {
            const n = before.number;
            const { data: now } = await github.rest.pulls.get({ owner, repo, pull_number: n });
            if (now.state !== 'open') {
              core.info(`#${n}: ${what}, and it is ${now.merged ? 'merged' : now.state} now — nothing left to do.`);
              return;
            }
            if (now.head.sha !== before.head.sha) {
              core.info(`#${n}: ${what}, but its head moved to ${now.head.sha.slice(0, 7)} — that commit's own CI decides.`);
              pending.push(n);
              return;
            }
            if (now.mergeable_state === 'dirty') {
              core.info(`#${n}: ${what} — it conflicts with ${now.base.ref}. Handing it back.`);
              handback.push(n);
              return;
            }
            core.warning(
              `#${n}: ${what}, and the pull request reads \`${now.mergeable_state}\` — neither a conflict ` +
              'nor a moved head. A protection rule or a missing token scope; it needs a look.'
            );
            stuck.push(n);
          };

          // Every open pull request, oldest first, every time. The group this
          // runs under keeps one pending sweep and drops the rest, which is only
          // harmless because every sweep reads everything: whichever one
          // survives sees every PR as it stands when it starts. Oldest first so
          // the order work lands in matches the order it was queued.
          const candidates = await github.paginate(github.rest.pulls.list, {
            owner, repo, state: 'open', sort: 'created', direction: 'asc', per_page: 100
          });

          for (const summary of candidates) {
            const n = summary.number;

            if (summary.draft) {
              core.info(`#${n}: draft — a draft is the pipeline's way of saying a channel did not pass.`);
              continue;
            }
            if (!carriesMergeMarker(summary.body)) {
              if (PIPELINE_HEAD.test(summary.head?.ref || '')) {
                core.warning(
                  `#${n}: opened from ${summary.head.ref}, not a draft, and carrying no READY TO MERGE marker. ` +
                  'A pipeline PR ships marked or it is a draft naming the channel that stopped it. ' +
                  'Neither was said, so nothing merges it and its issue stays in-progress.'
                );
                unmarked.push(n);
              } else {
                core.info(`#${n}: no READY TO MERGE marker.`);
              }
              continue;
            }

            // Read fresh: the listing predates every merge this sweep has
            // already made, and `mergeable_state` is only on a single read.
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: n });
            if (pr.state !== 'open') {
              core.info(`#${n}: ${pr.state} since the listing — skipping.`);
              continue;
            }
            core.info(`#${n}: marked READY TO MERGE by ${pr.user?.login} on ${pr.head.ref}.`);

            // A PR opened with GITHUB_TOKEN gets its `pull_request` workflow
            // runs created and immediately parked as `action_required`: CI never
            // starts, no check ever reports, and this gate waits on checks that
            // will never arrive. Releasing them here is what makes the wait mean
            // something. Needs `actions: write` on the token — a failure is
            // reported, not fatal, since the PR may have no gated run.
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner, repo, head_sha: pr.head.sha, per_page: 100
            });
            const gated = runs.filter(
              (run) => run.status === 'action_required' || run.conclusion === 'action_required'
            );
            for (const run of gated) {
              try {
                await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/approve', {
                  owner, repo, run_id: run.id
                });
                core.info(`#${n}: released gated run ${run.id} (${run.name}).`);
                approved += 1;
              } catch (error) {
                core.warning(
                  `#${n}: could not release gated run ${run.id} (${run.name}): ${error.message}. ` +
                  'The token needs `actions: write`; without it the PR waits on checks that never start.'
                );
              }
            }

            const checks = checkState(runs);
            let verdict = gateVerdict(pr.mergeable_state, checks, null);
            let behind = null;
            if (verdict === 'compare') {
              behind = await behindBase(pr);
              verdict = gateVerdict(pr.mergeable_state, checks, behind);
            }

            if (verdict === 'pending') {
              core.info(
                `#${n}: ` +
                (checks.total === 0
                  ? 'no channel has reported on this head yet'
                  : `${checks.pending} of ${checks.total} channel(s) still going`) +
                ' — CI completing brings this sweep back.'
              );
              pending.push(n);
              continue;
            }

            if (verdict === 'conflict' || verdict === 'red') {
              core.info(
                `#${n}: ` +
                (verdict === 'conflict'
                  ? `conflicts with ${pr.base.ref}`
                  : `${checks.failed} channel(s) failed on ${pr.head.sha.slice(0, 7)}`) +
                ' — handing it to the CI fail-safe, which owns putting it back in front of the agent.'
              );
              handback.push(n);
              continue;
            }

            if (verdict === 'compare') {
              core.warning(`#${n}: green, but whether it contains ${pr.base.ref}'s tip could not be read. Not merging on an unread fact.`);
              stuck.push(n);
              continue;
            }

            if (verdict === 'update') {
              // The merge commit this pushes is authored under the PAT, so it
              // raises `pull_request: synchronize` and CI runs on the result.
              // `expected_head_sha` makes it a no-op on a head that moved since
              // the read above, rather than a merge onto something unchecked.
              try {
                await github.request('PUT /repos/{owner}/{repo}/pulls/{pull_number}/update-branch', {
                  owner, repo, pull_number: n, expected_head_sha: pr.head.sha
                });
                core.info(
                  `#${n}: green, but ${behind} commit(s) behind ${pr.base.ref} — merged ${pr.base.ref} into it. ` +
                  'CI runs again on the result, and its completion brings this sweep back.'
                );
                updated.push(n);
              } catch (error) {
                await settleRefusal(pr, `bringing it up to date with ${pr.base.ref} was refused (${error.message})`);
              }
              continue;
            }

            // Every channel green on a head that contains the base's tip -- but
            // that is a run-level fact, and #615 merged on exactly that fact
            // while its interaction job had silently skipped. Ask the CI run's
            // own jobs before asking GitHub to merge.
            const missing = await missingRequiredJobs(runs);
            if (missing.length > 0) {
              core.warning(
                `#${n}: every channel reported success, but the required job(s) ` +
                `${missing.join(', ')} did not fully run — not merging on an absence of evidence (#615).`
              );
              stuck.push(n);
              continue;
            }

            // The merge request is the authority on whether a PR merges, and
            // `sha` pins it to the head this sweep just judged: a push that
            // lands between the read and the merge makes it refuse rather than
            // merge a commit no channel has seen.
            try {
              await github.rest.pulls.merge({
                owner, repo, pull_number: n, merge_method: 'squash', sha: pr.head.sha
              });
              core.info(`#${n}: merged — every channel green on a head containing ${pr.base.ref}'s tip.`);
              merged.push(n);
            } catch (error) {
              await settleRefusal(pr, `the merge was refused (${error.message})`);
            }
          }

          core.setOutput('merged', merged.join(' '));
          core.setOutput('updated', updated.join(' '));
          core.setOutput('handback', handback.join(' '));
          core.setOutput('pending', pending.join(' '));
          core.setOutput('stuck', stuck.join(' '));
          core.setOutput('approved', String(approved));

          const list = (numbers) => numbers.map((number) => `#${number}`).join(', ');
          core.info(merged.length === 0 ? 'Nothing merged.' : `Merged: ${list(merged)}.`);
          if (updated.length > 0) core.info(`Brought up to date, CI running again: ${list(updated)}.`);
          if (pending.length > 0) core.info(`Waiting on checks: ${list(pending)}.`);
          if (handback.length > 0) core.info(`Red or conflicting, handed to the CI fail-safe: ${list(handback)}.`);

          // Said out loud for the same reason as `stuck` below: an unmarked
          // pipeline PR is not waiting on anything, it is stranded, and only a
          // human can tell which it should have been. Red here rather than a
          // warning in a log nobody reads.
          if (unmarked.length > 0) {
            core.setFailed(
              `Neither marked nor draft: ${list(unmarked)}. ` +
              'Each is a pipeline PR whose run ended without saying whether its work ships. ' +
              'Add READY TO MERGE, or convert it to a draft naming the channel that stopped it.'
            );
          }

          // A marked PR that can neither merge, update, wait nor be handed back
          // holds its issue, and its parallel-run slot, for as long as it stays
          // open. Nothing else is watching, so the step goes red rather than
          // passing with a warning nobody reads.
          if (stuck.length > 0) {
            core.setFailed(
              `Marked READY TO MERGE and unable to move: ${list(stuck)}. ` +
              'Each warning above names the PR state that stopped it.'
            );
          }
