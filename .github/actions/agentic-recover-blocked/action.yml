name: "Recover a run this session's slot blocked"
description: >
  Reacts to the one event this pipeline had no hook for: GitHub Actions
  silently dropping a *queued* run. `agentic-runner` (claude-runner.yml,
  opencode-runner.yml) keeps only one pending run per concurrency group — a
  second one that arrives before the first starts cancels it outright, zero
  job steps, nothing left to retry from. #572 and #610 were both exactly
  this: a real assignment queued correctly behind a live session, then
  evicted seconds later by that same session's own trailing wrap-up comment
  on its way out — a no-op that never mentions the agent, but still claimed
  the one pending slot before resolving to nothing.

  The issue that assignment was for is left `in-progress` with no session and
  no PR. Because `selectNextAssignable` counts every `in-progress` issue as
  a live run, holding a parallel-run slot and its scopes, the queue loses that
  slot — and at the default of one slot the *whole queue* stops behind it —
  until `agentic-watchdog.yml`'s hourly sweep notices.

  This runs at the tail of every session and asks the one question whose
  answer does not depend on a clock: is any *other* issue sitting
  `in-progress` with no deliverable PR and no queued or live run of its own
  to finish it? If so, that assignment was dropped, not merely slow — release
  it exactly as the watchdog would, so `handle-failure.yml`'s existing
  `blocked` reaction chains the queue past it immediately instead of after a
  stall threshold. "Of its own" is read off each run's `run-name`
  (`run-liveness.cjs`'s `runConcerns`): several sessions can be live at once,
  and one issue's session is no evidence about another's.

  The genuinely-lost decision itself is delegated to `run-liveness.cjs`
  rather than decided inline here. It used to treat one empty
  status-filtered `listWorkflowRuns` read as proof a run was gone — that read
  is eventually consistent, and a run created seconds earlier can simply not
  show up yet. That falsely declared a live run lost, labelled its issue
  `blocked` with an inferred cause that was never actually verified, and
  cascaded into parking the whole pipeline queue. See issue #1136.

inputs:
  token:
    description: >
      Token used to read issues/runs and to label/comment. Must be a PAT —
      labelling with GITHUB_TOKEN raises no `issues: labeled` event, so
      `handle-failure.yml` would never chain past the recovered issue.
    required: true
  self_issue:
    description: "This run's own issue number, excluded from the sweep. Empty is fine."
    required: false
    default: ""
  grace_window_minutes:
    description: >
      Minutes a run is given to become visible in `listWorkflowRuns` before
      its absence counts as evidence of loss. Empty defers to
      `run-liveness.cjs`'s own default.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - id: recover
      uses: actions/github-script@v7
      env:
        SELF_ISSUE: ${{ inputs.self_issue }}
        GRACE_WINDOW_MINUTES: ${{ inputs.grace_window_minutes }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const mine = parseInt(process.env.SELF_ISSUE || '', 10);

          // Required from the workspace, not vendored into this YAML: the same
          // rules and the same deliverable predicate every other entry point
          // reaches through them, so this cannot silently disagree with what
          // `agentic-assign` or `agentic-watchdog` would decide. The liveness
          // decision itself is `run-liveness.cjs`'s — see issue #1136.
          const rules = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/assignability.cjs`);
          const { createIssueApi } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/issue-api.cjs`);
          const runLiveness = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/run-liveness.cjs`);
          const api = createIssueApi(github, { owner, repo, log: core.info });

          // Whichever account `inputs.token` resolves to — the same PAT
          // `agentic-assign` writes assignment comments with, since both this
          // action and that one are always invoked with
          // `PAT_TOKEN_COPILOT_AUTOMATION`. `decideRunLiveness` trusts an
          // assignment comment's phrase match only when it also comes from
          // this login, so a comment anyone else posts containing the same
          // phrase cannot read as evidence the run is still alive. See
          // issue #1136's security finding. A failed read leaves this `null`,
          // which the same fail-closed check turns into "no trusted comment
          // found" rather than a crash.
          let trustedAuthorLogin = null;
          try {
            const { data: self } = await github.rest.users.getAuthenticated();
            trustedAuthorLogin = self.login;
          } catch (error) {
            core.warning(
              `Could not resolve this run's own identity (${error.status ?? error.message}) — assignment comments will not be trusted as evidence this sweep.`
            );
          }

          // Every runner run worth weighing, read the one shared way —
          // `runnerRuns` in `issue-api.cjs` unions an unfiltered listing (a run
          // seconds old, which a status-filtered read can omit: #1136) with
          // the status-filtered ones (a live run hours old, which the
          // unfiltered page can drop once enough noop runs pile up on top of
          // it). `run-liveness.cjs` then weighs only the runs that name the
          // issue under test — another issue's live session is no evidence
          // about this one, and with `AGENTIC_MAX_PARALLEL_RUNS` above 1 there
          // usually is one.
          const { runs: workflowRuns, unknown: workflowRunsUnknown } = await api.runnerRuns();

          const graceWindowMinutes = runLiveness.resolveGraceWindowMinutes(process.env.GRACE_WINDOW_MINUTES);

          const busy = await api.listIssuesByLabel(rules.IN_PROGRESS);
          let recovered = 0;
          for (const issue of busy) {
            if (issue.number === mine) continue;

            // Unknown is not evidence either way — leave it for the watchdog,
            // which retries the same read later rather than guessing now.
            const deliverable = await api.deliverableFor(issue.number);
            if (deliverable.unknown) {
              core.warning(`#${issue.number}: pull requests could not be read — leaving it for the watchdog.`);
              continue;
            }
            const carrier = deliverable.pipeline ?? deliverable.closers[0];
            if (carrier) {
              core.info(`#${issue.number}: pull request #${carrier.number} carries it — leaving alone.`);
              continue;
            }

            const assignmentComments = await api.assignmentCommentsFor(issue.number);

            const verdict = runLiveness.decideRunLiveness({
              issueNumber: issue.number,
              assignmentComments: assignmentComments.comments,
              assignmentCommentsUnknown: assignmentComments.unknown,
              workflowRuns,
              workflowRunsUnknown,
              now: Date.now(),
              graceWindowMinutes,
              excludeRunId: context.runId,
              trustedAuthorLogin,
            });

            if (verdict.verdict !== 'lost') {
              (verdict.verdict === 'live' ? core.info : core.warning)(verdict.reason);
              continue;
            }

            core.warning(verdict.reason);
            const runLine = verdict.evidence.mostRecentRun
              ? `The most recently observed run is #${verdict.evidence.mostRecentRun.id}, status \`${verdict.evidence.mostRecentRun.status}\`, created ${verdict.evidence.mostRecentRun.createdAt} (~${verdict.evidence.mostRecentRun.ageMinutes}m ago).`
              : 'No workflow run was found for this issue at all.';
            const assignmentLine = verdict.evidence.assignmentComment
              ? `Its assignment comment is ~${verdict.evidence.assignmentComment.ageMinutes}m old, beyond the ${verdict.evidence.graceWindowMinutes}m grace window this check allows for the run list to catch up.`
              : '';

            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number,
              body: [
                '🕳️ **This run was lost — caught at hand-off, not by the hourly sweep.**',
                '',
                `Issue #${issue.number} holds \`in-progress\` with no pull request and no runner run of its own queued or live. ${assignmentLine}`,
                runLine,
                '',
                'Marking it `blocked` so `handle-failure.yml` chains the queue past it right away, rather than leaving every later assignment deferred behind it until the next stall sweep.',
              ].join('\n'),
            });
            await github.rest.issues.addLabels({
              owner, repo, issue_number: issue.number, labels: [rules.BLOCKED],
            });
            await github.rest.issues.removeLabel({
              owner, repo, issue_number: issue.number, name: rules.IN_PROGRESS,
            }).catch(() => {});
            recovered += 1;
          }
          core.info(`Recovered ${recovered} issue(s).`);
