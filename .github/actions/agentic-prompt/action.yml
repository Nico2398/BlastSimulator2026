name: "Agentic trigger prompt"
description: >
  Builds the task prompt for an autonomous pipeline run from the triggering
  event (workflow_dispatch, issue comment, or PR review comment) and resolves
  the issue number the run is working on. Runtime-agnostic: the same text is
  handed to OpenCode and to Claude Code.

inputs:
  token:
    description: "Token used to read the issue body. GITHUB_TOKEN is enough."
    required: true
  issue_number:
    description: "Issue number from a workflow_dispatch input. Empty for comment triggers."
    required: false
    default: ""

outputs:
  prompt:
    description: "Task prompt describing the trigger. Also exported as the PROMPT environment variable."
    value: ${{ steps.build.outputs.prompt }}
  issue:
    description: "Issue number this run resolves, or empty when the trigger was not an issue."
    value: ${{ steps.build.outputs.issue }}
  entity:
    description: >
      Single-line reference to what triggered the run ("issue 42", "pr 17",
      "manual"). Safe to pass as a slash-command argument.
    value: ${{ steps.build.outputs.entity }}
  feature_branch:
    description: "The branch this run's deliverable lands on, `pipeline/feature-<suffix>`."
    value: ${{ steps.build.outputs.feature_branch }}

runs:
  using: composite
  steps:
    - id: build
      uses: actions/github-script@v7
      env:
        DISPATCH_ISSUE: ${{ inputs.issue_number }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const fs = require('fs');
          const event = context.eventName;
          let prompt = '';
          let issue = '';
          let entity = 'manual';

          if (event === 'workflow_dispatch') {
            const issueNum = (process.env.DISPATCH_ISSUE || '').trim();
            if (issueNum) {
              issue = issueNum;
              entity = 'issue ' + issueNum;
              const { data: target } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(issueNum, 10)
              });
              prompt = [
                'You have been assigned to GitHub Issue #' + issueNum + '.',
                '',
                'The issue description is:',
                '--- BEGIN DESCRIPTION ---',
                target.body || '(No description)',
                '--- END DESCRIPTION ---',
                '',
                'Read the full Issue #' + issueNum + ' thread for more context. You have access to tools to read issues from the GitHub repo.'
              ].join('\n');
            } else {
              prompt = 'You have been triggered manually.';
            }
          } else if (event === 'issue_comment') {
            const commentBody = context.payload.comment?.body || '';
            const isPR = !!context.payload.issue?.pull_request;
            const num = context.payload.issue?.number;
            const entityBody = context.payload.issue?.body || '(No description)';
            const type = isPR ? 'Pull Request' : 'Issue';
            const threadType = isPR ? 'pull requests' : 'issues';
            if (!isPR && num) {
              issue = String(num);
            }
            entity = (isPR ? 'pr ' : 'issue ') + num;

            prompt = [
              'You have been mentioned in a comment from ' + type + ' #' + num + '.',
              '',
              'The message that triggered this session was:',
              '--- BEGIN TRIGGER MESSAGE ---',
              commentBody,
              '--- END TRIGGER MESSAGE ---',
              '',
              'The description of this ' + type.toLowerCase() + ' is:',
              '--- BEGIN DESCRIPTION ---',
              entityBody,
              '--- END DESCRIPTION ---',
              '',
              'Read the full ' + type + ' #' + num + ' thread for more context. You have access to tools to read ' + threadType + ' from the GitHub repo.'
            ].join('\n');
          } else if (event === 'pull_request_review_comment') {
            const num = context.payload.pull_request?.number;
            const commentBody = context.payload.comment?.body || '';
            const prBody = context.payload.pull_request?.body || '(No description)';
            entity = 'pr ' + num;

            prompt = [
              'You have been mentioned in a review comment from Pull Request #' + num + '.',
              '',
              'The message that triggered this session was:',
              '--- BEGIN TRIGGER MESSAGE ---',
              commentBody,
              '--- END TRIGGER MESSAGE ---',
              '',
              'The pull request description is:',
              '--- BEGIN DESCRIPTION ---',
              prBody,
              '--- END DESCRIPTION ---',
              '',
              'Read the full Pull Request #' + num + ' thread for more context. You have access to tools to read pull requests from the GitHub repo.'
            ].join('\n');
          } else {
            prompt = 'A user triggered you. Read the context and respond appropriately.';
          }

          // --- Branch names for this run ---
          // Every work branch carries the run id, so two runs on the same issue
          // never contend for one name. Issue #554 is why: run 166 built
          // `pipeline/feature-554` from `main` while run 160's abandoned branch
          // of that exact name was still on the remote, and the rescue push died
          // `non-fast-forward` with six hours of finished work on it. The names
          // are stated here rather than in the assignment comment because only
          // the runner knows its own run id.
          const suffix = (issue ? issue + '-' : '') + context.runId;
          const featureBranch = 'pipeline/feature-' + suffix;
          if (event !== 'pull_request_review_comment') {
            prompt += [
              '',
              '',
              '--- BRANCHES FOR THIS RUN ---',
              'Every branch you create carries this run\'s id, so nothing you build can collide',
              'with a branch an earlier run left behind. Use exactly these names:',
              '',
              '- `pipeline/tests-' + suffix + '` — the failing tests',
              '- `pipeline/impl-' + suffix + '` — the implementation, cut from `main` and blind to the tests',
              '- `' + featureBranch + '` — the deliverable, and the head of the pull request you open',
              '',
              'Never reuse a branch from a previous run, and never force-push over one.',
              '--- END BRANCHES FOR THIS RUN ---'
            ].join('\n');
          }

          // OpenCode reads the task from $PROMPT; Claude Code reads the step output.
          const delimiter = 'PROMPT_EOF_' + context.runId;
          fs.appendFileSync(process.env.GITHUB_ENV, 'PROMPT<<' + delimiter + '\n' + prompt + '\n' + delimiter + '\n', 'utf8');
          core.setOutput('prompt', prompt);
          core.setOutput('issue', issue);
          core.setOutput('entity', entity);
          core.setOutput('feature_branch', featureBranch);
