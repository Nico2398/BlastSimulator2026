name: "Rescue an unfinished agent run"
description: >
  Runs after the agent step in both runners, with `if: always()`. An agent
  session that ends before opening its PR — a crash, the job timeout, a
  cancellation, or a turn ended while work was still outstanding — leaves
  `pipeline/feature-<N>` on the runner's disk and nowhere else, and the VM is
  reclaimed minutes later. This pushes that branch and opens a draft PR, so the
  work survives and the failure is visible immediately instead of surfacing
  hours later as a watchdog sweep over branches that no longer exist.

  It also settles the issue — but only an issue the run did not settle itself.
  A session that closed its issue, said `blocked`, or `paused` itself behind a
  dependency it filed has already accounted for itself, and this action stays
  silent on all three: re-labelling would fire a duplicate notification, and on a
  `paused` issue it would take the issue back out of the queue the pause had just
  returned it to. What is left is a session that ended saying nothing, where
  leaving `in-progress` defers every later assignment behind a run that no longer
  exists. Those end `blocked`, which is a terminal state and an entry point at
  once: handle-failure.yml notifies on that label and chains to the next
  assignable issue, and agentic-assign skips the blocked one. A run that already
  opened its own PR is left alone.

  The chain is why the label has to be applied with the PAT and why it must not
  be applied twice: a second `blocked` on the same issue re-enters the chain.

inputs:
  token:
    description: >
      Token used to push the branch and open the PR. Must be a PAT — a PR opened
      with GITHUB_TOKEN raises no `pull_request` event, so auto-assign-next.yml
      would stay dormant, and GITHUB_TOKEN can never push a `.github/workflows/`
      change at all. It is passed to `git push` as an explicit remote URL rather
      than left to the job's git credentials, which the agent step rewrites.
    required: true
  issue:
    description: "Issue number the run was working on. Empty disables the step."
    required: true
  branch:
    description: >
      The feature branch this run was told to build, `pipeline/feature-<issue>-<runId>`.
      Optional: when it is empty, or the run named its branch differently, the
      step falls back to whichever branch of that issue's family is on disk.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Push the feature branch and open a draft PR if the run left one behind
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ISSUE: ${{ inputs.issue }}
        EXPECTED_BRANCH: ${{ inputs.branch }}
      run: |
        set -euo pipefail

        if [ -z "${ISSUE}" ]; then
          echo "No issue number — nothing to rescue."
          exit 0
        fi

        # Whether the run already settled this issue itself.
        #
        # Three ways it can have: closed it (an answer or a command, not a diff),
        # said `blocked` (a human has to act), or said `paused` (a dependency it
        # filed has to land, and the issue is back at `ready` behind it). All
        # three are terminal, all three release the queue, and in all three the
        # session has already explained itself on the issue.
        #
        # This is checked before anything is *said*, not only before the label is
        # applied. Issue #707's run did exactly what the skill asks — reported an
        # unrunnable verification channel, filed #730 for it, escalated — and the
        # no-branch path below still commented that it had "concluded that no code
        # change was needed without saying so", one comment under where it said
        # so. The label was correctly left alone; only the alarm was wrong.
        already_settled() {
          local state labels
          state="$(gh issue view "${ISSUE}" --json state --jq .state)"
          if [ "${state}" != "OPEN" ]; then
            echo "Issue #${ISSUE} is closed — the run settled it."
            return 0
          fi
          labels="$(gh issue view "${ISSUE}" --json labels --jq '.labels[].name')"
          if printf '%s\n' "${labels}" | grep -qxE 'blocked|paused'; then
            echo "Issue #${ISSUE} already carries a terminal label — the run stated its own outcome."
            return 0
          fi
          return 1
        }

        # Hand the issue to a human and release the queue behind it. Idempotent:
        # re-labelling an already-settled issue would fire a second
        # handle-failure notification for the same halt, and on a `paused` issue
        # it would be worse than duplicate — `blocked` would take the issue back
        # out of the queue the pause had just returned it to, stranding it and
        # its resume branch until somebody noticed.
        escalate() {
          if already_settled; then
            echo "Not escalating."
            return 0
          fi
          # `blocked` first: the issue is never left holding neither label, and
          # `--remove-label` on a label that is not there is not an error worth
          # failing the rescue over.
          gh issue edit "${ISSUE}" --add-label blocked
          gh issue edit "${ISSUE}" --remove-label in-progress || true
          echo "Issue #${ISSUE} labelled \`blocked\` — the assignment chain is released."
        }

        # Which branch this run built. A work branch is
        # `pipeline/feature-<issue>-<runId>`, unique per run, which is what stops
        # a run from ever contending for the name an earlier one left behind:
        # run 166 on #554 built `pipeline/feature-554` while run 160's abandoned
        # branch of that name was still on the remote, and this push died
        # `non-fast-forward` with six hours of finished work on it.
        #
        # The name the runner passed in comes first. If the session named its
        # branch something else in the family, take the one with the most recent
        # commit — but never a bare-named branch from an older run: only a local
        # branch this VM created can hold work worth rescuing, and the
        # `fetch-depth` checkout brings no other `pipeline/*` ref down.
        BRANCH=""
        if [ -n "${EXPECTED_BRANCH}" ] && git rev-parse --verify --quiet "${EXPECTED_BRANCH}" >/dev/null; then
          BRANCH="${EXPECTED_BRANCH}"
        else
          BRANCH="$(git for-each-ref --sort=-committerdate --format='%(refname:short)' \
            "refs/heads/pipeline/feature-${ISSUE}" "refs/heads/pipeline/feature-${ISSUE}-*" | head -n 1)"
        fi
        # Nothing on disk: keep the name the run was supposed to build, so the
        # "produced nothing" comment below still says which branch is missing.
        BRANCH="${BRANCH:-${EXPECTED_BRANCH:-pipeline/feature-${ISSUE}}}"
        echo "Rescue target: ${BRANCH}"
        # "Check the runner logs" is not actionable without the link. Every
        # comment and PR body below carries it, because the run that wrote them
        # is the only place the failure is explained.
        RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        PUSH_LOG=/tmp/agentic-rescue-push.log

        # A PR from this branch that is open or already merged means the run
        # finished its job. Nothing to rescue, nothing to escalate, and re-opening
        # one would duplicate the deliverable. A *closed* PR is not that: the run
        # produced something and it was rejected, which still needs settling.
        if [ "$(gh pr list --head "${BRANCH}" --state all --json state --jq '[.[] | select(.state != "CLOSED")] | length')" != "0" ]; then
          echo "PR already exists from ${BRANCH} — the run finished. Nothing to rescue."
          exit 0
        fi

        # No feature branch at all. Two very different runs land here and the
        # difference is whether the issue was settled: a run that died before the
        # cherry-pick left the issue open and unlabelled and needs the alarm,
        # while a run that closed, blocked or paused the issue already said what
        # happened and needs silence. A silent death is what this action exists to
        # prevent; contradicting a run that spoke is not the same service.
        # The comment mentions no agent handle, so it cannot re-trigger a runner.
        if ! git rev-parse --verify --quiet "${BRANCH}" >/dev/null; then
          echo "No ${BRANCH} on disk — nothing to push."
          if already_settled; then
            echo "Nothing to report: the run produced no branch because it did not need one."
            exit 0
          fi
          cat > /tmp/agentic-rescue-body.md <<EOF
        🧯 **The agent run ended without producing \`${BRANCH}\`.**

        No branch was left on the runner, so there is nothing to salvage and no pull request to open. Either the run died before the cherry-pick, or it concluded that no code change was needed without saying so.

        Runner logs: ${RUN_URL}

        Marking this \`blocked\` rather than leaving it \`in-progress\`: the session is over, so nothing is left to wait for, and the assignment chain must not defer behind a run that no longer exists. Re-running starts the work over from \`main\`.
        EOF
          gh issue comment "${ISSUE}" --body-file /tmp/agentic-rescue-body.md
          escalate
          exit 0
        fi

        # The branch exists but carries nothing. Same outcome as no branch at all,
        # and the same distinction: a run that produced no deliverable and settled
        # nothing still holds the queue, and a run that settled its issue has
        # already accounted for itself.
        if [ "$(git rev-list --count "main..${BRANCH}")" = "0" ]; then
          echo "${BRANCH} has no commits beyond main — nothing to rescue."
          if already_settled; then
            echo "Nothing to report: the run produced no commits because it did not need any."
            exit 0
          fi
          cat > /tmp/agentic-rescue-body.md <<EOF
        🧯 **The agent run created \`${BRANCH}\` and committed nothing to it.**

        The branch is identical to \`main\`, so there is no work to push and no pull request to open. The run reached the point of creating its feature branch and stopped before producing a diff.

        Runner logs: ${RUN_URL}

        Marking this \`blocked\` rather than leaving it \`in-progress\`, so the assignment chain is not held behind a finished session. Re-running starts the work over from \`main\`.
        EOF
          gh issue comment "${ISSUE}" --body-file /tmp/agentic-rescue-body.md
          escalate
          exit 0
        fi

        echo "Rescuing ${BRANCH} — the run ended before opening its PR."

        # `git push` never reads GH_TOKEN. It authenticates with whatever the
        # job's git configuration carries, and by the time this action runs the
        # agent step has replaced that with its own GitHub App installation
        # token. That token cannot push a `.github/workflows/` change under any
        # configuration — `permissions:` has no `workflows` key to grant — so a
        # branch that differs from main on a workflow file is rejected outright,
        # which is how issue #404 lost a three-hour run. Pushing to an explicitly
        # authenticated URL makes the PAT this action is handed the credential
        # that is actually used. Actions masks the secret in the log.
        REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

        push_branch() {
          for attempt in 1 2 3 4; do
            if git push "${REMOTE}" "refs/heads/${BRANCH}:refs/heads/${BRANCH}" >"${PUSH_LOG}" 2>&1; then
              cat "${PUSH_LOG}"
              return 0
            fi
            cat "${PUSH_LOG}"
            if [ "${attempt}" = "4" ]; then
              return 1
            fi
            sleep $(( 2 ** attempt ))
          done
        }

        # A push that cannot be retried into success still has to be reported.
        # This action exists so that a run ending early does not end silently,
        # and an `::error::` in a job log nobody is watching is silence: the
        # issue keeps `in-progress`, the chain stalls behind it, and the only
        # account of what happened dies with the VM in minutes.
        if ! push_branch; then
          # Actions masks secrets in the job log but not in an API request body,
          # and this text is about to be posted on a public issue. Git redacts
          # credentials from the URLs it prints, so this is belt and braces —
          # but the belt has to be there before the output leaves the runner.
          # An empty pattern would match between every character, so the guard
          # is load-bearing: an unset secret arrives as an empty string.
          PUSH_ERROR="$(cat "${PUSH_LOG}")"
          if [ -n "${GH_TOKEN}" ]; then
            PUSH_ERROR="${PUSH_ERROR//${GH_TOKEN}/***}"
          fi

          {
            echo "🧯 **The agent run ended early and its branch could not be saved.**"
            echo
            echo "\`${BRANCH}\` held everything this run produced. The push was rejected, so it dies with the runner VM."
            echo
            echo "\`\`\`"
            printf '%s\n' "${PUSH_ERROR}"
            echo "\`\`\`"
            echo
            if grep -qiE "without .(workflows. permission|workflow. scope)" "${PUSH_LOG}"; then
              echo "The rejection is about \`.github/workflows/\`, not about the network: the pushing credential is not allowed to carry a workflow-file change. Grant \`PAT_TOKEN_COPILOT_AUTOMATION\` the \`workflow\` scope, or land the workflow part of this issue by hand."
              echo
            fi
            echo "### What was lost"
            echo
            echo "\`\`\`"
            git log --oneline -50 "main..${BRANCH}"
            echo
            git diff --stat --stat-count=40 "main...${BRANCH}"
            echo "\`\`\`"
            echo
            echo "Runner logs: ${RUN_URL}"
            echo
            echo "Marking this \`blocked\`: the work is gone and the session is over, so holding \`in-progress\` would only defer every later assignment behind a run that no longer exists. Re-running the issue starts the work over from \`main\`."
          } > /tmp/agentic-rescue-body.md
          gh issue comment "${ISSUE}" --body-file /tmp/agentic-rescue-body.md
          # Before `escalate`, so the diagnosis reaches the log even if labelling
          # is what fails. The step exits non-zero either way.
          echo "::error::Could not push ${BRANCH} after 4 attempts. The work is lost with this runner; the loss is reported on issue #${ISSUE}."
          escalate
          exit 1
        fi

        # Draft, and deliberately without `READY TO MERGE`: this PR is
        # unreviewed and unvalidated by definition. `Closes #N` records the PR
        # as closing the issue — and the head branch is `pipeline/feature-<N>`
        # — so the watchdog and the single-flight check, which accept exactly
        # those two links and ignore mere mentions, see that the work exists.
        cat > /tmp/agentic-rescue-body.md <<EOF
        Closes #${ISSUE}

        🧯 **Rescued branch — the agent run ended before opening its own PR.**

        This PR was opened by \`agentic-rescue\`, not by the pipeline. The run reached at least the cherry-pick onto \`${BRANCH}\`, then stopped: a crash, the job timeout, a cancellation, or a turn ended while delegated work was still outstanding. Without this the branch would have been discarded with the runner VM.

        **Treat it as evidence, not as a deliverable.** It has not passed code review, refactoring, or validation, and no verification channel result should be assumed. Read the runner logs — ${RUN_URL} — before deciding whether to finish it or drop it and re-run the issue.

        It stays a draft and carries no \`READY TO MERGE\` line, so auto-merge will not pick it up. The issue is labelled \`blocked\`, so the pipeline moves on to the next one instead of waiting on this: resuming it is a human decision — finish this branch, or drop it and add \`ready\` back to the issue.
        EOF

        # A run that paused itself and then died before opening its own resume
        # pull request would otherwise be rescued into a trap: the issue is back
        # at `ready` waiting for its dependency, and this unlabelled pull request
        # would make it unassignable to everyone forever, because `assessCandidate`
        # reads any open deliverable PR without `paused` as a run in flight. The
        # label is what turns this PR from a collision into the handover the pause
        # intended.
        RESCUE_LABEL=()
        if gh issue view "${ISSUE}" --json labels --jq '.labels[].name' | grep -qx 'paused'; then
          gh label create paused --color fbca04 --force \
            --description "A run stopped here on a dependency; the queue returns to it when that dependency lands" || true
          RESCUE_LABEL=(--label paused)
          echo "Issue #${ISSUE} is paused — labelling the rescued pull request \`paused\` so the next run resumes from it."
        fi

        gh pr create \
          --draft \
          --base main \
          --head "${BRANCH}" \
          --title "wip: unfinished pipeline run for #${ISSUE}" \
          "${RESCUE_LABEL[@]}" \
          --body-file /tmp/agentic-rescue-body.md

        # The branch is safe, but the run still did not finish the issue. Left
        # `in-progress` with a draft PR attached, the issue passes both the
        # single-flight check and the watchdog's linked-PR skip — it would hold
        # the queue for as long as the draft stays open, which is until somebody
        # notices. `blocked` is the honest state: work preserved, human notified
        # by handle-failure.yml, queue released.
        escalate
